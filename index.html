      }

      // Check built-in Unit 5 German dictionary first
      for (const [trWord, deInfo] of Object.entries(GERMAN_UNIT5_DICT)) {
        if (qLower.includes(trWord)) {
          parts.push("🇩🇪 MEB Almanca 5. Ünite (Essen und Trinken) Sözlüğü:\n• " + trWord.toUpperCase() + " → " + deInfo);
        }
      }

      // Live online translation & Wikipedia fallback directly from browser
      try {
        const cleanWord = q.replace(/almanca(da|sı)?|ne demek|nedir|[?.,!]/gi, '').trim();
        if (cleanWord.length >= 2 && navigator.onLine) {
          const [trDe, deTr] = await Promise.all([
            fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(cleanWord) + '&langpair=tr|de').then(r => r.ok ? r.json() : null).catch(() => null),
            fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(cleanWord) + '&langpair=de|tr').then(r => r.ok ? r.json() : null).catch(() => null)
          ]);
          if (trDe?.responseData?.translatedText || deTr?.responseData?.translatedText) {
            parts.push("🌐 Canlı Almanca-Türkçe Sözlük ('" + cleanWord + "'):\n• Türkçe → Almanca: " + (trDe?.responseData?.translatedText || '-') + "\n• Almanca → Türkçe: " + (deTr?.responseData?.translatedText || '-'));
          }
          const wikiRes = await fetch('https://tr.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + encodeURIComponent(cleanWord) + '&utf8=&format=json&origin=*&srlimit=1').then(r => r.ok ? r.json() : null).catch(() => null);
          const firstTitle = wikiRes?.query?.search?.[0]?.title;
          if (firstTitle) {
            const sumData = await fetch('https://tr.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(firstTitle)).then(r => r.ok ? r.json() : null).catch(() => null);
            if (sumData?.extract) {
              parts.push("📖 Ansiklopedi Özeti (" + sumData.title + "):\n" + sumData.extract);
            }
          }
        }
      } catch (e) {}

      // Topic explanation match
      parts.push("📚 " + subject.name + " (" + topic.title + ") Özeti:\n• " + topic.simpleExplanation.oneSentenceSummary + "\n• Günlük Hayat Örneği: " + topic.simpleExplanation.dailyLifeAnalogy + "\n• Sınav İpucu: " + (topic.examSummary[0] || topic.outcomeDescription));

      aiDiv.textContent = parts.join("\n\n");
      log.scrollTop = log.scrollHeight;
    }

    function renderTopics() {
      const container = document.getElementById('view-topics');
      const subjectTopics = DATA.topics.filter(t => t.subjectId === selectedSubjectId);
      const topic = subjectTopics.find(t => t.id === selectedTopicId) || subjectTopics[0] || DATA.topics[0];
      const fcList = topic.flashcards || [];
      const currentCard = fcList[flashcardIndex] || { frontQuestion: topic.title, backAnswer: topic.outcomeDescription, tag: topic.outcomeCode };

      let html = '<div class="subject-scroll">';
      for (const s of DATA.subjects) {
        html += '<button class="subj-btn ' + (s.id === selectedSubjectId ? 'active' : '') + '" onclick="selectSubject(\'' + s.id + '\')">' + s.shortName + '</button>';
      }
      html += '</div>';

      if (subjectTopics.length > 1) {
        html += '<div class="subject-scroll" style="margin-top:6px;">';
        for (const t of subjectTopics) {
          html += '<button class="subj-btn ' + (t.id === topic.id ? 'active' : '') + '" onclick="selectTopic(\'' + t.id + '\')">' + t.outcomeCode + ' · ' + t.title + '</button>';
        }
        html += '</div>';
      }

      html += '<div class="card">';
      html += '<span class="badge">' + topic.unitTitle + '</span>';
      html += '<span class="badge">' + topic.outcomeCode + '</span>';
      html += '<span class="badge">📄 ' + topic.sourcePages + '</span>';
      html += '<h2 style="font-size:19px;font-weight:800;margin-top:4px;">' + topic.title + '</h2>';
      html += '<p style="font-size:13px;color:#475569;margin-top:4px;">' + topic.outcomeDescription + '</p>';

      html += '<div class="mode-switch">';
      html += '<button class="mode-btn ' + (explanationMode === 'simple' ? 'active' : '') + '" onclick="setExpMode(\'simple\')">💡 Sıfırdan Basit Anlatım</button>';
      html += '<button class="mode-btn ' + (explanationMode === 'textbook' ? 'active' : '') + '" onclick="setExpMode(\'textbook\')">📘 MEB Kitap Özeti</button>';
      html += '</div>';

      if (explanationMode === 'simple') {
        html += '<div class="point-box" style="background:#ECFDF5;border-color:#A7F3D0;">';
        html += '<div style="font-weight:800;color:#065F46;font-size:14px;">🎯 Tek Cümlede Konunun Özeti</div>';
        html += '<p style="font-size:13.5px;margin-top:4px;">' + topic.simpleExplanation.oneSentenceSummary + '</p>';
        html += '<div style="margin-top:8px;font-size:12.5px;color:#047857;"><strong>🏠 Günlük Hayat Benzetmesi:</strong> ' + topic.simpleExplanation.dailyLifeAnalogy + '</div>';
        html += '</div>';

        for (const step of topic.simpleExplanation.stepByStepEasyPoints) {
          html += '<div class="point-box">';
          html += '<div style="font-weight:800;font-size:14px;">' + step.title + '</div>';
          html += '<p style="font-size:13px;margin-top:4px;">' + step.plainExplanation + '</p>';
          html += '<div class="summary-box">🔑 Akılda Tutma Şifresi: ' + step.memoryTrick + '</div>';
          html += '</div>';
        }
      } else {
        for (const lp of topic.lecturePoints) {
          html += '<div class="point-box">';
          html += '<div style="font-weight:800;font-size:14px;">' + lp.heading + '</div>';
          html += '<p style="font-size:13px;margin-top:4px;">' + lp.content + '</p>';
          if (lp.formulaOrRule) {
            html += '<div style="margin-top:6px;padding:7px 10px;background:#EEF2FF;border-radius:8px;font-family:monospace;font-size:12px;font-weight:700;color:#3730A3;">📐 ' + lp.formulaOrRule + '</div>';
          }
          html += '<div class="summary-box">✨ ' + lp.summaryOfSummary + '</div>';
          html += '</div>';
        }
      }
      html += '</div>';

      // Flashcards
      html += '<div class="card">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
      html += '<h3 style="font-size:15px;font-weight:800;">🃏 Hızlı Hafıza Kartları (' + (flashcardIndex + 1) + '/' + fcList.length + ')</h3>';
      html += '<span style="font-size:11px;color:#4F46E5;font-weight:700;">Çevirmek için karta dokun</span>';
      html += '</div>';
      html += '<div class="flashcard" onclick="flipCard()">';
      html += '<span style="font-size:11px;font-weight:800;color:#4F46E5;text-transform:uppercase;">' + (flashcardFlipped ? '✅ CEVAP' : '❓ SORU · ' + currentCard.tag) + '</span>';
      html += '<div style="font-size:15px;font-weight:800;color:#1E1B4B;">' + (flashcardFlipped ? currentCard.backAnswer : currentCard.frontQuestion) + '</div>';
      html += '</div>';
      html += '<div style="display:flex;justify-content:space-between;margin-top:10px;">';
      html += '<button class="chip-btn" onclick="nextCard(-1,' + fcList.length + ')">⬅️ Önceki Kart</button>';
      html += '<button class="chip-btn" onclick="flipCard()">🔄 Kartı Çevir</button>';
      html += '<button class="chip-btn" onclick="nextCard(1,' + fcList.length + ')">Sonraki Kart ➡️</button>';
      html += '</div>';
      html += '</div>';

      // Exam Traps
      html += '<div class="card">';
      html += '<h3 style="font-size:15px;font-weight:800;">⚠️ Sınavda En Çok Yapılan Hatalar (Ters Köşe Uyarıları)</h3>';
      for (const tr of topic.traps) {
        html += '<div class="trap-box">';
        html += '<div style="color:#991B1B;font-weight:700;">❌ Yanlış Düşünce: ' + tr.wrongThinking + '</div>';
        html += '<div style="color:#065F46;font-weight:700;margin-top:4px;">✅ Doğrusu: ' + tr.correctThinking + '</div>';
        html += '</div>';
      }
      html += '</div>';

      // Gemini & Live Dictionary Assistant
      html += '<div class="ai-box">';
      html += '<div style="font-size:15px;font-weight:800;color:#1E1B4B;">🤖 Google & Almanca Sözlük Bağlantılı Gemini AI Asistanı</div>';
      html += '<p style="font-size:12px;color:#4338CA;margin-top:2px;">Konuyla ilgili soru sor, Almanca-Türkçe kelime ara veya örnek sınav sorusu iste:</p>';
      html += '<div style="margin-top:8px;">';
      html += '<button class="chip-btn" onclick="askGeminiAssistant(\'Bu konuyu hiç bilmeyene anlat\')">💡 Hiç bilmeyene anlat</button>';
      html += '<button class="chip-btn" onclick="askGeminiAssistant(\'elma ve çilek almanca ne demek\')">🇩🇪 Elma & Çilek Almanca ne demek?</button>';
      html += '<button class="chip-btn" onclick="askGeminiAssistant(\'Sınavda kesin çıkacak noktalar neler?\')">🎯 Sınav tüyoları</button>';
      html += '</div>';
      html += '<div id="chatLog" class="chat-log">';
      html += '<div class="msg-ai">Merhaba! Şu an <strong>' + topic.title + '</strong> konusundasın. Bana istediğin soruyu veya Almanca kelimeyi sorabilirsin!</div>';
      html += '</div>';
      html += '<div class="input-row">';
      html += '<input id="aiInput" class="text-input" placeholder="Sorunu veya Almanca kelimeyi yaz..." onkeydown="if(event.key===\'Enter\')askGeminiAssistant()" />';
      html += '<button class="indigo-btn" onclick="askGeminiAssistant()">Sor</button>';
      html += '</div>';
      html += '</div>';

      container.innerHTML = html;
    }

    function renderPlan() {
      const container = document.getElementById('view-plan');
      const dayObj = DATA.studyPlan.find(d => d.day === selectedDay) || DATA.studyPlan[0];
      let html = '<div class="subject-scroll">';
      for (const d of DATA.studyPlan) {
        html += '<button class="subj-btn ' + (d.day === selectedDay ? 'active' : '') + '" onclick="selectedDay=' + d.day + ';renderPlan()">' + d.day + '. Gün</button>';
      }
      html += '</div>';
      html += '<div class="card">';
      html += '<span class="badge">HEDEF KATKI: +' + dayObj.targetScoreContribution + ' PUAN</span>';
      html += '<h2 style="font-size:18px;font-weight:800;">' + dayObj.day + '. Gün: ' + dayObj.title + '</h2>';
      html += '<p style="font-size:13px;color:#475569;margin-top:4px;">' + dayObj.focusSummary + '</p>';
      for (const task of dayObj.dailyTasks) {
        html += '<div class="point-box">';
        html += '<div style="font-weight:800;font-size:13.5px;">✅ ' + task.label + ' (' + task.durationMinutes + ' dk)</div>';
        html += '</div>';
      }
      html += '</div>';
      container.innerHTML = html;
    }

    function selectQuizAnswer(qId, ans) {
      quizAnswers[qId] = ans;
      renderQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('view-quiz');
      const filtered = quizSubject === 'all' ? DATA.questions : DATA.questions.filter(q => q.subjectId === quizSubject);
      const q = filtered[quizIndex % filtered.length] || DATA.questions[0];
      const userAns = quizAnswers[q.id];

      let html = '<div class="subject-scroll">';
      html += '<button class="subj-btn ' + (quizSubject === 'all' ? 'active' : '') + '" onclick="quizSubject=\'all\';quizIndex=0;renderQuiz()">Tüm Dersler (' + DATA.questions.length + ')</button>';
      for (const s of DATA.subjects) {
        html += '<button class="subj-btn ' + (quizSubject === s.id ? 'active' : '') + '" onclick="quizSubject=\'' + s.id + '\';quizIndex=0;renderQuiz()">' + s.shortName + '</button>';
      }
      html += '</div>';

      html += '<div class="card">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
      html += '<span class="badge">SORU ' + ((quizIndex % filtered.length) + 1) + ' / ' + filtered.length + '</span>';
      html += '<span class="badge">' + q.outcomeCode + '</span>';
      html += '</div>';
      html += '<h3 style="font-size:16px;font-weight:800;margin-top:8px;">' + q.questionText + '</h3>';

      const opts = q.options || (q.type === 'true_false' ? ['Doğru', 'Yanlış'] : [q.correctAnswer]);
      for (const opt of opts) {
        let cls = 'opt-btn';
        if (userAns) {
          if (opt === q.correctAnswer) cls += ' correct';
          else if (opt === userAns) cls += ' wrong';
        }
        const safeOpt = opt.replace(/'/g, "\\'");
        html += '<button class="' + cls + '" onclick="selectQuizAnswer(\'' + q.id + '\', \'' + safeOpt + '\')">' + opt + '</button>';
      }

      if (userAns) {
        html += '<div class="summary-box" style="margin-top:12px;">';
        html += '<strong>' + (userAns === q.correctAnswer ? '🎉 Doğru Cevap!' : '💡 Doğru Cevap: ' + q.correctAnswer) + '</strong><br/>' + q.explanation;
        html += '</div>';
      }

      html += '<div style="display:flex;justify-content:space-between;margin-top:14px;">';
      html += '<button class="chip-btn" onclick="quizIndex=Math.max(0,quizIndex-1);renderQuiz()">⬅️ Önceki Soru</button>';
      html += '<button class="primary-btn" onclick="quizIndex=(quizIndex+1)%' + filtered.length + ';renderQuiz()">Sonraki Soru ➡️</button>';
      html += '</div>';
      html += '</div>';

      container.innerHTML = html;
    }

    renderTopics();
  </script>
</body>
</html>
