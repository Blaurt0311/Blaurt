},{"id":"dkab","name":"Din Kültürü ve Ahlak Bilgisi","shortName":"DKAB","scenarioCount":"4 Senaryo","examFormatNote":"İslam’da Bilgi Kaynakları, Allah-Âlem İlişkisi, İsra 36 & Mülk 23, Allah’ın Varlığının Delilleri (Senaryo 1-3)","primaryPdfId":"pdf-dkab-dk","accentColor":"#0F766E"},{"id":"edebiyat","name":"Türk Dili ve Edebiyatı","shortName":"TDE","scenarioCount":"Ortak Sınav","examFormatNote":"Ülke Geneli Ortak Yazılı: 1. Tema Sözün Ezgisi (Koşuk, Koşma, Türkü, Ninni, Masal) & 2. Tema Kelimelerin Ritmi (Gazel, Kaside, Saf Şiir)","primaryPdfId":"pdf-tar-dk","accentColor":"#BE123C"},{"id":"almanca","name":"Almanca (5. Ünite)","shortName":"ALM","scenarioCount":"Sadece 5. Ünite","examFormatNote":"Themenkreis 5: Essen und Trinken (Sayfa 54–63 & 102) — Lebensmittel, Obst & Gemüse, Esszeiten, Modalverb mögen, Konjunktion aber, Wie viel kostet/kosten, Mengenangaben ve Rezept","primaryPdfId":"pdf-alm-dk","accentColor":"#D97706"}],"topics":[{"id":"mat-10-1-1","subjectId":"matematik","unitTitle":"Geometrik Şekiller","title":"Dik Üçgende Trigonometrik Oranlar ve Trigonometrik Özdeşlikler","outcomeCode":"MAT.10.1.1","outcomeDescription":"Dik üçgende trigonometrik oranlara (sinüs, kosinüs, tanjant, kotanjant) ve trigonometrik özdeşliklere ilişkin çıkarım yapabilme","scenarios":"Tüm Senaryolar (Senaryo 1–5)","sourcePages":"Sayfa 16–38","lecturePoints":[{"heading":"Dik Üçgende Dar Açının Trigonometrik Oranları","content":"Bir dik üçgende dar açı x olmak üzere; sin(x) karşı dik kenarın hipotenüse oranı, cos(x) komşu dik kenarın hipotenüse oranı, tan(x) karşı dik kenarın komşu dik kenara oranı ve cot(x) komşu dik kenarın karşı dik kenara oranıdır.","formulaOrRule":"sin(x) = Karşı / Hipotenüs · cos(x) = Komşu / Hipotenüs · tan(x) = Karşı / Komşu · cot(x) = Komşu / Karşı","summaryOfSummary":"Özetin Özeti: Seçtiğin köşeden karşıdaki kenara bakıyorsan \"Karşı\", hemen yanındaki dik kenara bakıyorsan \"Komşu\", 90 derecenin karşısındaki en uzun yokuşa bakıyorsan \"Hipotenüs\" dersin. Sinüs ve Kosinüs her zaman en uzun kenara (Hipotenüse) bölünür; Tanjant ve Kotanjant ise iki dik kenarı birbirine böler."},{"heading":"Temel Trigonometrik Özdeşlikler ve Pisagor Bağıntısı","content":"Dik üçgende a² + b² = c² (Pisagor teoremi) eşitliğinin her iki tarafı hipotenüsün karesi c² ile bölündüğünde en kritik özdeşlik olan sin²(x) + cos²(x) = 1 elde edilir. Ayrıca tan(x)·cot(x) = 1 eşitliği her dar açı için geçerlidir.","formulaOrRule":"sin²(x) + cos²(x) = 1 · tan(x) = sin(x)/cos(x) · cot(x) = cos(x)/sin(x) · tan(x)·cot(x) = 1","summaryOfSummary":"Özetin Özeti: Aynı açının sinüsünün karesi ile kosinüsünün karesini topladığında sonuç her zaman 1 çıkar (sin²x + cos²x = 1). Aynı şekilde aynı açının tanjantı ile kotanjantını çarparsan birbirini sadeleştirir ve sonuç yine 1 olur."},{"heading":"Tümler Açıların Oranları ve Özel Açılar (30°, 45°, 60°)","content":"Toplamları 90° olan iki dar açıdan birinin sinüsü diğerinin kosinüsüne, birinin tanjantı diğerinin kotanjantına eşittir: sin(30°) = cos(60°) = 1/2, sin(45°) = cos(45°) = √2/2, tan(30°) = cot(60°) = √3/3.","formulaOrRule":"x + y = 90° ⇒ sin(x) = cos(y) ve tan(x) = cot(y)","summaryOfSummary":"Özetin Özeti: İki açının toplamı 90 dereceyse (örneğin 30° ve 60° veya 20° ve 70°), birinin sinüsü diğerinin kosinüsüne tıpatıp eşittir. Özel açılarda ise formül ezberlemek yerine 30-60-90 (1 - √3 - 2) üçgenini kağıdın kenarına çizmek sana 10 saniyede tam puan kazandırır."}],"keyConcepts":[{"term":"Trigonometrik Özdeşlik","definition":"Değişkenin tanımlı olduğu tüm açı değerleri için doğrulanan trigonometrik eşitliktir (ör. sin²x + cos²x = 1).","examTip":"Sadeleştirme sorularında 1 yerine sin²x + cos²x veya 1 - sin²x yerine cos²x yazmak soruyu tek adımda çözer.","outcomeCode":"MAT.10.1.1"},{"term":"Tümler Açı Özelliği","definition":"Ölçüleri toplamı 90° olan iki açıdan birinin sinüsünün diğerinin kosinüsüne eşit olması durumudur.","examTip":"sin(20°)/cos(70°) gibi ifadelerin sonucu doğrudan 1’dir.","outcomeCode":"MAT.10.1.1"}],"examSummary":["Hipotenüs (90° dik açının tam karşısındaki en uzun yokuş kenar) her zaman dik kenarlardan büyüktür; bu yüzden dar açıların sinüs ve kosinüs değerleri asla 1’i geçemez (0 ile 1 arasında basit kesirdir).","Sınavda sana sin(x) + cos(x) toplamını verip sin(x)·cos(x) çarpımını sorarlarsa hiç korkma: Her iki tarafın karesini al, ortaya çıkan sin²(x) + cos²(x) yerine direkt 1 yaz, cevap kendiliğinden çıkar!","Özel üçgenleri ezberlemek yerine şifreyi kur: 30°-60°-90° üçgeninde 30°’nin karşısı 1 adım ise 90°’nin karşısı 2 katı (2 adım), 60°’nin karşısı ise √3 adımdır; 45°-45°-90° ikizkenar üçgeninde ise dik kenarlar 1-1, en uzun kenar √2’dir."],"simpleExplanation":{"oneSentenceSummary":"Trigonometri korkulacak bir şey değil: Bir dik üçgende kenarları birbirine bölüp bunlara takma isim (sinüs, kosinüs, tanjant, kotanjant) vermekten ibarettir!","dailyLifeAnalogy":"Duvara yaslanmış bir merdiven düşün. Merdivenin kendisi en uzun kenardır (Hipotenüs). Yerde durduğun köşeden baktığında tam karşındaki duvar \"Karşı kenar\", ayağının bastığı yer ise \"Komşu kenar\"dır.","stepByStepEasyPoints":[{"title":"1. Sinüs, Kosinüs, Tanjant, Kotanjant Aslında Nedir?","plainExplanation":"Durduğun açıyı seç. Karşındaki duvarı merdivene bölersen SİNÜS; yerdeki halıyı merdivene bölersen KOSİNÜS; duvarı halıya bölersen TANJANT; halıyı duvara bölersen KOTANJANT olur. Hepsi sadece iki sayıyı birbirine bölmektir!","memoryTrick":"Kısa Şifre: SİN = Karşı/Hipotenüs · COS = Komşu/Hipotenüs · TAN = Karşı/Komşu"},{"title":"2. Neden sin²(x) + cos²(x) her zaman 1 çıkıyor?","plainExplanation":"Çünkü Pisagor amca \"dik kenarların karelerini toplarsan merdivenin (hipotenüsün) karesini bulursun\" demişti (örneğin 3² + 4² = 5²). İkisini de 5²’ye böldüğünde (3/5)² + (4/5)² = 9/25 + 16/25 = 25/25 = 1 çıkar!","memoryTrick":"Sınavda sin²x + cos²x gördüğün her yere gözü kapalı 1 yaz!"},{"title":"3. Birbirini 90 dereceye tamamlayan kardeş açılar","plainExplanation":"İki açının toplamı 90° ise (mesela 30° ile 60° veya 20° ile 70°), birinin baktığı \"karşı duvar\" öbürünün \"komşusu\" olur. Bu yüzden sin(20°) ile cos(70°) birebir aynı sayıdır!","memoryTrick":"Toplamları 90° ise: sin = cos ve tan = cot olur."}]},"jargons":[{"term":"Hipotenüs","everydayMeaning":"Dik üçgende 90 derecelik dik köşenin tam karşısında duran en uzun, eğimli kenar.","realLifeExample":"Duvara dayalı bir merdivenin kendisi hipotenüstür; duvar ve yer ise dik kenarlardır."},{"term":"Trigonometrik Özdeşlik","everydayMeaning":"İçindeki açı kaç derece olursa olsun sonucu hiç değişmeyen, her zaman doğru çıkan eşitlik.","realLifeExample":"Açı 15° de olsa 73° de olsa sin²(x) + cos²(x) işleminin sonucu her zaman 1 çıkar."},{"term":"Tümler Açılar","everydayMeaning":"Toplamları tam 90 derece yapan iki kardeş açı.","realLifeExample":"20° ile 70° tümlerdir; bu yüzden birinin sinüsü diğerinin kosinüsüne eşittir."}],"traps":[{"wrongThinking":"Dar açının sinüsü veya kosinüsü 4/3 (1’den büyük) olabilir sanmak.","correctThinking":"Hipotenüs en uzun kenar olduğu için payda her zaman daha büyüktür; dar açıda sin ve cos asla 1’i geçemez!"},{"wrongThinking":"Üçgende hangi açı sorulursa sorulsun \"Karşı kenar\" hep aynı kenardır sanmak.","correctThinking":"Baktığın köşe (açı) değişince \"Karşı\" ve \"Komşu\" dik kenarlar birbiriyle yer değiştirir!"}],"flashcards":[{"id":"mat-10-1-1-fc-step-0","frontQuestion":"Sinüs, Kosinüs, Tanjant, Kotanjant Aslında Nedir?","backAnswer":"Durduğun açıyı seç. Karşındaki duvarı merdivene bölersen SİNÜS; yerdeki halıyı merdivene bölersen KOSİNÜS; duvarı halıya bölersen TANJANT; halıyı duvara bölersen KOTANJANT olur. Hepsi sadece iki sayıyı birbirine bölmektir! (Şifre: Kısa Şifre: SİN = Karşı/Hipotenüs · COS = Komşu/Hipotenüs · TAN = Karşı/Komşu)","tag":"Hızlı Kavrama"},{"id":"mat-10-1-1-fc-step-1","frontQuestion":"Neden sin²(x) + cos²(x) her zaman 1 çıkıyor?","backAnswer":"Çünkü Pisagor amca \"dik kenarların karelerini toplarsan merdivenin (hipotenüsün) karesini bulursun\" demişti (örneğin 3² + 4² = 5²). İkisini de 5²’ye böldüğünde (3/5)² + (4/5)² = 9/25 + 16/25 = 25/25 = 1 çıkar! (Şifre: Sınavda sin²x + cos²x gördüğün her yere gözü kapalı 1 yaz!)","tag":"Hızlı Kavrama"},{"id":"mat-10-1-1-fc-step-2","frontQuestion":"Birbirini 90 dereceye tamamlayan kardeş açılar","backAnswer":"İki açının toplamı 90° ise (mesela 30° ile 60° veya 20° ile 70°), birinin baktığı \"karşı duvar\" öbürünün \"komşusu\" olur. Bu yüzden sin(20°) ile cos(70°) birebir aynı sayıdır! (Şifre: Toplamları 90° ise: sin = cos ve tan = cot olur.)","tag":"Hızlı Kavrama"},{"id":"mat-10-1-1-fc-jg-0","frontQuestion":"\"Hipotenüs\" günlük dilde ne demektir?","backAnswer":"Dik üçgende 90 derecelik dik köşenin tam karşısında duran en uzun, eğimli kenar. — Örnek: Duvara dayalı bir merdivenin kendisi hipotenüstür; duvar ve yer ise dik kenarlardır.","tag":"Terim Çevirici"},{"id":"mat-10-1-1-fc-jg-1","frontQuestion":"\"Trigonometrik Özdeşlik\" günlük dilde ne demektir?","backAnswer":"İçindeki açı kaç derece olursa olsun sonucu hiç değişmeyen, her zaman doğru çıkan eşitlik. — Örnek: Açı 15° de olsa 73° de olsa sin²(x) + cos²(x) işleminin sonucu her zaman 1 çıkar.","tag":"Terim Çevirici"},{"id":"mat-10-1-1-fc-jg-2","frontQuestion":"\"Tümler Açılar\" günlük dilde ne demektir?","backAnswer":"Toplamları tam 90 derece yapan iki kardeş açı. — Örnek: 20° ile 70° tümlerdir; bu yüzden birinin sinüsü diğerinin kosinüsüne eşittir.","tag":"Terim Çevirici"}]},{"id":"mat-10-1-2","subjectId":"matematik","unitTitle":"Geometrik Şekiller","title":"Üçgende Yardımcı Elemanlar, Üçgenin Alanı, Sinüs ve Kosinüs Teoremleri","outcomeCode":"MAT.10.1.2-4","outcomeDescription":"10.1.2 Yardımcı elemanlar, 10.1.3 Kenar ve yüksekliğe bağlı alan değişimi, 10.1.4 Sinüs ve Kosinüs teoremlerini doğrulama ve uygulama","scenarios":"Tüm Senaryolar (Senaryo 1–5)","sourcePages":"Sayfa 40–86","lecturePoints":[{"heading":"Üçgende Yardımcı Elemanlar: Kenarortay, Açıortay ve Yükseklik","content":"Üçgende üç kenarortayın kesişim noktası Ağırlık Merkezi (G) olup kenarortayı tabana 1 birim, köşeye 2 birim (k ve 2k) oranında böler. İç açıortaylar iç teğet çemberin merkezinde (I), yükseklikler ise diklik merkezinde (H) kesişir.","formulaOrRule":"|AG| = 2·|GD| · İç Açıortay Teoremi: c / b = m / n","summaryOfSummary":"Özetin Özeti: Kenarortay kenarı iki eşit parçaya, açıortay ise açıyı iki eşit dilime böler. Üç kenarortayın buluştuğu denge noktasına Ağırlık Merkezi (G) denir ve bu nokta çizgiyi her zaman köşeye 2 kat (2k), kenara 1 kat (1k) uzaklıkta böler."},{"heading":"Üçgenin Alanı ve Sinüslü Alan Formülü","content":"Üçgenin alanı bir kenar ile o kenara ait yüksekliğin çarpımının yarısıdır. Yükseklik sabitken taban hangi oranda değişirse alan da aynı oranda değişir. İki kenar ve arasındaki açı biliniyorsa sinüslü alan formülü kullanılır.","formulaOrRule":"Alan(ABC) = (a · h_a) / 2 = (1/2) · b · c · sin(A)","summaryOfSummary":"Özetin Özeti: Üçgenin alanı \"Taban × Yükseklik / 2\" formülüyle bulunur; eğer iki üçgenin tepe noktası aynıysa tabanı geniş olanın alanı da aynı oranda büyüktür. Yükseklik verilmemişse iki kenarı ve aralarındaki açının sinüsünü çarpıp ikiye bölerek alanı şıp diye bulabilirsin."},{"heading":"Sinüs ve Kosinüs Teoremleri","content":"Sinüs teoremi kenarların karşılarındaki açıların sinüslerine oranının çevrel çemberin çapına (2R) eşit olduğunu belirtir. Kosinüs teoremi ise iki kenar ve aradaki açı bilindiğinde üçüncü kenarı veya üç kenar bilindiğinde açıyı bulmayı sağlar.","formulaOrRule":"a/sin(A) = b/sin(B) = c/sin(C) = 2R · a² = b² + c² - 2·b·c·cos(A)","summaryOfSummary":"Özetin Özeti: Soruda iki kenar ve tam aralarındaki açı belliyse karşı kenarı bulmak için Kosinüs Teoremi (gelişmiş Pisagor) kullanılır. Eğer iki açı ve bir kenar verilmişse, kenarları karşılarındaki açıların sinüslerine bölüp eşitlediğimiz Sinüs Teoremi kullanılır."}],"keyConcepts":[{"term":"Ağırlık Merkezi (Sentroid)","definition":"Üçgenin kenarortaylarının kesiştiği nokta; her kenarortayı köşeden 2, kenardan 1 birim oranında böler.","examTip":"Dik üçgende hipotenüse ait kenarortay (muhteşem üçlü) hipotenüsün yarısına eşittir.","outcomeCode":"MAT.10.1.2"},{"term":"Kosinüs Teoremi","definition":"Pisagor teoreminin tüm üçgenlere genelleştirilmiş hâli: a² = b² + c² - 2bc·cos(A).","examTip":"A açısı 90° olduğunda cos(90°)=0 olduğundan denklem doğrudan Pisagor bağıntısına dönüşür.","outcomeCode":"MAT.10.1.4"}],"examSummary":["Tepe noktaları aynı olan (yani boyları/yükseklikleri eşit olan) yan yana iki üçgen görürsen uzun işlem yapma: Tabanı geniş olanın alanı da aynı oranda büyüktür (taban 2 katıysa alan da 2 katıdır).","Ağırlık merkezi (G noktası, yani üçgenin tam denge noktası) kenarortay çizgisini her zaman köşeye 2 parça (2k), tabana 1 parça (1k) olacak şekilde böler ve üçgeni 6 eşit dilime ayırır.","Soruda hangi formülü seçeceğini şöyle şifrele: İki kenar ve tam aralarındaki açı belliyse \"Kosinüs Teoremi\", iki açı ve bir kenar belliyse \"Sinüs Teoremi\" (karşılıklı kenar/sinüs eşitlemesi) kullanılır."],"simpleExplanation":{"oneSentenceSummary":"Bir üçgenin tam denge noktasını (ağırlık merkezini), alanını nasıl kolayca hesaplayacağını ve dik olmayan üçgenlerde kenar bulma kısayollarını öğreniyoruz.","dailyLifeAnalogy":"Karton bir üçgeni parmağının ucunda düşürmeden dengede tuttuğun nokta Ağırlık Merkezi (G)’dir. Bu nokta çizgiyi her zaman köşeye 2 adım (2k), kenara 1 adım (1k) olacak şekilde böler.","stepByStepEasyPoints":[{"title":"1. Kenarortay ve 1’e 2 Kuralı (Ağırlık Merkezi G)","plainExplanation":"Köşeden karşı kenarın tam ortasına çizilen çizgiye kenarortay denir. Üç kenarortayın buluştuğu G noktası, çizgiyi üstten 2 parça, alttan 1 parça (ör. üstü 10 cm ise altı 5 cm) diye ayırır.","memoryTrick":"Köşeye yakın olan kısım her zaman 2 kat uzundur: Köşe = 2k, Kenar = k."},{"title":"2. Üçgenin Alanı Neye Göre Büyür Küçülür?","plainExplanation":"Üçgenin tepesi aynı hizada dururken tabanını 3 katına çıkarırsan alanı da 3 katına çıkar. Yani yükseklik aynıysa, tabanı kim büyükse pastadan büyük dilimi o alır!","memoryTrick":"Tepe noktası ortaksa: Taban oranı = Alan oranı!"},{"title":"3. Ne Zaman Sinüs, Ne Zaman Kosinüs Teoremi?","plainExplanation":"Üçgende iki kenar ve tam aralarındaki açıyı biliyorsan (makas gibi) üçüncü kenarı bulmak için Kosinüs Teoremi kullanırsın. Açılar bolca verilmişse karşılıklı kenar/sinüs oranlarını eşitleyen Sinüs Teoremini kullanırsın.","memoryTrick":"İki kenar + Aradaki Açı = Kosinüs Teoremi · Karşılıklı Açı ve Kenar = Sinüs Teoremi."}]},"jargons":[{"term":"Ağırlık Merkezi (G - Sentroid)","everydayMeaning":"Üçgenin üç kenarortay çizgisinin kesiştiği tam denge noktası.","realLifeExample":"Karton bir üçgeni tam G noktasından parmağının ucuna koyarsan düşmeden dengede durur."},{"term":"Kenarortay ve Açıortay","everydayMeaning":"Kenarortay karşı kenarı tam ortadan ikiye bölen çizgi; açıortay ise köşedeki açıyı iki eşit dilime bölen çizgidir.","realLifeExample":"Pastanın kenarını cetvelle ikiye bölmek kenarortay, dilimin uç açısını ikiye bölmek açıortaydır."},{"term":"Kosinüs Teoremi","everydayMeaning":"90 derece olmayan normal üçgenlerde de kenar bulmamızı sağlayan \"Süper Pisagor\" formülü.","realLifeExample":"İki yürüyüş yolunun uzunluğunu ve aralarındaki açıyı biliyorsan, iki uç arasındaki mesafeyi bu formülle bulursun."}],"traps":[{"wrongThinking":"Ağırlık merkezi (G) kenarortayı tam ortadan (1’e 1) böler sanmak.","correctThinking":"Ağırlık merkezi kenarortayı köşeye 2 birim (2k), kenara 1 birim (1k) oranında böler!"},{"wrongThinking":"Kosinüs teoreminde aradaki açı geniş açı (ör. 120°) olduğunda işareti eksi bırakmak.","correctThinking":"Geniş açının kosinüsü negatiftir; formüldeki eksi ile çarpılınca + (artı) olur!"}],"flashcards":[{"id":"mat-10-1-2-fc-step-0","frontQuestion":"Kenarortay ve 1’e 2 Kuralı (Ağırlık Merkezi G)","backAnswer":"Köşeden karşı kenarın tam ortasına çizilen çizgiye kenarortay denir. Üç kenarortayın buluştuğu G noktası, çizgiyi üstten 2 parça, alttan 1 parça (ör. üstü 10 cm ise altı 5 cm) diye ayırır. (Şifre: Köşeye yakın olan kısım her zaman 2 kat uzundur: Köşe = 2k, Kenar = k.)","tag":"Hızlı Kavrama"},{"id":"mat-10-1-2-fc-step-1","frontQuestion":"Üçgenin Alanı Neye Göre Büyür Küçülür?","backAnswer":"Üçgenin tepesi aynı hizada dururken tabanını 3 katına çıkarırsan alanı da 3 katına çıkar. Yani yükseklik aynıysa, tabanı kim büyükse pastadan büyük dilimi o alır! (Şifre: Tepe noktası ortaksa: Taban oranı = Alan oranı!)","tag":"Hızlı Kavrama"},{"id":"mat-10-1-2-fc-step-2","frontQuestion":"Ne Zaman Sinüs, Ne Zaman Kosinüs Teoremi?","backAnswer":"Üçgende iki kenar ve tam aralarındaki açıyı biliyorsan (makas gibi) üçüncü kenarı bulmak için Kosinüs Teoremi kullanırsın. Açılar bolca verilmişse karşılıklı kenar/sinüs oranlarını eşitleyen Sinüs Teoremini kullanırsın. (Şifre: İki kenar + Aradaki Açı = Kosinüs Teoremi · Karşılıklı Açı ve Kenar = Sinüs Teoremi.)","tag":"Hızlı Kavrama"},{"id":"mat-10-1-2-fc-jg-0","frontQuestion":"\"Ağırlık Merkezi (G - Sentroid)\" günlük dilde ne demektir?","backAnswer":"Üçgenin üç kenarortay çizgisinin kesiştiği tam denge noktası. — Örnek: Karton bir üçgeni tam G noktasından parmağının ucuna koyarsan düşmeden dengede durur.","tag":"Terim Çevirici"},{"id":"mat-10-1-2-fc-jg-1","frontQuestion":"\"Kenarortay ve Açıortay\" günlük dilde ne demektir?","backAnswer":"Kenarortay karşı kenarı tam ortadan ikiye bölen çizgi; açıortay ise köşedeki açıyı iki eşit dilime bölen çizgidir. — Örnek: Pastanın kenarını cetvelle ikiye bölmek kenarortay, dilimin uç açısını ikiye bölmek açıortaydır.","tag":"Terim Çevirici"},{"id":"mat-10-1-2-fc-jg-2","frontQuestion":"\"Kosinüs Teoremi\" günlük dilde ne demektir?","backAnswer":"90 derece olmayan normal üçgenlerde de kenar bulmamızı sağlayan \"Süper Pisagor\" formülü. — Örnek: İki yürüyüş yolunun uzunluğunu ve aralarındaki açıyı biliyorsan, iki uç arasındaki mesafeyi bu formülle bulursun.","tag":"Terim Çevirici"}]},{"id":"mat-10-2-1","subjectId":"matematik","unitTitle":"İstatistiksel Araştırma Süreci","title":"İki Kategorik Değişkenli Veriler ve Çapraz Tablolar","outcomeCode":"MAT.10.2.1","outcomeDescription":"İki kategorik değişkenli veri ile çalışabilme ve iki kategorik değişken arasındaki ilişkililiğe dayalı karar verebilme","scenarios":"Senaryo 1, 2 ve 3","sourcePages":"Sayfa 90–118","lecturePoints":[{"heading":"İki Kategorik Değişken ve İki Yönlü Sıklık (Kontenjans) Tabloları","content":"Cinsiyet-Tercih edilen spor dalı veya Sınıf düzeyi-Ulaşım türü gibi iki nitel (kategorik) değişkenin birlikte dağılımını göstermek için iki yönlü sıklık tabloları (çapraz tablolar) kullanılır.","formulaOrRule":"Marjinal Sıklık = Satır veya Sütun Toplamı / Genel Toplam","summaryOfSummary":"Özetin Özeti: Çapraz tablo (kontenjans tablosu), iki farklı özelliğin (örneğin sınıf düzeyi ile sevilen spor dalının) aynı anda nasıl dağıldığını tek bir kutuda görmemizi sağlar. Satır veya sütunların en sonundaki toplamlara bakarak genel dağılım oranlarını kolayca okuyabiliriz."},{"heading":"Koşullu Göreli Sıklık ve İlişkililik Analizi","content":"İki kategorik değişken arasında ilişki olup olmadığını anlamak için satır veya sütun koşullu göreli sıklıkları (yüzdeleri) hesaplanır. Koşullu dağılımlar kategoriler arasında belirgin şekilde farklılaşıyorsa iki değişken arasında ilişki vardır.","formulaOrRule":"Koşullu Göreli Sıklık = (Hücre Sıklığı) / (İlgili Satır veya Sütun Toplamı)","summaryOfSummary":"Özetin Özeti: İki durum arasında bağ olup olmadığını anlamak için kişi sayılarına değil, yüzdelere (koşullu göreli sıklığa) bakarız. Eğer grupların yüzdeleri birbirine çok yakınsa ilişki yoktur; yüzdeler bariz farklıysa bu iki değişken birbirini etkiliyordur."}],"keyConcepts":[{"term":"Koşullu Göreli Sıklık","definition":"Bir kategorik değişkenin belirli bir alt grubunda, diğer değişkenin görülme oranıdır.","examTip":"Sınavda ham kişi sayılarını değil, mutlaka satır/sütun toplamına bölünmüş yüzdeleri karşılaştırarak karar verin.","outcomeCode":"MAT.10.2.1"}],"examSummary":["Tablodaki iki grup arasında (örneğin kızlar ve erkekler) tercih yüzdeleri birbirine çok yakınsa (%50’ye %50 gibi), bu iki durumun birbiriyle hiçbir alakası yoktur (bağımsızdır/ilişkisizdir).","Eğer grupların yüzdeleri birbirinden bariz şekilde farklı çıkıyorsa (%75’e %25 gibi), o zaman bu iki özellik birbirini etkiliyordur (aralarında istatistiksel ilişki vardır). Unutma: Kişi sayılarına değil, yüzdelere bak!"],"simpleExplanation":{"oneSentenceSummary":"İki farklı özelliğin (örneğin öğrencilerin sınıfı ile okula geliş şeklinin) birbiriyle bağlantılı olup olmadığını tablodaki yüzdelere bakarak şıp diye anlama konusudur.","dailyLifeAnalogy":"Bir ankette \"Gözlük kullananlar mı daha çok kitap okuyor, kullanmayanlar mı?\" diye sorduğunda kişi sayılarına değil, her grubun kendi içindeki yüzdesine (% oranına) bakarsın.","stepByStepEasyPoints":[{"title":"1. Neden Kişi Sayısına Değil Yüzdeye Bakıyoruz?","plainExplanation":"Bir grupta 100 kişi, diğerinde 10 kişi varsa doğrudan kişi sayılarını kıyaslamak yanıltır. Bu yüzden her hücreyi kendi satır veya sütun toplamına bölüp yüzdeye (Koşullu Göreli Sıklık) çeviririz.","memoryTrick":"Oran = Kutudaki Sayı / O Satırın (veya Sütunun) Toplamı."},{"title":"2. İlişki Var mı Yok mu Nasıl Karar Verilir?","plainExplanation":"Satırların yüzdeleri birbirinin neredeyse aynısı çıkıyorsa (ör. ikisi de %50-%50 ise) \"bu iki şeyin birbiriyle alakası yok (bağımsız)\" deriz. Yüzdeler birbirinden çok farklıysa (%80’e %20 gibi) \"aralarında ilişki var\" deriz.","memoryTrick":"Yüzdeler aynıysa = İlişki YOK · Yüzdeler farklıysa = İlişki VAR!"}]},"jargons":[{"term":"Kategorik (Nitel) Değişken","everydayMeaning":"Sayıyla ölçülmeyen; grup, isim veya kategori belirten özellik.","realLifeExample":"Göz rengi, tutulan takım, gidilen okul türü veya sevilen müzik türü kategorik değişkendir."},{"term":"Koşullu Göreli Sıklık","everydayMeaning":"Sadece seçtiğimiz bir grubun (tek bir satırın veya sütunun) kendi içindeki yüzdelik oranı.","realLifeExample":"Tüm okula değil de \"sadece 10. sınıflara\" baktığımızda basketbol sevenlerin yüzdesidir."}],"traps":[{"wrongThinking":"Tablodaki kişi sayılarına bakıp \"Erkeklerde 30 kişi, kızlarda 20 kişi var, o zaman ilişki vardır\" demek.","correctThinking":"Kişi sayıları yanıltır! Mutlaka satır veya sütun toplamına bölerek YÜZDELERİ (% oranlarını) karşılaştır."}],"flashcards":[{"id":"mat-10-2-1-fc-step-0","frontQuestion":"Neden Kişi Sayısına Değil Yüzdeye Bakıyoruz?","backAnswer":"Bir grupta 100 kişi, diğerinde 10 kişi varsa doğrudan kişi sayılarını kıyaslamak yanıltır. Bu yüzden her hücreyi kendi satır veya sütun toplamına bölüp yüzdeye (Koşullu Göreli Sıklık) çeviririz. (Şifre: Oran = Kutudaki Sayı / O Satırın (veya Sütunun) Toplamı.)","tag":"Hızlı Kavrama"},{"id":"mat-10-2-1-fc-step-1","frontQuestion":"İlişki Var mı Yok mu Nasıl Karar Verilir?","backAnswer":"Satırların yüzdeleri birbirinin neredeyse aynısı çıkıyorsa (ör. ikisi de %50-%50 ise) \"bu iki şeyin birbiriyle alakası yok (bağımsız)\" deriz. Yüzdeler birbirinden çok farklıysa (%80’e %20 gibi) \"aralarında ilişki var\" deriz. (Şifre: Yüzdeler aynıysa = İlişki YOK · Yüzdeler farklıysa = İlişki VAR!)","tag":"Hızlı Kavrama"},{"id":"mat-10-2-1-fc-jg-0","frontQuestion":"\"Kategorik (Nitel) Değişken\" günlük dilde ne demektir?","backAnswer":"Sayıyla ölçülmeyen; grup, isim veya kategori belirten özellik. — Örnek: Göz rengi, tutulan takım, gidilen okul türü veya sevilen müzik türü kategorik değişkendir.","tag":"Terim Çevirici"},{"id":"mat-10-2-1-fc-jg-1","frontQuestion":"\"Koşullu Göreli Sıklık\" günlük dilde ne demektir?","backAnswer":"Sadece seçtiğimiz bir grubun (tek bir satırın veya sütunun) kendi içindeki yüzdelik oranı. — Örnek: Tüm okula değil de \"sadece 10. sınıflara\" baktığımızda basketbol sevenlerin yüzdesidir.","tag":"Terim Çevirici"}]},{"id":"fiz-10-1-1","subjectId":"fizik","unitTitle":"Kuvvet ve Hareket","title":"Sabit Hızlı Hareket ve Bir Boyutta Sabit İvmeli Hareket Grafikleri","outcomeCode":"FİZ.10.1.1-3","outcomeDescription":"FİZ.10.1.1 Sabit hızlı hareket, FİZ.10.1.2 İvme ve hız değişimi ilişkisi, FİZ.10.1.3 Sabit ivmeli hareket grafiklerinden matematiksel modelleri yorumlama","scenarios":"Senaryo 1, 2, 3 ve 4 (FİZ.10.1.3 özellikle Senaryo 1, 3 ve 4)","sourcePages":"Sayfa 18–78","lecturePoints":[{"heading":"Yatay Doğrultuda Sabit Hızlı (Düzgün Doğrusal) Hareket","content":"Net kuvvetin sıfır olduğu yatay doğrultuda eşit zaman aralıklarında eşit yer değiştirmeler yapan cismin hızı sabittir, ivmesi sıfırdır (a = 0). Konum-zaman (x-t) grafiğinin eğimi hızı, hız-zaman (v-t) grafiğinin altındaki alan yer değiştirmeyi verir.","formulaOrRule":"Δx = v · Δt · Eğim(x-t) = Δx / Δt = v","summaryOfSummary":"Özetin Özeti: Sabit hızlı harekette araç ne hızlanır ne yavaşlar; her saniye eşit metre yol alır ve ivmesi sıfırdır. Konum-zaman grafiğinin dikliği (eğimi) aracın hızını, hız-zaman grafiğinin altındaki kutunun alanı ise kaç metre gittiğini verir."},{"heading":"İvme ve Hız Değişimi İlişkisi (FİZ.10.1.2)","content":"Birim zamandaki hız değişimine ivme (a) denir. Vektörel bir büyüklüktür ve birimi m/s²’dir. Cismin hızı ile ivmesi aynı yönlü ise cisim düzgün hızlanır, zıt yönlü ise cisim düzgün yavaşlar.","formulaOrRule":"a = Δv / Δt = (v_son - v_ilk) / Δt","summaryOfSummary":"Özetin Özeti: İvme (a), aracın hızının saniyede kaç değiştiğini gösteren gaz/fren şiddetidir. Hız ile ivme aynı yöne bakıyorsa araç hızlanır, zıt yönlere bakıyorsa araç fren yapıp yavaşlar."},{"heading":"Sabit İvmeli Hareket Grafikleri ve Matematiksel Modeller (FİZ.10.1.3)","content":"Hız-zaman (v-t) grafiğinin eğimi sabit ivmeyi (a), grafiğin zaman ekseniyle arasında kalan alan ise yer değiştirmeyi (Δx) verir. İvme-zaman (a-t) grafiğinin altındaki alan ise hız değişimini (Δv) verir.","formulaOrRule":"v(t) = v₀ + a·t · Δx = v₀·t + (1/2)·a·t² · v² = v₀² + 2·a·Δx","summaryOfSummary":"Özetin Özeti: Hız-zaman (v-t) grafiğinin altındaki alanı hesapladığında aracın yer değiştirmesini (Δx), çizginin eğimini hesapladığında ise ivmesini (a) bulursun. Çizgi sıfır eksenini delip alt tarafa geçtiği anda araç durup geri dönmüş demektir."}],"keyConcepts":[{"term":"İvme (a)","definition":"Birim zamandaki hız değişimi (Δv / Δt); SI birimi m/s² olan vektörel büyüklüktür.","examTip":"Negatif ivme her zaman yavaşlama demek değildir: negatif yönde hareket eden cismin ivmesi de negatifse cisim hızlanır!","outcomeCode":"FİZ.10.1.2"},{"term":"v-t Grafiği Alanı ve Eğimi","definition":"Hız-zaman grafiğinin eğimi ivmeyi (a), zaman ekseniyle sınırladığı alan ise yer değiştirmeyi (Δx) verir.","examTip":"Senaryo 1, 3 ve 4’te yamuk veya üçgen alanından Δx = (v₀ + v_son)/2 · t formülünü türetmeniz istenir.","outcomeCode":"FİZ.10.1.3"}],"examSummary":["Konum-Zaman (x-t) grafiğini yürüdüğün yolun haritası gibi düşün: Çizginin zirve yaptığı (tepe) veya dibe vurduğu (çukur) yerler, aracın durup tam tersi yöne döndüğü anlardır.","Hız-Zaman (v-t) grafiğinde ise çizginin altındaki alanı hesaplamak sana aracın kaç metre gittiğini (yer değiştirmeyi) verir; çizgi sıfır çizgisini delip aşağı geçtiği anda araç geri vitese takıp yön değiştirmiş demektir.","Durgun halden (sıfır hızdan) düzgün hızlanan bir araç her saniye sırasıyla 1 metre (x), 3 metre (3x), 5 metre (5x), 7 metre (7x) şeklinde tek sayılarla katlanarak yol alır."],"simpleExplanation":{"oneSentenceSummary":"Bir aracın hızının hiç değişmeden gitmesi (Sabit Hızlı) ile gaza/frene basarak hızının düzenli değişmesi (Sabit İvmeli) arasındaki farkı ve grafiklerini okuma konusudur.","dailyLifeAnalogy":"Otoyolda hız sabitleyiciyi (Cruise Control) 90 km/s’ye bağlarsan ivmen 0’dır (Sabit Hızlı Hareket). Ama kırmızı ışıktan kalkarken gaza düzenli basarsan hızın her saniye 4, 8, 12, 16 diye artar — işte bu \"saniyedeki hız artışına\" İvme denir!","stepByStepEasyPoints":[{"title":"1. İvme (a) Tam Olarak Nedir?","plainExplanation":"İvme, \"hızın 1 saniyede kaçar kaçar değiştiği\" demektir. Örneğin ivmen 3 m/s² ise hızın her saniye 3’er 3’er artıyor (0 → 3 → 6 → 9) demektir. Hız hiç değişmiyorsa ivme sıfırdır!","memoryTrick":"İvme = Saniyedeki Hız Değişimi (Δv / Δt)."},{"title":"2. Hız-Zaman (v-t) Grafiğinden Nasıl Yol Bulunur?","plainExplanation":"Hız-zaman grafiği çizgisinin altındaki şeklin alanını (üçgen, dikdörtgen veya yamuk alanını) hesaplarsan aracın kaç metre yer değiştirdiğini (Δx) bulursun. Grafiğin dikliği (eğimi) ise ivmeyi verir.","memoryTrick":"v-t grafiğinin ALANI = Gidilen Yol (Δx) · EĞİMİ = İvme (a)."}]},"jargons":[{"term":"Yer Değiştirme (Δx) vs Alınan Yol","everydayMeaning":"Alınan yol adım sayarın gösterdiği toplam mesafe; yer değiştirme ise başladığın nokta ile bittiğin nokta arasındaki kuş uçuşu net farktır.","realLifeExample":"Bakkaldan eve gidip geri dönersen aldığın yol 200 metredir ama başladığın yere döndüğün için yer değiştirmen 0’dır!"},{"term":"İvme (a)","everydayMeaning":"Aracın hızının her 1 saniyede kaç m/s arttığını veya azaldığını gösteren değişim hızı.","realLifeExample":"İvmesi 3 olan bir araba her saniye hızına 3 ekleyerek (0, 3, 6, 9...) hızlanır."},{"term":"Grafik Eğimi ve Alanı","everydayMeaning":"Eğim çizginin ne kadar dik يokuş olduğudur (bölme işlemi); alan ise çizgi ile sıfır çizgisi arasında kalan boyalı bölgedir (çarpma işlemi).","realLifeExample":"Hız-zaman grafiğinde boyalı alanı hesaplarsan aracın kaç metre gittiğini bulursun."}],"traps":[{"wrongThinking":"Hız-zaman (v-t) grafiğinde çizgi aşağı doğru iniyorsa araç hemen geri dönmüştür sanmak.","correctThinking":"Çizgi sıfır ekseninin üstündeyse araç hâlâ ileri gidiyordur (sadece yavaşlıyordur); sıfırı kesip alta inince yön değiştirir!"},{"wrongThinking":"İvme negatif (-a) ise araç kesinlikle yavaşlıyordur sanmak.","correctThinking":"Eğer araç eksi (-) yönde gidiyorsa ve ivmesi de eksiyse (-a), araç eksi yönde HIZLANIYORDUR!"}],"flashcards":[{"id":"fiz-10-1-1-fc-step-0","frontQuestion":"İvme (a) Tam Olarak Nedir?","backAnswer":"İvme, \"hızın 1 saniyede kaçar kaçar değiştiği\" demektir. Örneğin ivmen 3 m/s² ise hızın her saniye 3’er 3’er artıyor (0 → 3 → 6 → 9) demektir. Hız hiç değişmiyorsa ivme sıfırdır! (Şifre: İvme = Saniyedeki Hız Değişimi (Δv / Δt).)","tag":"Hızlı Kavrama"},{"id":"fiz-10-1-1-fc-step-1","frontQuestion":"Hız-Zaman (v-t) Grafiğinden Nasıl Yol Bulunur?","backAnswer":"Hız-zaman grafiği çizgisinin altındaki şeklin alanını (üçgen, dikdörtgen veya yamuk alanını) hesaplarsan aracın kaç metre yer değiştirdiğini (Δx) bulursun. Grafiğin dikliği (eğimi) ise ivmeyi verir. (Şifre: v-t grafiğinin ALANI = Gidilen Yol (Δx) · EĞİMİ = İvme (a).)","tag":"Hızlı Kavrama"},{"id":"fiz-10-1-1-fc-jg-0","frontQuestion":"\"Yer Değiştirme (Δx) vs Alınan Yol\" günlük dilde ne demektir?","backAnswer":"Alınan yol adım sayarın gösterdiği toplam mesafe; yer değiştirme ise başladığın nokta ile bittiğin nokta arasındaki kuş uçuşu net farktır. — Örnek: Bakkaldan eve gidip geri dönersen aldığın yol 200 metredir ama başladığın yere döndüğün için yer değiştirmen 0’dır!","tag":"Terim Çevirici"},{"id":"fiz-10-1-1-fc-jg-1","frontQuestion":"\"İvme (a)\" günlük dilde ne demektir?","backAnswer":"Aracın hızının her 1 saniyede kaç m/s arttığını veya azaldığını gösteren değişim hızı. — Örnek: İvmesi 3 olan bir araba her saniye hızına 3 ekleyerek (0, 3, 6, 9...) hızlanır.","tag":"Terim Çevirici"},{"id":"fiz-10-1-1-fc-jg-2","frontQuestion":"\"Grafik Eğimi ve Alanı\" günlük dilde ne demektir?","backAnswer":"Eğim çizginin ne kadar dik يokuş olduğudur (bölme işlemi); alan ise çizgi ile sıfır çizgisi arasında kalan boyalı bölgedir (çarpma işlemi). — Örnek: Hız-zaman grafiğinde boyalı alanı hesaplarsan aracın kaç metre gittiğini bulursun.","tag":"Terim Çevirici"}]},{"id":"kim-10-1-1","subjectId":"kimya","unitTitle":"Etkileşim","title":"Kimyasal Değişim Kanıtları, Tepkime Oluşum Modelleri ve Tepkime Türleri","outcomeCode":"KİM.10.1.1-3","outcomeDescription":"KİM.10.1.1 Kimyasal değişim kanıtları, KİM.10.1.2 Tepkime oluşum modeli, KİM.10.1.3 Kimyasal tepkime türlerinin oluşum süreci (Tüm senaryolar)","scenarios":"Tüm Senaryolar (Senaryo 1–6)","sourcePages":"Sayfa 16–56","lecturePoints":[{"heading":"Kimyasal Değişim Kanıtları ve Bilimsel Gözlem (KİM.10.1.1)","content":"Bir süreçte gaz çıkışı, çökelek (katı) oluşumu, beklenmeyen renk değişimi, ısı/ışık yayılması veya pH değişimi gözlemlenmesi kimyasal bağların kopup yeni bağların oluştuğunun (kimyasal tepkimenin) makroskobik kanıtlarıdır.","formulaOrRule":"Kanıtlar: Gaz Çıkışı · Çökelek Oluşumu · Renk Değişimi · Isı/Işık Değişimi","summaryOfSummary":"Özetin Özeti: Bir kapta kendiliğinden gaz kabarcığı çıkması, dibe katı (çökelek) çökmesi, beklenmedik renk değişimi veya ısınma/ışık çıkması varsa orada kimyasal tepkime olmuş demektir. Yani maddenin iç yapısı değişmiş ve yepyeni bir madde ortaya çıkmıştır."},{"heading":"Çarpışma Kuramı ve Tepkime Oluşum Modeli (KİM.10.1.2)","content":"Kimyasal tepkimenin gerçekleşmesi için taneciklerin uygun geometride (doğrultu ve yönde) ve yeterli kinetik enerjide (aktifleşme enerjisi) etkin çarpışma yapması gerekir. Tepkimede atom türü ve sayısı korunur.","formulaOrRule":"Korunanlar: Atom sayısı ve türü, Toplam kütle, Toplam yük","summaryOfSummary":"Özetin Özeti: Kimyasal tepkime olması için taneciklerin hem doğru açıyla hem de yeterince hızlı (enerjik) çarpışması şarttır. Tepkime sonunda yeni maddeler oluşsa bile içerideki toplam atom sayısı, atom türü ve toplam kütle asla değişmez."},{"heading":"Kimyasal Tepkime Türleri (KİM.10.1.3 — Tüm Senaryolar)","content":"Sentez (birleşme), Analiz (ayrışma), Yanma (O₂ ile tepkime), Çözünme-Çökelme (suda çözünmeyen katı oluşumu ve net iyon denklemi) ve Asit-Baz (nötralleşme: H⁺ + OH⁻ → H₂O) tepkimeleri temel tepkime türleridir.","formulaOrRule":"Çökelme: Ag⁺(suda) + Cl⁻(suda) → AgCl(k) (Net İyon Denklemi)","summaryOfSummary":"Özetin Özeti: Maddeler birleşiyorsa Sentez, parçalanıyorsa Analiz, oksijenle (O₂) tepkimeye giriyorsa Yanma, suda birleşip dibe katı çökertiyorsa Çözünme-Çökelme tepkimesidir. Çökelmede sadece katıyı oluşturan iyonlara \"Net İyon\", suda boş boş yüzenlere \"Seyirci İyon\" denir."}],"keyConcepts":[{"term":"Net İyon Denklemi ve Seyirci İyon","definition":"Çözünme-çökelme tepkimesinde yalnızca çökeleği (katıyı) oluşturan iyonların gösterildiği denklemdir; tepkimeye katılmadan suda kalan iyonlara seyirci iyon denir.","examTip":"KİM.10.1.3 tüm 6 senaryoda yer alır! AgNO₃ + NaCl → AgCl(k) + NaNO₃(suda) tepkimesinde Na⁺ ve NO₃⁻ seyirci iyonlardır.","outcomeCode":"KİM.10.1.3"}],"examSummary":["İki sıvıyı karıştırdığında dibe çöken katıyı oluşturan iyonlara \"Net İyon Denklemi\" (işi yapan asıl oyuncular); hiçbir şeye karışmadan suda yüzmeye devam edenlere ise \"Seyirci İyonlar\" (tribündeki izleyiciler) denir.","Asit ile baz birleştiğinde tuzun yanında ekstra olarak SU (H₂O) çıkıyorsa buna \"Tam Nötralleşme\" denir; ama amonyak (NH₃) gazı ile HCl gazı birleştiğinde su çıkmadığı için bu sadece asit-baz tepkimesidir, nötralleşme değildir!","Yanma (oksijenle birleşme) olaylarının neredeyse tamamı dışarıya ısı verir (ekzotermiktir); sadece havadaki Azot (N₂) gazının yanması dışarıdan ısı ister (endotermiktir) — sınavda kesin sorulur!"],"simpleExplanation":{"oneSentenceSummary":"Maddelerin birbiriyle çarpışıp yepyeni maddelere dönüşmesini (kimyasal tepkimeyi) nasıl anlayacağımızı ve 5 temel tepkime çeşidini en kolay yoldan ayırt etmeyi öğreniyoruz.","dailyLifeAnalogy":"Kek pişirirken kabarcık çıkması, rengin değişmesi ve kokunun yayılması nasıl geri dönüşü olmayan bir değişimse, deney tüpünde gaz çıkışı veya dibe katı çökmesi de kimyasal tepkimenin kanıtıdır.","stepByStepEasyPoints":[{"title":"1. Tepkime Olduğunu Gözümüzle Nasıl Anlarız?","plainExplanation":"Kaptan kabarcık (gaz) çıkıyorsa, iki berrak sıvıyı karıştırınca dibe tortu/katı (çökelek) çöküyorsa, renk veya sıcaklık kendiliğinden değişiyorsa orada kesinlikle kimyasal tepkime olmuştur.","memoryTrick":"Gaz çıkışı + Dibe katı çökmesi + Renk/Isı değişimi = Kimyasal Tepkime Kanıtı!"},{"title":"2. Net İyon ve Seyirci İyon Nedir?","plainExplanation":"İki bardak tuzlu sıvıyı karıştırdığında dibe çöken katıyı oluşturanlar \"başrol oyuncuları\"dır (Net İyon Denklemi). Suda hiçbir şey yapmadan yüzen diğer iyonlar ise maçı tribünden izleyen \"Seyirci İyonlar\"dır!","memoryTrick":"Dibe çöken katıyı yapanlar = Net İyon · Suda kalanlar = Seyirci İyon."}]},"jargons":[{"term":"Çökelek (Katı Oluşumu)","everydayMeaning":"İki berrak sıvı karıştırıldığında suda erimeyip kabın dibine çöken katı tortu.","realLifeExample":"Çaydanlığın dibinde zamanla biriken kireç tortusu günlük hayattaki bir çökelme örneğidir."},{"term":"Net İyon ve Seyirci İyon","everydayMeaning":"Dibe çöken katıyı oluşturan çalışkan iyonlara Net İyon; tepkimeye girmeyip suda yüzenlere Seyirci İyon denir.","realLifeExample":"Sahada gol atan futbolcular Net İyon, tribünde sadece maçı izleyenler Seyirci İyondur."},{"term":"Ekzotermik ve Endotermik","everydayMeaning":"Ekzotermik dışarıya ısı veren (ortamı ısıtan); Endotermik ise gerçekleşmek için dışarıdan ısı alan tepkimedir.","realLifeExample":"Odunun yanıp odayı ısıtması ekzotermik; buzun ısı alarak erimesi veya azotun yanması endotermiktir."}],"traps":[{"wrongThinking":"Her asit-baz tepkimesine \"nötralleşme tepkimesi\" demek.","correctThinking":"Tuzun yanında SU (H₂O) çıkmıyorsa (ör. NH₃ + HCl → NH₄Cl gaz tepkimesi) asit-bazdır ama nötralleşme değildir!"},{"wrongThinking":"Tüm yanma tepkimeleri ısı verir (ekzotermiktir) demek.","correctThinking":"Azot (N₂) gazının yanması hariç tüm yanmalar ısı verir; Azotun yanması ısı alır (endotermiktir)!"}],"flashcards":[{"id":"kim-10-1-1-fc-step-0","frontQuestion":"Tepkime Olduğunu Gözümüzle Nasıl Anlarız?","backAnswer":"Kaptan kabarcık (gaz) çıkıyorsa, iki berrak sıvıyı karıştırınca dibe tortu/katı (çökelek) çöküyorsa, renk veya sıcaklık kendiliğinden değişiyorsa orada kesinlikle kimyasal tepkime olmuştur. (Şifre: Gaz çıkışı + Dibe katı çökmesi + Renk/Isı değişimi = Kimyasal Tepkime Kanıtı!)","tag":"Hızlı Kavrama"},{"id":"kim-10-1-1-fc-step-1","frontQuestion":"Net İyon ve Seyirci İyon Nedir?","backAnswer":"İki bardak tuzlu sıvıyı karıştırdığında dibe çöken katıyı oluşturanlar \"başrol oyuncuları\"dır (Net İyon Denklemi). Suda hiçbir şey yapmadan yüzen diğer iyonlar ise maçı tribünden izleyen \"Seyirci İyonlar\"dır! (Şifre: Dibe çöken katıyı yapanlar = Net İyon · Suda kalanlar = Seyirci İyon.)","tag":"Hızlı Kavrama"},{"id":"kim-10-1-1-fc-jg-0","frontQuestion":"\"Çökelek (Katı Oluşumu)\" günlük dilde ne demektir?","backAnswer":"İki berrak sıvı karıştırıldığında suda erimeyip kabın dibine çöken katı tortu. — Örnek: Çaydanlığın dibinde zamanla biriken kireç tortusu günlük hayattaki bir çökelme örneğidir.","tag":"Terim Çevirici"},{"id":"kim-10-1-1-fc-jg-1","frontQuestion":"\"Net İyon ve Seyirci İyon\" günlük dilde ne demektir?","backAnswer":"Dibe çöken katıyı oluşturan çalışkan iyonlara Net İyon; tepkimeye girmeyip suda yüzenlere Seyirci İyon denir. — Örnek: Sahada gol atan futbolcular Net İyon, tribünde sadece maçı izleyenler Seyirci İyondur.","tag":"Terim Çevirici"},{"id":"kim-10-1-1-fc-jg-2","frontQuestion":"\"Ekzotermik ve Endotermik\" günlük dilde ne demektir?","backAnswer":"Ekzotermik dışarıya ısı veren (ortamı ısıtan); Endotermik ise gerçekleşmek için dışarıdan ısı alan tepkimedir. — Örnek: Odunun yanıp odayı ısıtması ekzotermik; buzun ısı alarak erimesi veya azotun yanması endotermiktir.","tag":"Terim Çevirici"}]},{"id":"kim-10-1-4","subjectId":"kimya","unitTitle":"Etkileşim","title":"Mol Kavramı ve Saf Maddelerin Ölçülebilir Özellikleri","outcomeCode":"KİM.10.1.4-5","outcomeDescription":"KİM.10.1.4 Mol kavramına ilişkin operasyonel tanımlama (Tüm senaryolar), KİM.10.1.5 Saf maddelerin ölçülebilir özellikleri arasındaki ilişkiler","scenarios":"Tüm Senaryolar (Senaryo 1–6)","sourcePages":"Sayfa 58–94","lecturePoints":[{"heading":"Avogadro Sayısı ve Mol Kavramı (KİM.10.1.4)","content":"12 gram Karbon-12 izotopunun içerdiği atom sayısı kadar (6,02 × 10²³ tane = N_A) tanecik içeren madde miktarına 1 mol denir. 1 mol maddenin gram cinsinden kütlesine Mol Kütlesi (M_A, g/mol) denir.","formulaOrRule":"n = m / M_A = N / N_A · (N_A = 6,02 × 10²³)","summaryOfSummary":"Özetin Özeti: Kimyada atomlar tek tek sayılamayacak kadar küçük olduğu için 6,02×10²³ tanesine \"1 Mol\" (1 dev paket) adını veririz. Bir maddenin verilen gramını, onun 1 molünün ağırlığına (M_A) böldüğünde elinde kaç mol paket olduğunu hemen bulursun."},{"heading":"Saf Maddelerin Ölçülebilir Özellikleri ve Gaz Hacmi (KİM.10.1.5)","content":"Sabit sıcaklık ve basınçta gazların hacmi mol sayısıyla doğru orantılıdır (Avogadro Yasası). Normal Koşullarda (NŞA: 0 °C, 1 atm) 1 mol ideal gaz 22,4 litre; Oda Koşullarında (25 °C, 1 atm) 24,5 litre hacim kaplar.","formulaOrRule":"NŞA’da: n = V / 22,4 L · Oda Koşullarında: n = V / 24,5 L","summaryOfSummary":"Özetin Özeti: Normal Koşullarda (0°C sıcaklık ve 1 atm basınçta) 1 mol GAZ her zaman 22,4 litre, oda koşullarında (25°C) ise 24,5 litre yer kaplar. Ancak unutma, bu litre kuralı sadece gazlar içindir; katı ve sıvılarda asla kullanılmaz!"}],"keyConcepts":[{"term":"Mol ve Mol Kütlesi (M_A)","definition":"6,02×10²³ (Avogadro sayısı) kadar taneciğe karşılık gelen SI madde miktarı birimi ve 1 mol maddenin gram kütlesidir.","examTip":"1 tane atomun kütlesi (akb) ile 1 mol atomun kütlesi (gram) sayısal olarak aynıdır ancak birimleri farklıdır (1 g = N_A akb).","outcomeCode":"KİM.10.1.4"}],"examSummary":["Mol dediğimiz şey tıpkı \"1 düzine = 12 tane\" demek gibi dev bir paket sayısıdır (1 mol = 6,02×10²³ tane). Soruda \"kaç mol atom\" derse küçük sayıyı (ör. 1 mol H₂O’da 3 mol atom), \"kaç TANE atom\" derse yanına N_A eklenmiş halini (3·N_A tane) seç!","Normal Koşullarda (0°C sıcaklıkta) \"1 mol = 22,4 Litre yer kaplar\" kuralı SADECE GAZLAR için geçerlidir; soruda sana \"1 mol sıvı su veya demir katısı\" derse sakın 22,4 litre deme, bu en meşhur sınav tuzağıdır!"],"simpleExplanation":{"oneSentenceSummary":"Atomlar tek tek sayılamayacak kadar küçük olduğu için kimyacıların kullandığı \"devasa paket\" birimine MOL denir; tıpkı 1 düzinenin 12 tane olması gibi 1 Mol de 6,02×10²³ tanedir!","dailyLifeAnalogy":"Markete gidip \"bana 2 düzine yumurta ver\" dediğinde 2 × 12 = 24 yumurta alırsın. Kimyada da \"1 mol atom\" dediğinde 6,02×10²³ tane (Avogadro sayısı kadar) atom paketi almış olursun!","stepByStepEasyPoints":[{"title":"1. Mol Sayısı (n) Nasıl Hesaplanır?","plainExplanation":"1 paketin (1 molün) ağırlığı soruda parantez içinde verilir (ör. C=12, H₂O=18 g/mol). Elindeki toplam gramı 1 paketin ağırlığına bölersen kaç paket (kaç mol) olduğunu bulursun!","memoryTrick":"Paket Sayısı (Mol) = Elindeki Gram (m) / 1 Paketin Ağırlığı (M_A)."},{"title":"2. Gazlarda 22,4 Litre Kuralı Nedir?","plainExplanation":"Sadece GAZ olan maddeler Normal Koşullarda (0°C sıcaklıkta) 1 paket (1 mol) olduğunda tam 22,4 litrelik bir balon doldurur. 2 mol gaz 44,8 litre, yarım mol gaz 11,2 litre yer kaplar.","memoryTrick":"NŞA’da 1 Mol Gaz = 22,4 Litre (Katı ve sıvılarda bu kural geçmez!)."}]},"jargons":[{"term":"Mol ve Avogadro Sayısı (N_A)","everydayMeaning":"6,02 × 10²³ tane atom veya molekülden oluşan dev kimya paketine \"1 Mol\" denir.","realLifeExample":"Kırtasiyede 12 kaleme \"1 düzine\" diyorsak, kimyada 6,02×10²³ taneciğe \"1 mol\" deriz."},{"term":"Mol Kütlesi (M_A)","everydayMeaning":"Tam 1 mol (1 paket) maddenin hassas terazide kaç gram geldiğini gösteren sayı.","realLifeExample":"Suyun (H₂O) M_A değeri 18 g/mol’dür; yani 1 mol su tartıda tam 18 gram gelir."},{"term":"Normal Koşullar (NŞA)","everydayMeaning":"Sıcaklığın tam 0 °C (buzun erime sıcaklığı) ve basıncın 1 atmosfer olduğu standart laboratuvar ortamı.","realLifeExample":"NŞA’da 1 mol balon dolusu gaz her zaman 22,4 litrelik hacim kaplar."}],"traps":[{"wrongThinking":"Normal koşullarda (NŞA) 1 mol su sıvısı (H₂O(s)) 22,4 litre hacim kaplar demek.","correctThinking":"22,4 litre kuralı SADECE GAZLAR (g) içindir! Sıvı (s) ve katılarda (k) bu kural kesinlikle uygulanmaz."},{"wrongThinking":"\"1 mol CH₄ kaç mol atom içerir?\" sorusuna 1 demek.","correctThinking":"1 paket CH₄ içinde 1 Karbon + 4 Hidrojen = toplam 5 mol atom (5·N_A tane atom) vardır!"}],"flashcards":[{"id":"kim-10-1-4-fc-step-0","frontQuestion":"Mol Sayısı (n) Nasıl Hesaplanır?","backAnswer":"1 paketin (1 molün) ağırlığı soruda parantez içinde verilir (ör. C=12, H₂O=18 g/mol). Elindeki toplam gramı 1 paketin ağırlığına bölersen kaç paket (kaç mol) olduğunu bulursun! (Şifre: Paket Sayısı (Mol) = Elindeki Gram (m) / 1 Paketin Ağırlığı (M_A).)","tag":"Hızlı Kavrama"},{"id":"kim-10-1-4-fc-step-1","frontQuestion":"Gazlarda 22,4 Litre Kuralı Nedir?","backAnswer":"Sadece GAZ olan maddeler Normal Koşullarda (0°C sıcaklıkta) 1 paket (1 mol) olduğunda tam 22,4 litrelik bir balon doldurur. 2 mol gaz 44,8 litre, yarım mol gaz 11,2 litre yer kaplar. (Şifre: NŞA’da 1 Mol Gaz = 22,4 Litre (Katı ve sıvılarda bu kural geçmez!).)","tag":"Hızlı Kavrama"},{"id":"kim-10-1-4-fc-jg-0","frontQuestion":"\"Mol ve Avogadro Sayısı (N_A)\" günlük dilde ne demektir?","backAnswer":"6,02 × 10²³ tane atom veya molekülden oluşan dev kimya paketine \"1 Mol\" denir. — Örnek: Kırtasiyede 12 kaleme \"1 düzine\" diyorsak, kimyada 6,02×10²³ taneciğe \"1 mol\" deriz.","tag":"Terim Çevirici"},{"id":"kim-10-1-4-fc-jg-1","frontQuestion":"\"Mol Kütlesi (M_A)\" günlük dilde ne demektir?","backAnswer":"Tam 1 mol (1 paket) maddenin hassas terazide kaç gram geldiğini gösteren sayı. — Örnek: Suyun (H₂O) M_A değeri 18 g/mol’dür; yani 1 mol su tartıda tam 18 gram gelir.","tag":"Terim Çevirici"},{"id":"kim-10-1-4-fc-jg-2","frontQuestion":"\"Normal Koşullar (NŞA)\" günlük dilde ne demektir?","backAnswer":"Sıcaklığın tam 0 °C (buzun erime sıcaklığı) ve basıncın 1 atmosfer olduğu standart laboratuvar ortamı. — Örnek: NŞA’da 1 mol balon dolusu gaz her zaman 22,4 litrelik hacim kaplar.","tag":"Terim Çevirici"}]},{"id":"biy-10-1-1","subjectId":"biyoloji","unitTitle":"Enerji","title":"ATP’nin Yapısı, Fotosentez ve Canlılarda Sindirim Çeşitleri","outcomeCode":"BİY.10.1.1-5","outcomeDescription":"BİY.10.1.1 ATP ve enerjinin gerekliliği, BİY.10.1.3 Fotosentez deneyleri ve faktörler, BİY.10.1.5 Sindirim çeşitleri ve yapıları (Senaryo 1, 2, 3)","scenarios":"Senaryo 1, 2, 3 ve 4","sourcePages":"Sayfa 16–90","lecturePoints":[{"heading":"ATP’nin Yapısı ve Enerji Aktarımı (BİY.10.1.1)","content":"Adenozin Trifosfat (ATP); Adenin azotlu organik bazı, 5 karbonlu Riboz şekeri ve 3 adet inorganik fosfat grubundan oluşur. ADP’ye fosfat eklenmesine fosforilasyon (endergonik), ATP’nin yıkımına defosforilasyon (ekzergonik) denir.","formulaOrRule":"ADP + P_i + Enerji ⇌ ATP + H₂O (ATP hücre dışına çıkamaz ve depolanamaz)","summaryOfSummary":"Özetin Özeti: ATP, hücrenin anlık harcadığı şarjlı enerji pilidir; üretilmesine fosforilasyon (şarj etme), harcanmasına defosforilasyon (pil bitirme) denir. ATP hücre içinde üretilir ve sadece o hücre içinde harcanır; dışarı çıkamaz ve depolanamaz."},{"heading":"Fotosentez Tepkimeleri ve Hıza Etki Eden Faktörler (BİY.10.1.3)","content":"Işığa bağımlı tepkimeler kloroplastın granum (tilakoit zar) kısmında gerçekleşir; su fotolize uğrar, atmosfere O₂ verilir, ATP ve NADPH üretilir. Işıktan bağımsız tepkimeler stromada gerçekleşir; CO₂ kullanılarak glikoz ve organik monomerler sentezlenir.","formulaOrRule":"6CO₂ + 6H₂O + Işık / Klorofil → C₆H₁₂O₆ + 6O₂ (Oksijenin kaynağı H₂O’dur)","summaryOfSummary":"Özetin Özeti: Fotosentezde bitki güneş ışığını, suyu (H₂O) ve karbondioksiti (CO₂) kullanarak kendine besin (glikoz) ve oksijen üretir. Havaya verilen temiz oksijenin kaynağı topraktan alınan sudur; fotosentez en hızlı mor-kırmızı ışıkta, en yavaş yeşil ışıkta gerçekleşir."},{"heading":"Hücre İçi / Hücre Dışı Sindirim ve Sindirim Yapıları (BİY.10.1.5)","content":"Fagositoz/pinositozla alınan besinin lizozom enzimleriyle parçalanması hücre içi sindirimdir. Salgılanan enzimlerle hücre dışında parçalanıp monomer hâlinde emilmesi hücre dışı sindirimdir (büyük polimerlerden yararlanmayı sağlar).","formulaOrRule":"Hidrolizde ATP harcanmaz, su harcanır ve sindirim enzimleri görev alır.","summaryOfSummary":"Özetin Özeti: Sindirim (hidroliz), büyük besinlerin su ve enzim yardımıyla hücre zarından geçebilecek küçük parçalara ayrılmasıdır ve bu işlemde hiç ATP (enerji) harcanmaz. Besin hücre içine alınıp parçalanıyorsa hücre içi, dışarıya enzim salgılanıp parçalanıyorsa hücre dışı sindirimdir."}],"keyConcepts":[{"term":"Fotoliz ve Tilakoit Zar","definition":"Fotosentezin ışığa bağımlı evresinde suyun ışık enerjisiyle parçalanarak elektron, proton (H⁺) ve oksijen (O₂) oluşturmasıdır.","examTip":"Deney sorularında \"KOH veya Ba(OH)₂ çözeltisi ortamda CO₂ tutucu olarak kullanılırsa fotosentez durur\" bilgisi çok sık sorulur!","outcomeCode":"BİY.10.1.3"},{"term":"Hücre Dışı Sindirim","definition":"Hücre zarından geçemeyecek kadar büyük besinlerin ekzositozla salgılanan enzimlerle hücre dışında monomerlerine ayrılmasıdır.","examTip":"Saprofit (çürükçül) canlılar ve omurgalı hayvanlar gelişmiş hücre dışı sindirim yapar.","outcomeCode":"BİY.10.1.5"}],"examSummary":["Sindirim (hidroliz, yani büyük besinleri suyla küçük parçalara ayırma) olayında hücre ASLA enerji (ATP) harcamaz; bu yüzden sindirim hem hücre içinde hem de hücre dışında (mide/bağırsak boşluğunda) rahatça yapılabilir.","Bitkilerin fotosentezle havaya verdiği temiz oksijenin (O₂) kaynağı topraktan çektiği SU (H₂O) molekülleridir; ürettiği şekerin (besinin) içindeki karbon ise havadan aldığı karbondioksitten (CO₂) gelir.","Bitki yaprakları yeşil ışığı sevmez ve geri yansıtır, bu yüzden yeşil ışıkta fotosentez en yavaştır; mor ve kırmızı ışığı ise sünger gibi emdiği için fotosentez en hızlı mor ve kırmızı ışıkta gerçekleşir."],"simpleExplanation":{"oneSentenceSummary":"Canlıların şarj edilebilir enerji bataryası olan ATP’yi, bitkilerin güneş ışığıyla kendi yemeğini yapmasını (Fotosentez) ve besinlerin nasıl parçalandığını (Sindirim) öğreniyoruz.","dailyLifeAnalogy":"ATP tıpkı telefonunun şarjı gibidir: Şarj doluyken (3 fosfatlı ATP) enerji harcarsın, şarj bitince (2 fosfatlı ADP) solunumla tekrar prize takıp şarj edersin!","stepByStepEasyPoints":[{"title":"1. ATP Neden Depolanamaz ve Komşu Hücreye Verilemez?","plainExplanation":"Her hücre kendi elektriğini kendi üretip anında harcar. ATP hücre zarından dışarı çıkamaz ve stoklanamaz. Ancak dikkat: Yemekleri parçalama (Sindirim/Hidroliz) işleminde ATP enerjisi hiç harcanmaz!","memoryTrick":"Altın Kural: Sindirimde (Hidrolizde) ATP harcanmaz, sadece su harcanır!"},{"title":"2. Fotosentezde Soluduğumuz Oksijen Nereden Geliyor?","plainExplanation":"Bitki güneş ışığını kullanarak toprağa döktüğün suyu (H₂O) parçalar ve içindeki oksijeni havaya verir. Havadan aldığı karbondioksitle (CO₂) ise kendi şekerini (besinini) üretir.","memoryTrick":"Havadaki Oksijenin kaynağı = SU (H₂O) · Besinin kaynağı = CO₂."}]},"jargons":[{"term":"Fosforilasyon ve Defosforilasyon","everydayMeaning":"Fosforilasyon ATP pilini üretmek (şarj etmek); Defosforilasyon ise ATP pilini harcamak (kullanmak) demektir.","realLifeExample":"Telefonu prize takmak fosforilasyon, oyun oynarken şarjı bitirmek defosforilasyondur."},{"term":"Fotoliz","everydayMeaning":"Fotosentez sırasında bitkinin ışık enerjisini kullanarak suyu (H₂O) parçalaması ve oksijen çıkarması.","realLifeExample":"Soluduğumuz temiz oksijen, bitkilerin suyu fotolizle parçalaması sayesinde havaya karışır."},{"term":"Hidroliz (Sindirim)","everydayMeaning":"Büyük besin moleküllerinin su (hidro) kullanılarak küçük parçalara (monomerlere) ayrılması; ATP harcanmaz!","realLifeExample":"Yediğimiz büyük ekmek lokmasının midede ve bağırsakta küçük glikoz tanelerine bölünmesi hidrolizdir."}],"traps":[{"wrongThinking":"Sindirim (hidroliz) sırasında hücre çok fazla ATP (enerji) harcar sanmak.","correctThinking":"Hidrolizde (sindirimde) KESİNLİKLE ATP harcanmaz ve üretilmez!"},{"wrongThinking":"Fotosentezde havaya verilen oksijenin (O₂) kaynağı karbondioksittir (CO₂) sanmak.","correctThinking":"Atmosfere verilen oksijenin kaynağı topraktan çekilen SU (H₂O) molekülünün parçalanmasıdır (fotoliz)!"}],"flashcards":[{"id":"biy-10-1-1-fc-step-0","frontQuestion":"ATP Neden Depolanamaz ve Komşu Hücreye Verilemez?","backAnswer":"Her hücre kendi elektriğini kendi üretip anında harcar. ATP hücre zarından dışarı çıkamaz ve stoklanamaz. Ancak dikkat: Yemekleri parçalama (Sindirim/Hidroliz) işleminde ATP enerjisi hiç harcanmaz! (Şifre: Altın Kural: Sindirimde (Hidrolizde) ATP harcanmaz, sadece su harcanır!)","tag":"Hızlı Kavrama"},{"id":"biy-10-1-1-fc-step-1","frontQuestion":"Fotosentezde Soluduğumuz Oksijen Nereden Geliyor?","backAnswer":"Bitki güneş ışığını kullanarak toprağa döktüğün suyu (H₂O) parçalar ve içindeki oksijeni havaya verir. Havadan aldığı karbondioksitle (CO₂) ise kendi şekerini (besinini) üretir. (Şifre: Havadaki Oksijenin kaynağı = SU (H₂O) · Besinin kaynağı = CO₂.)","tag":"Hızlı Kavrama"},{"id":"biy-10-1-1-fc-jg-0","frontQuestion":"\"Fosforilasyon ve Defosforilasyon\" günlük dilde ne demektir?","backAnswer":"Fosforilasyon ATP pilini üretmek (şarj etmek); Defosforilasyon ise ATP pilini harcamak (kullanmak) demektir. — Örnek: Telefonu prize takmak fosforilasyon, oyun oynarken şarjı bitirmek defosforilasyondur.","tag":"Terim Çevirici"},{"id":"biy-10-1-1-fc-jg-1","frontQuestion":"\"Fotoliz\" günlük dilde ne demektir?","backAnswer":"Fotosentez sırasında bitkinin ışık enerjisini kullanarak suyu (H₂O) parçalaması ve oksijen çıkarması. — Örnek: Soluduğumuz temiz oksijen, bitkilerin suyu fotolizle parçalaması sayesinde havaya karışır.","tag":"Terim Çevirici"},{"id":"biy-10-1-1-fc-jg-2","frontQuestion":"\"Hidroliz (Sindirim)\" günlük dilde ne demektir?","backAnswer":"Büyük besin moleküllerinin su (hidro) kullanılarak küçük parçalara (monomerlere) ayrılması; ATP harcanmaz! — Örnek: Yediğimiz büyük ekmek lokmasının midede ve bağırsakta küçük glikoz tanelerine bölünmesi hidrolizdir.","tag":"Terim Çevirici"}]},{"id":"tar-10-1-1","subjectId":"tarih","unitTitle":"1. Ünite: Türkistan’dan Türkiye’ye (1040–1299)","title":"Askerî Mücadeleler, Devlet-Ordu Teşkilatı ve Sosyoekonomik Yaşam","outcomeCode":"TAR.10.1.1-3","outcomeDescription":"TAR.10.1.1 Askerî mücadeleler (1040-1299), TAR.10.1.2 Devlet ve ordu teşkilatında değişim/süreklilik, TAR.10.1.3 Sosyoekonomik faaliyetler ve şehirleşme","scenarios":"Tüm Senaryolar (Senaryo 1–6)","sourcePages":"Sayfa 16–86","lecturePoints":[{"heading":"1040–1299 Arası Kritik Askerî Mücadeleler (TAR.10.1.1)","content":"1040 Dandanakan Savaşı ile Büyük Selçuklu Devleti resmen kuruldu. 1048 Pasinler Savaşı Bizans ile ilk büyük mücadele oldu. 1071 Malazgirt Zaferi Anadolu’nun kapılarını Türklere açtı (Yurt Açan). 1176 Miryokefalon Savaşı ile Anadolu’nun kesin Türk yurdu olduğu tescillendi (Yurt Tutan). 1243 Kösedağ Savaşı ile Türkiye Selçuklu Devleti Moğol (İlhanlı) hâkimiyetine girdi ve İkinci Beylikler dönemi başladı.","formulaOrRule":"1040 Dandanakan → 1048 Pasinler → 1071 Malazgirt → 1176 Miryokefalon → 1243 Kösedağ","summaryOfSummary":"Özetin Özeti: 1040 Dandanakan ile Büyük Selçuklu kuruldu, 1071 Malazgirt ile Anadolu’nun kapıları Türklere açıldı (Yurt Açan). 1176 Miryokefalon Zaferi ile Anadolu’nun kesin Türk yurdu olduğu kanıtlandı (Yurt Tutan), 1243 Kösedağ yenilgisiyle ise Moğol baskısı ve 2. Beylikler dönemi başladı."},{"heading":"Devlet ve Ordu Teşkilatında Değişim ve Süreklilik (TAR.10.1.2)","content":"Kut anlayışı ve ikili teşkilat geleneği kısmen sürerken, İslam devlet geleneğiyle birlikte Divan-ı Saltanat kuruldu, hükümdar unvanları (Sultan, Keyhüsrev, Keykubat) değişti. Orduda Türkmenlerin yanı sıra maaşlı Gulam sistemi ve toprağa dayalı İkta (Sipahi) ordusu oluşturuldu.","formulaOrRule":"Süreklilik: Kut anlayışı, Cihan hâkimiyeti mefkûresi · Değişim: İkta Sistemi, Gulam Ordusu, Divan Teşkilatı","summaryOfSummary":"Özetin Özeti: Türkler İslamiyet’le birlikte eski Kut anlayışını ve onlu ordu sistemini korurken (süreklilik), Divan teşkilatı, Gulam ve İkta sistemi gibi yeni kurumlar kurdular (değişim). İkta sistemi sayesinde hazineden para çıkmadan dev bir atlı ordu beslendi ve topraklar hep ekili kaldı."},{"heading":"Sosyal Yaşam, Ekonomi ve Şehirleşme Anlayışı (TAR.10.1.3)","content":"Konargöçer Oğuz boylarının Anadolu’ya yerleşmesiyle tarım, ticaret ve zanaat gelişti. Kervansaraylar, ribatlar, medreseler, darüşşifalar ve Ahilik teşkilatı Anadolu’nun hızla şehirleşmesini ve İslamlaşmasını sağladı.","formulaOrRule":"Ahilik Teşkilatı + Kervansaray Ağı + Vakıf Külliyeleri = Anadolu’da Yerleşik Şehir Kültürü","summaryOfSummary":"Özetin Özeti: Göçebe Türkmenlerin Anadolu’ya yerleşmesiyle kervansaraylar, medreseler, şifahaneler inşa edildi ve şehirler hızla büyüdü. Esnafın kurduğu Ahilik teşkilatı ise hem meslek-ahlak eğitimi verdi hem de üretilen malların kalitesini denetledi."}],"keyConcepts":[{"term":"Miryokefalon Savaşı (1176)","definition":"Türkiye Selçuklu Sultanı II. Kılıç Arslan’ın Bizans ordusunu yenerek Anadolu’nun kesin olarak Türk yurdu olduğunu kanıtladığı savaştır.","examTip":"Sınavda Malazgirt \"Yurt Açan\", Miryokefalon ise \"Yurt Tutan\" savaş olarak karşılaştırmalı sorulur.","outcomeCode":"TAR.10.1.1"},{"term":"İkta ve Gulam Sistemi","definition":"İkta, devlete ait toprakların vergi gelirlerinin hizmet karşılığı komutan ve askerlere tahsis edilmesi; Gulam ise saray ve merkez ordusu için yetiştirilen profesyonel asker sistemidir.","examTip":"TAR.10.1.2 kapsamında eski Türk \"onlu ordu sistemi\" sürekliliği, \"Gulam ve İkta\" ise değişimi temsil eder.","outcomeCode":"TAR.10.1.2"}],"examSummary":["1071 Malazgirt Savaşı Anadolu’nun kapısını Türklere açtığı için \"Yurt Açan\", 1176 Miryokefalon Savaşı ise Bizans’ın Anadolu’yu geri alma ümidini tamamen bitirdiği için \"Yurt Tutan\" savaş olarak kodlanır.","İkta Sistemi devlete iki büyük kazanç sağlamıştır: Komutanlar topladıkları vergiyle devlete hazineden tek kuruş harcatmadan hazır atlı asker (sipahi) beslemiş, köylü de toprağı sürekli ekip biçerek üretimi sürdürmüştür.","Ahilik Teşkilatı Anadolu’daki esnaf ve zanaatkârların hem meslek okulu hem de kalite kontrol birliğidir; çıraklara dürüst ticaret öğretmiş, bozuk mal üreteni cezalandırarak şehirleri güvenli hale getirmiştir."],"simpleExplanation":{"oneSentenceSummary":"Türklerin Orta Asya’dan gelip 5 büyük savaşla Anadolu’yu nasıl vatan yaptığını, devlet-ordu düzenini nasıl kurduğunu ve şehirleri nasıl canlandırdığını hikâye gibi öğreniyoruz.","dailyLifeAnalogy":"Anadolu’yu bir ev gibi düşün: 1048 Pasinler’de kapıyı tıklattık (Keşif), 1071 Malazgirt’te kapıyı açıp içeri girdik (Yurt Açan), 1176 Miryokefalon’da tapuyu tamamen üzerimize aldık (Yurt Tutan)!","stepByStepEasyPoints":[{"title":"1. 5 Savaşı Sırasıyla Karıştırmadan Nasıl Hatırlarsın?","plainExplanation":"1040 Dandanakan (Selçuklu kuruldu) → 1048 Pasinler (Bizans’la ilk tanışma) → 1071 Malazgirt (Anadolu kapısı açıldı) → 1176 Miryokefalon (Anadolu kesin Türk yurdu oldu) → 1243 Kösedağ (Moğollar yendi, devlet dağıldı).","memoryTrick":"Malazgirt = Yurt AÇAN (1071) · Miryokefalon = Yurt TUTAN (1176)."},{"title":"2. İkta Sistemi Neden Çok Zekice Bir Buluştu?","plainExplanation":"Devlet komutana maaş yerine toprak veriyor; komutan o toprağı köylüye ektirip vergisiyle atlı asker (Sipahi) besliyor. Böylece devletin kasasından tek kuruş çıkmadan hem dev bir ordu hazır oluyor hem de tarlalar boş kalmıyor!","memoryTrick":"İkta = Bedavaya Hazır Atlı Ordu + Kesintisiz Tarım Üretimi."}]},"jargons":[{"term":"İkta Sistemi","everydayMeaning":"Devletin toprağı köylüye işletip, oradan toplanan vergiyle komutanlara maaş ve savaşa hazır atlı asker (sipahi) besletmesi sistemi.","realLifeExample":"Devlet kasasından hiç nakit para çıkmadan hem toprak ekilir hem de bedava dev bir ordu hazır tutulur."},{"term":"Gulam Sistemi","everydayMeaning":"Küçük yaşta saray okulunda özel olarak eğitilip doğrudan sultana bağlı maaşlı profesyonel asker ve yönetici yetiştirme sistemi.","realLifeExample":"Osmanlı’daki Kapıkulu / Yeniçeri sisteminin Selçuklu’daki ilk halidir."},{"term":"Ahilik Teşkilatı","everydayMeaning":"Anadolu’daki esnaf ve zanaatkârların kurduğu dayanışma, kalite kontrol ve ahlak eğitimi birliği.","realLifeExample":"Bugünkü Esnaf Odaları, Standartlar Enstitüsü ve Meslek Liselerinin birleşimi gibidir."}],"traps":[{"wrongThinking":"Malazgirt ile Miryokefalon savaşlarının unvanlarını karıştırmak.","correctThinking":"1071 Malazgirt kapıyı açtığı için \"Yurt Açan\", 1176 Miryokefalon tapuyu kesinleştirdiği için \"Yurt Tutan\" savaştır!"},{"wrongThinking":"İkta sisteminde toprağın mülkiyeti komutana verilir sanmak.","correctThinking":"Toprağın mülkiyeti devlete (miri arazi) aittir; komutana sadece vergi toplama ve asker yetiştirme görevi verilir."}],"flashcards":[{"id":"tar-10-1-1-fc-step-0","frontQuestion":"5 Savaşı Sırasıyla Karıştırmadan Nasıl Hatırlarsın?","backAnswer":"1040 Dandanakan (Selçuklu kuruldu) → 1048 Pasinler (Bizans’la ilk tanışma) → 1071 Malazgirt (Anadolu kapısı açıldı) → 1176 Miryokefalon (Anadolu kesin Türk yurdu oldu) → 1243 Kösedağ (Moğollar yendi, devlet dağıldı). (Şifre: Malazgirt = Yurt AÇAN (1071) · Miryokefalon = Yurt TUTAN (1176).)","tag":"Hızlı Kavrama"},{"id":"tar-10-1-1-fc-step-1","frontQuestion":"İkta Sistemi Neden Çok Zekice Bir Buluştu?","backAnswer":"Devlet komutana maaş yerine toprak veriyor; komutan o toprağı köylüye ektirip vergisiyle atlı asker (Sipahi) besliyor. Böylece devletin kasasından tek kuruş çıkmadan hem dev bir ordu hazır oluyor hem de tarlalar boş kalmıyor! (Şifre: İkta = Bedavaya Hazır Atlı Ordu + Kesintisiz Tarım Üretimi.)","tag":"Hızlı Kavrama"},{"id":"tar-10-1-1-fc-jg-0","frontQuestion":"\"İkta Sistemi\" günlük dilde ne demektir?","backAnswer":"Devletin toprağı köylüye işletip, oradan toplanan vergiyle komutanlara maaş ve savaşa hazır atlı asker (sipahi) besletmesi sistemi. — Örnek: Devlet kasasından hiç nakit para çıkmadan hem toprak ekilir hem de bedava dev bir ordu hazır tutulur.","tag":"Terim Çevirici"},{"id":"tar-10-1-1-fc-jg-1","frontQuestion":"\"Gulam Sistemi\" günlük dilde ne demektir?","backAnswer":"Küçük yaşta saray okulunda özel olarak eğitilip doğrudan sultana bağlı maaşlı profesyonel asker ve yönetici yetiştirme sistemi. — Örnek: Osmanlı’daki Kapıkulu / Yeniçeri sisteminin Selçuklu’daki ilk halidir.","tag":"Terim Çevirici"},{"id":"tar-10-1-1-fc-jg-2","frontQuestion":"\"Ahilik Teşkilatı\" günlük dilde ne demektir?","backAnswer":"Anadolu’daki esnaf ve zanaatkârların kurduğu dayanışma, kalite kontrol ve ahlak eğitimi birliği. — Örnek: Bugünkü Esnaf Odaları, Standartlar Enstitüsü ve Meslek Liselerinin birleşimi gibidir.","tag":"Terim Çevirici"}]},{"id":"cog-10-1-1","subjectId":"cografya","unitTitle":"Coğrafyanın Doğası, Mekânsal Teknolojiler ve Doğal Süreçler","title":"CBS/Uzaktan Algılama, Tektonik Süreçler, Çözünme ve Aşınım-Birikim Şekilleri","outcomeCode":"COĞ.10.1.1 - COĞ.10.3.3","outcomeDescription":"COĞ.10.1.1 Coğrafi bakış, COĞ.10.2.1-2 CBS ve Uzaktan Algılama, COĞ.10.3.1-3 Tektonizma, Kayaç/İklim Çözünmesi ve Aşınım/Birikim Şekilleri","scenarios":"Tüm Senaryolar (COĞ.10.3.3 özellikle Senaryo 1, 3 ve 6)","sourcePages":"Sayfa 14–110","lecturePoints":[{"heading":"Coğrafi Bakış, CBS ve Uzaktan Algılama (COĞ.10.1.1, 10.2.1, 10.2.2)","content":"Coğrafyanın temel ilkeleri: Dağılış (coğrafyayı diğer bilimlerden ayıran en özgün ilke), Nedensellik ve Karşılıklı İlgi (Bağlantı). Coğrafi Bilgi Sistemleri (CBS); mekânsal verileri nokta (kuyu, tepe), çizgi (akarsu, yol, fay) ve alan/poligon (göl, orman, il sınırı) katmanları hâlinde toplar, analiz eder ve altlık haritalara aktarır.","formulaOrRule":"Vektörel Veri Modelleri: Nokta · Çizgi · Alan (Poligon)","summaryOfSummary":"Özetin Özeti: Coğrafyayı diğer bilimlerden ayıran en önemli özellik \"Bu olay nerede oluyor?\" sorusunu soran Dağılış ilkesidir. Bilgisayarlı harita sistemi olan CBS’de kuyular/tepeler \"Nokta\", yollar/akarsular \"Çizgi\", göller/ormanlar ise \"Poligon (Alan)\" katmanı olarak gösterilir."},{"heading":"Tektonik Süreçler ve İklim-Kayaç Çözünme İlişkisi (COĞ.10.3.1, 10.3.2)","content":"Levha sınırları deprem, volkanizma ve sıcak su kaynaklarıyla paralellik gösterir. Günlük sıcaklık farkının fazla ve nemin az olduğu çöl/karasal bölgelerde Fiziksel (Mekanik) çözünme; sıcaklık ve yağışın fazla olduğu Ekvatoral/Muson bölgelerde ve karstik (kalker) arazilerde Kimyasal çözünme baskındır.","formulaOrRule":"Kurak/Karasal → Fiziksel Çözünme · Sıcak ve Nemli / Karstik → Kimyasal Çözünme","summaryOfSummary":"Özetin Özeti: Deprem, volkan ve sıcak su kaynakları yer kabuğunun kırık hatları (levha sınırları) üzerinde toplanır. Kurak ve gece-gündüz sıcaklık farkı yüksek yerlerde kayalar çatlayarak (Fiziksel çözünme), sıcak ve yağışlı yerlerde ise suyla eriyerek (Kimyasal çözünme) toprağa dönüşür."},{"heading":"Aşınım ve Birikim Süreçlerinin Yeryüzü Şekillerine Etkisi (COĞ.10.3.3)","content":"Akarsu aşınım şekilleri: Vadi (çentik, boğaz, kanyon, tabanlı), dev kazanı, peri bacası, kırgıbayır, peneplen. Akarsu birikim şekilleri: Birikinti konisi, dağ eteği ovası, ırmak adası, delta. Hem aşınım hem birikim şekli olanlar: Menderes ve Seki (Taraça).","formulaOrRule":"Menderes ve Seki (Taraça) = Hem Aşınım Hem Birikim Şekli","summaryOfSummary":"Özetin Özeti: Akarsular hızlı aktığı yerlerde toprağı kazıyarak Vadi, Dev Kazanı ve Peri Bacası gibi aşınım şekilleri; yavaşladığı düzlüklerde ise Delta Ovası ve Birikinti Konisi gibi birikim şekilleri oluşturur. Menderes (büklüm) ve Seki (basamak) ise hem aşınım hem birikim şeklidir."}],"keyConcepts":[{"term":"CBS (Coğrafi Bilgi Sistemleri) ve Uzaktan Algılama","definition":"Uydular veya hava araçlarıyla temassız veri toplamaya Uzaktan Algılama; bu verileri katmanlar hâlinde depolayıp sorgulayan ve haritalayan sisteme CBS denir.","examTip":"Sınavda afet yönetimi, şehir planlama veya orman yangını takibinde hangi veri katmanlarının (eğim, rüzgâr, ulaşım) çakıştırıldığı sorulur.","outcomeCode":"COĞ.10.2.1"},{"term":"Fiziksel (Mekanik) ve Kimyasal Çözünme","definition":"Kayaçların sıcaklık farkı ve donma-çözülmeyle ufalanması fiziksel; su ve asitlerle mineral yapısının değişerek erimesi kimyasal çözünmedir.","examTip":"İç Anadolu ve Güneydoğu Anadolu’da fiziksel, Karadeniz ve Akdeniz’de kimyasal çözünme yaygındır.","outcomeCode":"COĞ.10.3.2"}],"examSummary":["CBS (bilgisayarlı akıllı harita) sisteminde şekilleri 3 basit gruba ayır: Kuyu, ağaç, tepe gibi tek yerler \"Nokta\"; nehir, yol, fay hattı gibi uzayan şeyler \"Çizgi\"; göl, orman, ilçe sınırı gibi kapladığı alanı olan yerler \"Poligon (Alan)\" katmanıdır.","Kayaların gece-gündüz sıcaktan ve soğuktan çatlayıp kum gibi dağılmasına \"Fiziksel Çözünme\" (kurak çöllerde ve İç Anadolu’da); yağmur sularıyla eriyip toprağa dönüşmesine ise \"Kimyasal Çözünme\" (yağışlı Karadeniz ve Akdeniz’de) denir.","Peri bacalarını oluşturan asıl güç yamaçlardan hızla akan sel sularıdır (akarsudur); rüzgâr ise sadece sonradan rötuş yapan yardımcı kuvvettir. Menderes (büklüm) ve Seki (basamak) ise hem aşındırma hem biriktirme şeklidir."],"simpleExplanation":{"oneSentenceSummary":"Harita yaparken bilgisayar katmanlarını (CBS) nasıl kullandığımızı, kayaların iklime göre nasıl ufalandığını ve akarsuların yeryüzünü nasıl şekillendirdiğini öğreniyoruz.","dailyLifeAnalogy":"Google Haritalar’da \"trafik\", \"uydu görüntüsü\" ve \"restoranlar\"ı üst üste açıp kapatmak Coğrafi Bilgi Sistemi (CBS)’dir: Kuyular NOKTA, yollar ve nehirler ÇİZGİ, göller ve ormanlar ise ALAN (Poligon) olarak çizilir.","stepByStepEasyPoints":[{"title":"1. Taşlar Nerede Çatlayarak, Nerede Erimeyle Çözünür?","plainExplanation":"Çöl ve İç Anadolu gibi gündüz çok sıcak, gece buz gibi olan kurak yerlerde taşlar genleşip büzülerek çatlar (Fiziksel Çözünme). Karadeniz ve Ekvator gibi bol yağmurlu ve sıcak yerlerde ise taşlar suyla kimyasal olarak erir (Kimyasal Çözünme).","memoryTrick":"Kurak/Çöl = Fiziksel (Çatlama) · Yağışlı/Nemli = Kimyasal (Erime)."},{"title":"2. Menderes ve Seki Neden Özeldir?","plainExplanation":"Kıvrıla kıvrıla akan nehir (Menderes) bir kıyıyı oyarken karşı kıyıya kum biriktirir. Bu yüzden Menderes ve Seki (Taraça) sınavda \"hem aşınım hem birikim şekli\" olarak sorulur!","memoryTrick":"Menderes + Seki = İkisi bir arada (Hem Aşınım Hem Birikim)."}]},"jargons":[{"term":"CBS (Coğrafi Bilgi Sistemleri)","everydayMeaning":"Harita bilgilerini bilgisayarda üst üste şeffaf katmanlar (yol, su, nüfus, deprem) halinde toplayıp analiz eden akıllı sistem.","realLifeExample":"Telefonumuzdaki navigasyonun trafik, yol ve restoran katmanlarını üst üste göstermesi CBS’dir."},{"term":"Fiziksel vs Kimyasal Çözünme","everydayMeaning":"Fiziksel çözünme kayanın sıcaktan-soğuktan çatlayıp ufalanması; kimyasal çözünme ise suyla eriyip yapısının değişmesidir.","realLifeExample":"Bardağa çatlak girmesi fiziksel çözünme, küp şekerin çayda erimesi kimyasal çözünme gibidir."},{"term":"Menderes ve Seki (Taraça)","everydayMeaning":"Menderes akarsuyun yılan gibi kıvrılarak akması; Seki ise akarsu yatağının kenarında oluşan merdiven basamağı şeklidir.","realLifeExample":"İkisi de sınavda \"hem aşındırma hem biriktirme şekli\" olarak sorulan en özel ikilidir."}],"traps":[{"wrongThinking":"Peri bacalarını doğrudan rüzgârların aşındırarak oluşturduğunu sanmak.","correctThinking":"Peri bacalarını oluşturan asıl kuvvet akarsulardır (sel sularıdır); rüzgâr sadece dolaylı yardımcıdır!"},{"wrongThinking":"CBS’de akarsu veya kara yolunu \"Alan (Poligon)\" katmanı sanmak.","correctThinking":"Uzunluğu olan yol, akarsu ve fay hatları her zaman \"Çizgi (Line)\" veri katmanıdır."}],"flashcards":[{"id":"cog-10-1-1-fc-step-0","frontQuestion":"Taşlar Nerede Çatlayarak, Nerede Erimeyle Çözünür?","backAnswer":"Çöl ve İç Anadolu gibi gündüz çok sıcak, gece buz gibi olan kurak yerlerde taşlar genleşip büzülerek çatlar (Fiziksel Çözünme). Karadeniz ve Ekvator gibi bol yağmurlu ve sıcak yerlerde ise taşlar suyla kimyasal olarak erir (Kimyasal Çözünme). (Şifre: Kurak/Çöl = Fiziksel (Çatlama) · Yağışlı/Nemli = Kimyasal (Erime).)","tag":"Hızlı Kavrama"},{"id":"cog-10-1-1-fc-step-1","frontQuestion":"Menderes ve Seki Neden Özeldir?","backAnswer":"Kıvrıla kıvrıla akan nehir (Menderes) bir kıyıyı oyarken karşı kıyıya kum biriktirir. Bu yüzden Menderes ve Seki (Taraça) sınavda \"hem aşınım hem birikim şekli\" olarak sorulur! (Şifre: Menderes + Seki = İkisi bir arada (Hem Aşınım Hem Birikim).)","tag":"Hızlı Kavrama"},{"id":"cog-10-1-1-fc-jg-0","frontQuestion":"\"CBS (Coğrafi Bilgi Sistemleri)\" günlük dilde ne demektir?","backAnswer":"Harita bilgilerini bilgisayarda üst üste şeffaf katmanlar (yol, su, nüfus, deprem) halinde toplayıp analiz eden akıllı sistem. — Örnek: Telefonumuzdaki navigasyonun trafik, yol ve restoran katmanlarını üst üste göstermesi CBS’dir.","tag":"Terim Çevirici"},{"id":"cog-10-1-1-fc-jg-1","frontQuestion":"\"Fiziksel vs Kimyasal Çözünme\" günlük dilde ne demektir?","backAnswer":"Fiziksel çözünme kayanın sıcaktan-soğuktan çatlayıp ufalanması; kimyasal çözünme ise suyla eriyip yapısının değişmesidir. — Örnek: Bardağa çatlak girmesi fiziksel çözünme, küp şekerin çayda erimesi kimyasal çözünme gibidir.","tag":"Terim Çevirici"},{"id":"cog-10-1-1-fc-jg-2","frontQuestion":"\"Menderes ve Seki (Taraça)\" günlük dilde ne demektir?","backAnswer":"Menderes akarsuyun yılan gibi kıvrılarak akması; Seki ise akarsu yatağının kenarında oluşan merdiven basamağı şeklidir. — Örnek: İkisi de sınavda \"hem aşındırma hem biriktirme şekli\" olarak sorulan en özel ikilidir.","tag":"Terim Çevirici"}]},{"id":"fel-10-1-1","subjectId":"felsefe","unitTitle":"1. ve 2. Ünite: Felsefenin Doğası, Mantık ve Argümantasyon","title":"Felsefi Düşüncenin Özellikleri, Düşünme-Dil İlişkisi ve Argümantasyonun Yapısı","outcomeCode":"FEL.10.1.1 - FEL.10.2.2","outcomeDescription":"FEL.10.1.1 Felsefenin anlamı ve işlevi, FEL.10.2.1 Düşünme ve dil ilişkisi, FEL.10.2.2 Mantığın temel kavramları ve argümantasyon süreci (Senaryo 1–4)","scenarios":"Senaryo 1, 2, 3, 4 ve 5","sourcePages":"Ünite 1 & 2 Özeti","lecturePoints":[{"heading":"Felsefenin Anlamı ve Felsefi Düşüncenin Özellikleri (FEL.10.1.1)","content":"Philosophia \"bilgelik sevgisi\" demektir. Felsefi düşünce; sorgulayıcı, eleştirel, refleksif (düşüncenin kendi üzerine yönelmesi), rasyonel (akla dayalı), tutarlı, sistemli, tümel (bütüncül) ve kümülatif (yığılımlı olarak ilerleyen, kesin bitmiş cevapları olmayan) bir etkinliktir.","formulaOrRule":"Refleksiflik = Düşünme üzerine düşünme · Kümülatiflik = Birikimli olma (İlerlememe)","summaryOfSummary":"Özetin Özeti: Felsefe \"bilgelik sevgisi\" demektir; kesin ve bitmiş cevaplar aramak yerine sürekli soru sormayı ve eleştirmeyi temel alır. Düşüncenin kendi üzerine dönüp \"Ben bunu gerçekten biliyor muyum?\" diye kendini sorgulamasına Refleksiflik, bilgilerin yığılarak birikmesine Kümülatiflik denir."},{"heading":"Düşünme ve Dil İlişkisi (FEL.10.2.1)","content":"Kavramlar düşüncenin yapı taşları, kelimeler ise kavramların dildeki sembolleridir. Dil, düşüncenin yalnızca aktarım aracı değil, aynı zamanda düşüncenin sınırlarını ve berraklığını belirleyen zemindir.","formulaOrRule":"Varlık → Zihindeki Tasarım (Kavram) → Dildeki İfade (Terim/Sözcük)","summaryOfSummary":"Özetin Özeti: Zihnimizdeki fikir taslaklarına \"Kavram\", bunları konuşurken veya yazarken kullandığımız kelimelere ise \"Terim/Sözcük\" denir. Dil ne kadar zengin ve net olursa, insanın düşünmesi de o kadar berrak ve geniş olur."},{"heading":"Mantık ve Argümantasyonun Yapısı (FEL.10.2.2)","content":"Doğru ya da yanlış yargı bildiren cümlelere önerme denir (soru, emir, istek cümleleri önerme değildir). En az bir öncül (gerekçe/kanıt) ve bir sonuç önermesinden oluşan yapıya argüman (çıkarım) denir. Öncüller doğru kabul edildiğinde sonuç zorunlu olarak çıkıyorsa çıkarım geçerlidir.","formulaOrRule":"Öncül 1 + Öncül 2 (Gerekçeler) ⇒ Sonuç Önermesi (İddia/Tez)","summaryOfSummary":"Özetin Özeti: Doğru veya yanlış diyebildiğimiz yargı cümlelerine \"Önerme\" denir (soru, emir ve dilek cümleleri önerme değildir). Kanıt cümlelerine \"Öncül\" (çünkü ile başlar), savunulan ana fikre ise \"Sonuç\" (o hâlde/demek ki ile başlar); ikisinin birleşimine de \"Argüman\" denir."}],"keyConcepts":[{"term":"Refleksif Düşünce ve Kümülatiflik","definition":"Refleksiflik düşüncenin kendi üzerine dönüp kendini sorgulaması; kümülatiflik ise felsefi bilgilerin bilimdeki gibi birbirini çürüterek değil, üst üste yığılarak birikmesidir.","examTip":"Sınavda bir paragrafta \"düşünmeyi yeniden düşünmek\" geçiyorsa cevap Refleksifliktir.","outcomeCode":"FEL.10.1.1"},{"term":"Argüman, Öncül ve Sonuç","definition":"Bir iddiayı (sonuç önermesini) desteklemek amacıyla sunulan gerekçeler (öncüller) bütününe argüman denir.","examTip":"\"Çünkü, için\" ifadelerinden sonra gelen cümleler Öncül; \"O hâlde, demek ki, sonuç olarak\" ifadelerinden sonra gelen cümle Sonuçtur.","outcomeCode":"FEL.10.2.2"}],"examSummary":["Mantıkta her cümleye \"Önerme\" denmez! Bir cümlenin önerme olması için \"Doğru\" ya da \"Yanlış\" diye kontrol edilebilmesi şarttır; soru (\"Saat kaç?\"), emir (\"Kapıyı kapat!\") ve dua/istek cümleleri asla önerme değildir.","Felsefedeki \"Refleksif olma\" terimi, bildiğimiz bir şeyi körü körüne kabul etmeyip \"Ben bunu gerçekten doğru mu biliyorum?\" diye düşüncenin kendi üzerine dönüp kendini sorgulamasıdır.","Argüman (tartışma/kanıtlama) sorularında \"çünkü, zira, -dığı için\" kelimelerinden sonra gelen cümleler senin kanıtındır (Öncül); \"o hâlde, demek ki, kısacası\" kelimelerinden sonra gelen cümle ise asıl savunduğun fikirdir (Sonuç)."],"simpleExplanation":{"oneSentenceSummary":"Felsefenin \"her şeyi merak edip sorgulama\" sanatı olduğunu ve bir fikri savunurken kanıt (öncül) ile iddiayı (sonuç) nasıl birleştirdiğimizi (argüman) öğreniyoruz.","dailyLifeAnalogy":"Arkadaşına \"Bugün şemsiye almalısın (Sonuç), ÇÜNKÜ meteoroloji sağanak yağış verdi (Öncül/Kanıt)\" dediğinde aslında felsefi bir Argüman kurmuş olursun!","stepByStepEasyPoints":[{"title":"1. Refleksif ve Kümülatif Ne Demek? (En Çok Çıkan 2 Kelime)","plainExplanation":"Refleksif: Ayna gibi düşüncenin kendi kendine dönüp \"Ben bunu doğru mu düşünüyorum?\" diye kendini sorgulamasıdır. Kümülatif: Bilim gibi eskiyi çöpe atmayıp tüm filozofların fikirlerinin üst üste birikmesidir.","memoryTrick":"Refleksif = Düşünmeyi tekrar düşünmek · Kümülatif = Üst üste yığılıp birikmek."},{"title":"2. Hangi Cümleler Önermedir, Hangileri Değildir?","plainExplanation":"Sonuna \"Doğru veya Yanlış\" diyebildiğin net yargı cümleleri önermedir (\"Ankara başkettir\"). Ama \"Kapıyı kapat!\", \"Acaba sınav kolay mı?\", \"Keşke tatil olsa\" gibi emir, soru ve dilek cümleleri önerme DEĞİLDİR!","memoryTrick":"Soru, Emir, İstek cümlesi = Önerme DEĞİLDİR!"}]},"jargons":[{"term":"Refleksif Düşünce","everydayMeaning":"İnsanın bildiği bir şeyi hazır kabul etmeyip \"Ben bunu nereden biliyorum, gerçekten doğru mu?\" diye kendi düşüncesini sorgulaması.","realLifeExample":"Aynada kendi yüzüne bakmak gibi, zihnin kendi düşüncesine dönüp bakmasıdır."},{"term":"Kümülatif Olma (Yığılımlı)","everydayMeaning":"Felsefede eski düşüncelerin çöpe atılmaması, her filozofun fikrinin üst üste birikerek zenginleşmesi.","realLifeExample":"Bugün hâlâ 2500 yıl önceki Platon ve Aristoteles’in fikirlerini okumamız felsefenin kümülatif olmasıdır."},{"term":"Önerme, Öncül ve Argüman","everydayMeaning":"Doğru/yanlış diyebildiğimiz cümleye Önerme, sunduğumuz kanıtlara Öncül, kanıtlarla sonuca ulaşmaya Argüman denir.","realLifeExample":"\"Hava yağmurlu (Öncül), o hâlde şemsiye almalıyım (Sonuç)\" bir argümandır."}],"traps":[{"wrongThinking":"\"Keşke sınavdan 100 alsam!\" veya \"Ödevini yaptın mı?\" cümlelerini önerme sanmak.","correctThinking":"Soru, istek, dua ve emir cümleleri doğru/yanlış yargı bildirmediği için mantıkta ÖNERME DEĞİLDİR!"}],"flashcards":[{"id":"fel-10-1-1-fc-step-0","frontQuestion":"Refleksif ve Kümülatif Ne Demek? (En Çok Çıkan 2 Kelime)","backAnswer":"Refleksif: Ayna gibi düşüncenin kendi kendine dönüp \"Ben bunu doğru mu düşünüyorum?\" diye kendini sorgulamasıdır. Kümülatif: Bilim gibi eskiyi çöpe atmayıp tüm filozofların fikirlerinin üst üste birikmesidir. (Şifre: Refleksif = Düşünmeyi tekrar düşünmek · Kümülatif = Üst üste yığılıp birikmek.)","tag":"Hızlı Kavrama"},{"id":"fel-10-1-1-fc-step-1","frontQuestion":"Hangi Cümleler Önermedir, Hangileri Değildir?","backAnswer":"Sonuna \"Doğru veya Yanlış\" diyebildiğin net yargı cümleleri önermedir (\"Ankara başkettir\"). Ama \"Kapıyı kapat!\", \"Acaba sınav kolay mı?\", \"Keşke tatil olsa\" gibi emir, soru ve dilek cümleleri önerme DEĞİLDİR! (Şifre: Soru, Emir, İstek cümlesi = Önerme DEĞİLDİR!)","tag":"Hızlı Kavrama"},{"id":"fel-10-1-1-fc-jg-0","frontQuestion":"\"Refleksif Düşünce\" günlük dilde ne demektir?","backAnswer":"İnsanın bildiği bir şeyi hazır kabul etmeyip \"Ben bunu nereden biliyorum, gerçekten doğru mu?\" diye kendi düşüncesini sorgulaması. — Örnek: Aynada kendi yüzüne bakmak gibi, zihnin kendi düşüncesine dönüp bakmasıdır.","tag":"Terim Çevirici"},{"id":"fel-10-1-1-fc-jg-1","frontQuestion":"\"Kümülatif Olma (Yığılımlı)\" günlük dilde ne demektir?","backAnswer":"Felsefede eski düşüncelerin çöpe atılmaması, her filozofun fikrinin üst üste birikerek zenginleşmesi. — Örnek: Bugün hâlâ 2500 yıl önceki Platon ve Aristoteles’in fikirlerini okumamız felsefenin kümülatif olmasıdır.","tag":"Terim Çevirici"},{"id":"fel-10-1-1-fc-jg-2","frontQuestion":"\"Önerme, Öncül ve Argüman\" günlük dilde ne demektir?","backAnswer":"Doğru/yanlış diyebildiğimiz cümleye Önerme, sunduğumuz kanıtlara Öncül, kanıtlarla sonuca ulaşmaya Argüman denir. — Örnek: \"Hava yağmurlu (Öncül), o hâlde şemsiye almalıyım (Sonuç)\" bir argümandır.","tag":"Terim Çevirici"}]},{"id":"dkab-10-1-1","subjectId":"dkab","unitTitle":"İslam’da Varlık, Bilgi ve Allah’ı Tanımak","title":"İslam’da Bilgi Kaynakları, Allah-Âlem İlişkisi, İsra 36 / Mülk 23 ve Varlık Delilleri","outcomeCode":"DKAB.10.1.1 - DKAB.10.2.1","outcomeDescription":"DKAB.10.1.1 Bilgi kaynakları, DKAB.10.1.2 Allah-âlem ilişkisi, DKAB.10.1.3 İsra 36 ve Mülk 23, DKAB.10.2.1 Allah’ın varlığının delilleri (Senaryo 1-3)","scenarios":"Senaryo 1, 2, 3 ve
