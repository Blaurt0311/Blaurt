 4","sourcePages":"Sayfa 14–72","lecturePoints":[{"heading":"İslam’da Bilginin Kaynakları (DKAB.10.1.1)","content":"İslam düşüncesinde doğru bilginin (ilm-i yakîn) üç temel kaynağı vardır: 1) Selim Akıl (önyargılardan arınmış, sağlıklı düşünen akıl), 2) Sadık Haber (Vahiy ve Mütevatir haber), 3) Salim Duyular (işlevini kaybetmemiş beş duyu organı). Rüyalar, ilham ve sezgi öznel olduğu için herkesi bağlayıcı kesin bilgi kaynağı değildir.","formulaOrRule":"3 Temel Bilgi Kaynağı: Selim Akıl · Sadık Haber (Vahiy/Mütevatir) · Salim Duyular","summaryOfSummary":"Özetin Özeti: İslam’da herkesi bağlayan doğru bilgiye sadece 3 yolla ulaşılır: Sağlıklı düşünen akıl (Selim Akıl), beş duyu organımız (Salim Duyular) ve yalan ihtimali olmayan doğru haber (Sadık Haber: Vahiy ve Mütevatir haber). Rüya, fal veya ilham kişiye özeldir; herkes için kanıt olamaz."},{"heading":"Allah-Âlem İlişkisi ve İsra 36 / Mülk 23 Ayetleri (DKAB.10.1.2-3)","content":"Allah dışındaki her şeye \"âlem (mâsivâ)\" denir. Allah, âlemin hem yoktan yaratıcısı (Hâlık) hem de her an yönetip rızıklandıranıdır (Rab ve Kayyûm). İsra Suresi 36. ayette \"Hakkında kesin bilgin olmayan şeyin peşine düşme; çünkü kulak, göz ve kalp bunların hepsi ondan sorumludur\" buyrularak bilgi ahlakı vurgulanır. Mülk Suresi 23. ayette ise insana verilen işitme, görme ve akletme yetilerinin şükür gerektirdiği hatırlatılır.","formulaOrRule":"İsra 36: Kulak, göz ve kalp (akıl) sorumluluğu · Mülk 23: Duyular ve akıl nimetine şükür","summaryOfSummary":"Özetin Özeti: Allah dışındaki tüm varlıklara \"Âlem\" denir; Allah âlemi yoktan var eden ve her an yönetendir. İsra 36. ayet \"Bilmediğin şeyin peşine düşme; göz, kulak ve kalp sorumludur\" diyerek bilgi ahlakını, Mülk 23. ayet ise bu nimetlere şükretmeyi öğütler."},{"heading":"Allah’ın Varlığının Delilleri (DKAB.10.2.1 — Senaryo 1, 2, 3)","content":"1) Gaye ve Nizam Delili (Teleolojik Delil): Evrendeki hassas ölçü, düzen ve amaçlılıktan üstün bir tasarımcının (Allah’ın) varlığına ulaşır. 2) Hudûs Delili: Sonradan yaratılan (hâdis) evrenin, başlangıcı olmayan ezeli bir yaratıcıya (Muhdis) muhtaç olduğunu savunur. 3) İmkân Delili: Varlığı ve yokluğu eşit olan (mümkün varlık) âlemin var olabilmesi için Zorunlu Varlık’a (Vâcibü’l-Vücûd) dayanması gerektiğini açıklar.","formulaOrRule":"Düzen/Ölçü → Gaye ve Nizam · Sonradan Var Olma → Hudûs · Zorunlu/Mümkün Varlık → İmkân","summaryOfSummary":"Özetin Özeti: Evrendeki muazzam ölçü ve düzenden Allah’ın varlığına ulaşmaya \"Gaye ve Nizam Delili\" denir. Evrenin sonradan var olmasından bir başlatıcıya ulaşmaya \"Hudûs Delili\", varlığı zorunlu olan Yaratıcı fikrinden hareket etmeye ise \"İmkân Delili\" denir."}],"keyConcepts":[{"term":"Sadık Haber (Vahiy ve Mütevatir Haber)","definition":"İslam’da doğruluğu kesin olan haber kaynağıdır; Allah’tan peygamberlere gelen Vahiy ile yalan söylemesi imkânsız kalabalıkların naklettiği Mütevatir haberi kapsar.","examTip":"Sınavda \"İlham veya rüya herkes için bağlayıcı bilgi kaynağı mıdır?\" sorusunun cevabı kesinlikle Hayır (Özneldir) olmalıdır.","outcomeCode":"DKAB.10.1.1"},{"term":"Gaye ve Nizam Delili ile Hudûs Delili","definition":"Gaye ve Nizam evrendeki ölçü ve düzenden; Hudûs delili ise evrenin sonradan yaratılmış (hâdis) olmasından hareketle Allah’ın varlığını kanıtlar.","examTip":"DKAB.10.2.1 tüm ortak senaryolarda (1, 2 ve 3) yer alır; üç delilin ayrımını mutlaka bilin.","outcomeCode":"DKAB.10.2.1"}],"examSummary":["İslam’da herkes için geçerli 3 kesin bilgi kaynağı vardır: Sağlıklı düşünen akıl (Selim Akıl), beş duyu organımız (Salim Duyular) ve içinde yalan olmayan doğru haber (Sadık Haber: Kur’an vahyi ve binlerce kişinin aktardığı Mütevatir haber). Rüya ve ilham kişiye özeldir, kesin kanıt sayılmaz!","İsra Suresi 36. ayet bize günlük hayatta çok net bir kural koyar: \"Kesin olarak bilmediğin bir sözün, dedikodunun veya zannın peşine düşme; çünkü gözün, kulağın ve aklın bundan hesaba çekilecektir.\"","Allah’ın varlığının delillerini tek kelimeyle yakala: Soruda \"evrendeki muazzam düzen, ölçü, denge\" diyorsa Gaye ve Nizam Delili; \"evren sonradan var oldu, her başlayan şeyin bir başlatıcısı vardır\" diyorsa Hudûs Delilidir."],"simpleExplanation":{"oneSentenceSummary":"İslam’da doğru bilgiye hangi 3 sağlam yoldan ulaşıldığını, kulaktan dolma sözlerle hareket etmemeyi (İsra 36) ve evrendeki düzenden Allah’ın varlığını gösteren 3 delili öğreniyoruz.","dailyLifeAnalogy":"Bir haber duyduğunda hemen inanmayıp \"Gözümle gördüm mü (Salim Duyular), aklım yatıyor mu (Selim Akıl), kaynağı %100 güvenilir mi (Sadık Haber)?\" diye kontrol etmek İslam’ın bilgi anlayışıdır.","stepByStepEasyPoints":[{"title":"1. Rüya ve İlham Neden Kesin Bilgi Kaynağı Değildir?","plainExplanation":"İslam’da herkesi bağlayan doğru bilgi sadece 3 tanedir: Selim Akıl, Salim Duyular ve Sadık Haber (Vahiy). Bir kişinin gördüğü rüya veya iç doğması (ilham) sadece kendisini ilgilendirir, başkası için kanıt olamaz!","memoryTrick":"Kesin Bilgi = Akıl + 5 Duyu + Vahiy (Rüya ve ilham kesin bilgi değildir!)."},{"title":"2. Gaye-Nizam, Hudûs ve İmkân Delillerini Tek Kelimeyle Ayırt Et!","plainExplanation":"Soruda \"evrendeki muazzam düzen, ölçü, uyum\" diyorsa GAYE VE NİZAM; \"evren sonradan var oldu, her sonradan olanın bir başlatıcısı vardır\" diyorsa HUDÛS; \"evren olabilirdi de olmayabilirdi de, onu tercih eden Zorunlu Varlık vardır\" diyorsa İMKÂN delilidir.","memoryTrick":"Düzen/Uyum = Gaye ve Nizam · Sonradan Olma = Hudûs · Olabilirlik = İmkân."}]},"jargons":[{"term":"Selim Akıl ve Salim Duyular","everydayMeaning":"Selim akıl önyargısız, temiz düşünen akıl; salim duyular ise bozulmamış, sağlıklı çalışan 5 duyu organımızdır.","realLifeExample":"Dedikoduya inanmayıp gerçeği araştıran akıl \"Selim Akıl\"dır."},{"term":"Mütevatir Haber","everydayMeaning":"Yalan söylemek için sözleşmeleri imkânsız olan çok kalabalık bir topluluğun nesilden nesile aktardığı %100 kesin haber.","realLifeExample":"Hiç gitmesek bile Mekke’nin varlığını veya Kur’an ayetlerinin değişmeden geldiğini mütevatir haberle kesin biliriz."},{"term":"Gaye-Nizam ve Hudûs Delili","everydayMeaning":"Gaye-Nizam evrendeki muazzam düzenden; Hudûs ise evrenin sonradan var olmasından Allah’ın varlığına ulaşan kanıttır.","realLifeExample":"Kusursuz çalışan bir saatin ustasını düşünmek Gaye-Nizam; yeni yapılan bir binanın mimarını düşünmek Hudûs delilidir."}],"traps":[{"wrongThinking":"Salih rüyalar veya evliyaların ilhamı İslam’da herkes için kesin bilgi kaynağıdır sanmak.","correctThinking":"Rüya ve ilham kişiye özeldir (özneldir); İslam’da herkesi bağlayan bilgi kaynakları sadece Akıl, 5 Duyu ve Sadık Haberdir."}],"flashcards":[{"id":"dkab-10-1-1-fc-step-0","frontQuestion":"Rüya ve İlham Neden Kesin Bilgi Kaynağı Değildir?","backAnswer":"İslam’da herkesi bağlayan doğru bilgi sadece 3 tanedir: Selim Akıl, Salim Duyular ve Sadık Haber (Vahiy). Bir kişinin gördüğü rüya veya iç doğması (ilham) sadece kendisini ilgilendirir, başkası için kanıt olamaz! (Şifre: Kesin Bilgi = Akıl + 5 Duyu + Vahiy (Rüya ve ilham kesin bilgi değildir!).)","tag":"Hızlı Kavrama"},{"id":"dkab-10-1-1-fc-step-1","frontQuestion":"Gaye-Nizam, Hudûs ve İmkân Delillerini Tek Kelimeyle Ayırt Et!","backAnswer":"Soruda \"evrendeki muazzam düzen, ölçü, uyum\" diyorsa GAYE VE NİZAM; \"evren sonradan var oldu, her sonradan olanın bir başlatıcısı vardır\" diyorsa HUDÛS; \"evren olabilirdi de olmayabilirdi de, onu tercih eden Zorunlu Varlık vardır\" diyorsa İMKÂN delilidir. (Şifre: Düzen/Uyum = Gaye ve Nizam · Sonradan Olma = Hudûs · Olabilirlik = İmkân.)","tag":"Hızlı Kavrama"},{"id":"dkab-10-1-1-fc-jg-0","frontQuestion":"\"Selim Akıl ve Salim Duyular\" günlük dilde ne demektir?","backAnswer":"Selim akıl önyargısız, temiz düşünen akıl; salim duyular ise bozulmamış, sağlıklı çalışan 5 duyu organımızdır. — Örnek: Dedikoduya inanmayıp gerçeği araştıran akıl \"Selim Akıl\"dır.","tag":"Terim Çevirici"},{"id":"dkab-10-1-1-fc-jg-1","frontQuestion":"\"Mütevatir Haber\" günlük dilde ne demektir?","backAnswer":"Yalan söylemek için sözleşmeleri imkânsız olan çok kalabalık bir topluluğun nesilden nesile aktardığı %100 kesin haber. — Örnek: Hiç gitmesek bile Mekke’nin varlığını veya Kur’an ayetlerinin değişmeden geldiğini mütevatir haberle kesin biliriz.","tag":"Terim Çevirici"},{"id":"dkab-10-1-1-fc-jg-2","frontQuestion":"\"Gaye-Nizam ve Hudûs Delili\" günlük dilde ne demektir?","backAnswer":"Gaye-Nizam evrendeki muazzam düzenden; Hudûs ise evrenin sonradan var olmasından Allah’ın varlığına ulaşan kanıttır. — Örnek: Kusursuz çalışan bir saatin ustasını düşünmek Gaye-Nizam; yeni yapılan bir binanın mimarını düşünmek Hudûs delilidir.","tag":"Terim Çevirici"}]},{"id":"tde-10-1-1","subjectId":"edebiyat","unitTitle":"1. Tema: Sözün Ezgisi & 2. Tema: Kelimelerin Ritmi","title":"Koşuk, Koşma, Türkü, Ninni, Gazel, Kaside, Saf Şiir ve Masal Film Şeridi","outcomeCode":"TDE.10.1-2","outcomeDescription":"Ülke Geneli Ortak Yazılı: Koşuk, Koşma, Türkü, Ninni; Masalı Film Şeridi Hâline Getirme; Gazel, Kaside ve Saf Şiir","scenarios":"Ülke Geneli Ortak Yazılı Sınav Kılavuzu","sourcePages":"1. ve 2. Tema Tam Kapsam","lecturePoints":[{"heading":"1. Tema Sözün Ezgisi: Koşuk, Koşma, Türkü ve Ninni","content":"Koşuk: İslamiyet öncesi Sözlü Dönem’de sığır ve şölen törenlerinde kopuz eşliğinde söylenen, hece ölçülü (7’li, 8’li, 11’li), aaab / cccb uyaklı, doğa-yiğitlik-aşk temalı şiirdir. Koşma: Âşık edebiyatında 11’li hece ölçüsüyle (4+4+3 veya 6+5), 3-5 dörtlük hâlinde söylenen, son dörtlükte şairin mahlasını (tapşırma) geçirdiği nazım biçimidir; Halk edebiyatındaki karşılığı Koşuk, Divan edebiyatındaki karşılığı Gazeldir. Türkü: Ezgiyle söylenen, asıl sözlerin bulunduğu \"bent\" ve nakarat olan \"kavuştak (bağlama)\" bölümlerinden oluşan anonim/âşık halk şiiridir.","formulaOrRule":"Koşuk (İslam Öncesi) → Koşma (Âşık Edebiyatı) → Gazel (Divan Edebiyatı)","summaryOfSummary":"Özetin Özeti: Aşk, doğa ve yiğitlik şiirine İslam öncesinde kopuzla söylenirken \"Koşuk\", Halk edebiyatında bağlamayla söylenirken \"Koşma\" denir; ikisi de dörtlük ve hece ölçüsü kullanır. Her kıtanın sonunda tekrar eden nakarat (kavuştak) satırları olan ezgili halk şiirine ise \"Türkü\" denir."},{"heading":"2. Tema Kelimelerin Ritmi: Gazel, Kaside ve Saf (Öz) Şiir","content":"Gazel: Divan edebiyatında aşk, şarap, güzellik temalı, aruz ölçülü, 5–15 beyitten oluşan, aa / ba / ca uyaklı nazım biçimidir (ilk beyit matla, son beyit makta, en güzel beyit beytül-gazel). Kaside: Din ve devlet büyüklerini övmek için yazılan, 33–99 beyitlik, aa / ba / ca uyaklı Divan şiiridir (Nesib/Teşbib, Girizgâh, Methiye, Tegazzül, Fahriye, Dua bölümleri). Saf (Öz) Şiir: Ahmet Haşim, Yahya Kemal, Necip Fazıl, Cahit Sıtkı gibi şairlerin temsil ettiği; şiirde her türlü ideoloji ve öğreticiliği reddedip yalnızca \"ahenk, musiki ve estetik hazzı\" amaçlayan şiir anlayışıdır.","formulaOrRule":"Gazel (5-15 Beyit) & Kaside (33-99 Beyit): İlk beyit Matla (aa), Son beyit Makta (mahlaslı)","summaryOfSummary":"Özetin Özeti: Divan şiirinde beyit (ikilik) ve aruz ölçüsüyle aşk için yazılan şiire \"Gazel\", devlet büyüklerini övmek için yazılana \"Kaside\" denir (ilk beyit Matla, son beyit Makta). Saf (Öz) Şiir ise şiirde ders vermeyi reddedip sadece \"kulağa hoş gelen müzik ve estetik güzelliği\" savunur."},{"heading":"Yazma: Dinlediği Masalı Film Şeridi (Storyboard) Hâline Getirme","content":"Masallar; döşeme (tekerleme), serim, düğüm, çözüm ve dilek bölümlerinden oluşan, yer ve zamanın belirsiz olduğu olağanüstü anlatılardır. Film şeridi oluştururken masalın olay örgüsü kronolojik sahnelere (karesine) ayrılır, her sahne için görsel betimleme, mekân, kişiler ve kısa diyalog/alt yazı planlanır.","formulaOrRule":"Masal Planı: Döşeme (Tekerleme) → Serim → Düğüm → Çözüm → İyi Dilek","summaryOfSummary":"Özetin Özeti: Masallar; tekerleme (döşeme), serim, düğüm, çözüm ve iyi dilek bölümlerinden oluşan olağanüstü hikâyelerdir. Masalı film şeridine (storyboard) çevirirken olayları sırasıyla karelere böler, her kareye mekânı, kahramanları ve kısa konuşmaları yazarız."}],"keyConcepts":[{"term":"Matla, Makta ve Tapşırma (Mahlas)","definition":"Gazel ve kasidede ilk beyte Matla, son beyte Makta denir. Şairin takma adını kullanmasına Divan şiirinde Mahlas, Halk şiirinde (koşmada) Tapşırma denir.","examTip":"Ortak sınavda verilen bir beyit veya dörtlüğün şiirin ilk mi yoksa son bölümü mü olduğunu mahlas/tapşırma ve kafiye dizilişinden (aa) bulabilirsiniz.","outcomeCode":"TDE.10.2"},{"term":"Saf (Öz) Şiir Anlayışı","definition":"Şiiri bir düşünce veya mesaj aktarma aracı değil, sözcüklerin ses ve anlam kaynaşmasından doğan saf bir estetik ve musiki sanatı olarak gören anlayıştır.","examTip":"Ahmet Haşim’in \"Şiir Hakkında Bazı Mülahazalar\" yazısı Türk edebiyatında saf şiirin bildirgesi kabul edilir.","outcomeCode":"TDE.10.2"}],"examSummary":["Koşuk, Koşma ve Gazel aslında aynı konuyu (aşk, doğa, ayrılık) anlatan üç kardeş şiirdir: İslam öncesinde kopuzla dörtlük halinde söylenirse \"Koşuk\", Halk şiirinde bağlamayla dörtlük söylenirse \"Koşma\", Divan şiirinde ikişer satır (beyit) ve aruzla yazılırsa \"Gazel\" adını alır.","Bir halk şiirinin \"Türkü\" olduğunu anlamak çok kolaydır: Her kıtanın (bendin) sonunda aynen tekrar eden nakarat satırları (buna edebiyatta \"kavuştak / bağlama\" denir) varsa o şiir kesinlikle türküdür.","Saf (Öz) Şiir anlayışı şunu savunur: \"Şiir insana ders vermek veya bilgi öğretmek için değil, tıpkı güzel bir müzik parçası gibi kulağa hoş gelmek ve duygu uyandırmak için yazılır.\""],"simpleExplanation":{"oneSentenceSummary":"Aynı aşk ve doğa şiirinin İslam öncesinde \"Koşuk\", Halk edebiyatında \"Koşma\", Divan edebiyatında \"Gazel\" adını aldığını ve saf şiirin \"sadece güzellik için\" yazıldığını öğreniyoruz.","dailyLifeAnalogy":"Aynı şarkıyı eski Orta Asya’da kopuzla söylersen KOŞUK, Anadolu’da bağlamayla söylersen KOŞMA, Osmanlı sarayında aruz ölçüsüyle beyit beyit okursan GAZEL olur!","stepByStepEasyPoints":[{"title":"1. Koşuk - Koşma - Gazel Üçlüsünü Şıp Diye Ayırt Et!","plainExplanation":"Üçü de aşk, doğa ve ayrılığı anlatır. Koşuk (İslam öncesi, kopuz, dörtlük, hece), Koşma (Halk edebiyatı, saz, 11’li hece, dörtlük), Gazel (Divan edebiyatı, beyit yani ikilik, aruz ölçüsü).","memoryTrick":"Dörtlük + Kopuz = Koşuk · Dörtlük + Saz = Koşma · İkilik (Beyit) + Aruz = Gazel."},{"title":"2. Matla, Makta, Mahlas ve Tapşırma Nedir?","plainExplanation":"Gazel veya Kasidenin İLK beytine Matla (doğuş), SON beytine Makta (bitiş) denir. Şairin son dörtlükte/beyitte kendi takma adını söylemesine Halk şiirinde Tapşırma, Divan şiirinde Mahlas denir.","memoryTrick":"İlk beyit = Matla (aa kafiyeli) · Son beyit = Makta (İçinde şairin adı/mahlası geçer)."}]},"jargons":[{"term":"Matla ve Makta Beyti","everydayMeaning":"Divan şiirinde (Gazel ve Kasidede) şiirin İLK ikiliğine (beytine) Matla, SON ikiliğine ise Makta denir.","realLifeExample":"Güneşin doğuşuna \"Matla\" (başlangıç), sözün kesildiği yere \"Makta\" (bitiş) diye kodlayabilirsin."},{"term":"Tapşırma ve Mahlas","everydayMeaning":"Şairin şiirin son dörtlüğünde veya son beytinde kendi takma adını (imzasını) kullanması.","realLifeExample":"Halk şiirinde \"Karacaoğlan der ki...\" demesi Tapşırma; Divan şiirinde \"Fuzûlî\" adını geçirmesi Mahlastır."},{"term":"Kavuştak (Bağlama)","everydayMeaning":"Türkülerde her kıtanın (bendin) sonunda aynen tekrar edilen ezgili nakarat satırları.","realLifeExample":"Bir şarkıda herkesin hep bir ağızdan söylediği tekrar kısmı türküdeki kavuştaktır."}],"traps":[{"wrongThinking":"Koşuk ve Koşma’nın beyitlerle ve aruz ölçüsüyle yazıldığını sanmak.","correctThinking":"Koşuk ve Koşma öz Türkçe şiirlerdir; dörtlüklerle ve hece ölçüsüyle söylenir (Beyit + Aruz olan Gazeldir)."}],"flashcards":[{"id":"tde-10-1-1-fc-step-0","frontQuestion":"Koşuk - Koşma - Gazel Üçlüsünü Şıp Diye Ayırt Et!","backAnswer":"Üçü de aşk, doğa ve ayrılığı anlatır. Koşuk (İslam öncesi, kopuz, dörtlük, hece), Koşma (Halk edebiyatı, saz, 11’li hece, dörtlük), Gazel (Divan edebiyatı, beyit yani ikilik, aruz ölçüsü). (Şifre: Dörtlük + Kopuz = Koşuk · Dörtlük + Saz = Koşma · İkilik (Beyit) + Aruz = Gazel.)","tag":"Hızlı Kavrama"},{"id":"tde-10-1-1-fc-step-1","frontQuestion":"Matla, Makta, Mahlas ve Tapşırma Nedir?","backAnswer":"Gazel veya Kasidenin İLK beytine Matla (doğuş), SON beytine Makta (bitiş) denir. Şairin son dörtlükte/beyitte kendi takma adını söylemesine Halk şiirinde Tapşırma, Divan şiirinde Mahlas denir. (Şifre: İlk beyit = Matla (aa kafiyeli) · Son beyit = Makta (İçinde şairin adı/mahlası geçer).)","tag":"Hızlı Kavrama"},{"id":"tde-10-1-1-fc-jg-0","frontQuestion":"\"Matla ve Makta Beyti\" günlük dilde ne demektir?","backAnswer":"Divan şiirinde (Gazel ve Kasidede) şiirin İLK ikiliğine (beytine) Matla, SON ikiliğine ise Makta denir. — Örnek: Güneşin doğuşuna \"Matla\" (başlangıç), sözün kesildiği yere \"Makta\" (bitiş) diye kodlayabilirsin.","tag":"Terim Çevirici"},{"id":"tde-10-1-1-fc-jg-1","frontQuestion":"\"Tapşırma ve Mahlas\" günlük dilde ne demektir?","backAnswer":"Şairin şiirin son dörtlüğünde veya son beytinde kendi takma adını (imzasını) kullanması. — Örnek: Halk şiirinde \"Karacaoğlan der ki...\" demesi Tapşırma; Divan şiirinde \"Fuzûlî\" adını geçirmesi Mahlastır.","tag":"Terim Çevirici"},{"id":"tde-10-1-1-fc-jg-2","frontQuestion":"\"Kavuştak (Bağlama)\" günlük dilde ne demektir?","backAnswer":"Türkülerde her kıtanın (bendin) sonunda aynen tekrar edilen ezgili nakarat satırları. — Örnek: Bir şarkıda herkesin hep bir ağızdan söylediği tekrar kısmı türküdeki kavuştaktır.","tag":"Terim Çevirici"}]},{"id":"alm-5-1","subjectId":"almanca","unitTitle":"5. Ünite (Themenkreis 5): Essen und Trinken","title":"5A & 5B: Lebensmittel, Obst & Gemüse, Esszeiten, „mögen“ ve „aber“","outcomeCode":"ALM.A1.1.5.AB","outcomeDescription":"Yiyecek-içecekleri (Lebensmittel), meyve-sebzeleri artikelleri ve çoğul ekleriyle adlandırma; öğünlerde (Frühstück, Mittagessen, Abendessen) ne yenip içildiğini, „mögen“ modal fiili ve „aber“ bağlacıyla sevilen/sevilmeyen gıdaları ifade edebilme","scenarios":"Sadece 5. Ünite Sınav Kapsamı (Sayfa 54–59 & 102)","sourcePages":"Sayfa 54–59 ve Sayfa 102 (Grammatikübersicht)","lecturePoints":[{"heading":"A. Lebensmittel, Obst & Gemüse: Artikeller (der/die/das) ve Çoğul Ekleri (Sayfa 54–57)","content":"Kitabın 55–57. sayfalarında geçen temel gıdalar artikelleriyle öğrenilir: DER (eril): der Apfel (elma → die Äpfel), der Salat (marul/salata → die Salate), der Blumenkohl (karnabahar → die Blumenkohle), der Spinat (ıspanak → die Spinate), der Honig (bal), der Paprika (biber → die Paprikas), der Käse (peynir), der Brokkoli (brokoli → die Brokkolis), der Fisch (balık), der Döner, der Kartoffelsalat, der Pfannkuchen (krep). DIE (dişil — çoğulu hep -n/-en alır): die Banane (Bananen), die Gurke (Gurken), die Zitrone (Zitronen), die Aubergine (Auberginen), die Kartoffel (Kartoffeln), die Olive (Oliven), die Zwiebel (Zwiebeln), die Tomate (Tomaten), die Marmelade, die Kirsche (Kirschen), die Orange (Orangen), die Birne (Birnen), die Bohne (Bohnen), die Karotte (Karotten), die Erdbeere (Erdbeeren), die Kiwi (Kiwis), die Pizza. DAS (nötr): das Brot (ekmek), das Ei (yumurta → die Eier), das Obst (meyve — SADECE TEKİL / nur Singular!), das Gemüse (sebze — SADECE TEKİL / nur Singular!), das Fleisch (et — çoğulu yok), das Wiener Schnitzel. Tekil soruda \"Was ist das? → Das ist eine Orange / ein Apfel / ein Ei\", çoğul soruda \"Was sind das? → Das sind Orangen und Gurken\" (çoğulda ein/eine gelmez!) kullanılır.","formulaOrRule":"Tekil: Was ist das? → Das ist ein(e) ... · Çoğul: Was sind das? → Das sind ... · Dikkat: das Obst ve das Gemüse (nur Singular!)","summaryOfSummary":"Özetin Özeti: Meyve (das Obst) ve sebze (das Gemüse) kelimelerinin Almancada çoğulu yoktur, her zaman tekil kullanılırlar. Tek bir gıdayı sorarken \"Was ist das? → Das ist eine Orange\", birden fazla gıdayı sorarken \"Was sind das? → Das sind Orangen\" deriz ve çoğulda asla ein/eine kullanmayız."},{"heading":"B. Guten Appetit! Öğünler (Mahlzeiten) ve Ebru, Oliver, Ming Metinleri (Sayfa 58)","content":"Öğünlerden bahsederken her zaman \"zum\" edatı kullanılır: zum Frühstück (kahvaltıda / morgens), zum Mittagessen (öğle yemeğinde / mittags), zum Abendessen (akşam yemeğinde / abends). Soru kalıbı: \"Was isst / trinkst du zum Frühstück?\" → \"Ich esse zum Frühstück eine Scheibe Brot, Käse und Oliven.\" Kitap Sayfa 58’deki 3 karakter sınav sorusudur: 1) EBRU: Kahvaltıda bir dilim ekmek (eine Scheibe Brot), peynir, zeytin yer; okulda sandviç, muz veya elma yer; akşam sıcak yemek (çorba, pilavlı et, sebze, salata) yer; salata sever (mag Salat) ama pilav sevmez (mag Reis nicht). 2) OLIVER: Kahvaltı yapmaz (frühstückt nicht), sadece bir bardak süt (ein Glas Milch) ve meyve yer; kiraz ve elmayı çok sever; VEJETARYENDİR (Ich bin Vegetarier, ich mag kein Fleisch und keine Salami); akşam çorba ve peynirli ekmek yer, çok su içer. 3) MİNG: Annesi Çin’den gelir; kahvaltıda kek (Kuchen) veya susamlı çörek (Sesambrötchen) yer, müsli sever; çayı sevmez (mag Tee nicht); öğleden sonra pirinç veya erişte çorbası (Reissuppe/Nudelsuppe), akşam sebzeli et yer.","formulaOrRule":"Was isst/trinkst du zum Frühstück / Mittagessen / Abendessen? → Ich esse/trinke zum Frühstück ...","summaryOfSummary":"Özetin Özeti: Kahvaltıda (zum Frühstück), öğle yemeğinde (zum Mittagessen) ve akşam yemeğinde (zum Abendessen) derken her zaman \"zum\" edatını kullanırız. Sayfa 58’deki metinde Ebru pilav sevmez (mag Reis nicht), Oliver vejetaryendir et ve salam yemez (kein Fleisch, keine Salami), Ming ise çay sevmez (mag Tee nicht)."},{"heading":"Modalverb „mögen“ (Sevmek), „gerne / kein-“ ve „aber“ Bağlacı (Sayfa 59 & 102)","content":"Sevdiğimiz ve sevmediğimiz yiyecekleri anlatırken \"mögen\" düzensiz (modal) fiili kullanılır. Çekimi: ich mag, du magst, er/sie/es mag (1. ve 3. tekil şahıs birebir aynıdır, -t eki almaz!), wir mögen, ihr mögt, sie/Sie mögen. Olumlu ve olumsuz iki cümleyi birbirine bağlarken \"aber\" (ama/fakat) bağlacı kullanılır ve \"aber\" cümlenin kelime sırasını değiştirmez: \"Ich esse gerne Orangen, aber ich trinke keinen Orangensaft.\" veya \"Burak isst gerne Orangen, aber trinkt keinen Orangensaft.\" İsimleri olumsuz yaparken Akkusativ (belirtme) halinde \"der\" kelimeler \"keinen\" (keinen Fisch, keinen Orangensaft), \"das\" kelimeler \"kein\" (kein Fleisch, kein Gemüse), \"die\" ve çoğul kelimeler \"keine\" (keine Salami, keine Milch) alır.","formulaOrRule":"ich mag · du magst · er/sie/es mag · wir mögen · ihr mögt · sie/Sie mögen | Ich esse gerne ..., aber ich esse/trinke keinen (der) / kein (das) / keine (die)","summaryOfSummary":"Özetin Özeti: \"mögen\" (sevmek) fiilinde \"ich mag\" ve \"er/sie/es mag\" çekimleri birebir aynıdır; sonuna -t eki gelmez. Olumlu ve olumsuz iki cümleyi \"aber\" (ama) ile bağlarken, sevmediğimiz yiyeceğin artikeli der ise \"keinen\", das ise \"kein\", die ise \"keine\" yazarız."}],"keyConcepts":[{"term":"Modalverb „mögen“ (ich/er/sie/es mag)","definition":"Bir yiyecek veya içeceği sevip sevmediğimizi belirten modal fiildir: ich mag, du magst, er/sie/es mag, wir mögen, ihr mögt, sie/Sie mögen.","examTip":"Sınavda boşluk doldurmada \"ich\" ve \"er/sie/es\" öznelerinde sonuna \"-t\" gelmediğine, ikisinin de \"mag\" olduğuna özellikle dikkat et!","outcomeCode":"ALM.A1.1.5.B"},{"term":"Konjunktion „aber“ ve „kein / keine / keinen“","definition":"Zıtlık bildiren \"ama/fakat\" bağlacıdır. İlk cümlede \"gerne\" (severek) varsa, \"aber\"den sonraki cümlede \"nicht\" veya ismin artikeline göre \"keinen (der) / kein (das) / keine (die)\" kullanılır.","examTip":"Kitap Sayfa 59 ve 102’deki örnek cümle banko sınav sorusudur: \"Ich esse gerne Orangen, aber trinke keinen Orangensaft.\"","outcomeCode":"ALM.A1.1.5.B"},{"term":"das Obst & das Gemüse (Nur Singular) ve Çoğul Ekleri","definition":"Genel anlamda meyve (das Obst) ve sebze (das Gemüse) daima tekil kullanılır. Tekil gıdalar \"Das ist eine Tomate\", çoğullar ise \"Das sind Tomaten\" (ein/eine olmadan) şeklinde söylenir.","examTip":"Sayfa 57’deki 4 çoğul grubunu unutma: -e (Salate, Spinate), -(e)n (Bananen, Gurken, Kartoffeln), eksiz/Umlaut (Äpfel) ve -s (Paprikas, Brokkolis, Kiwis).","outcomeCode":"ALM.A1.1.5.A"}],"examSummary":["Meyve ve sebze kelimelerinde en büyük sınav tuzağı: \"das Obst\" (meyve) ve \"das Gemüse\" (sebze) kelimelerinin Almancada ÇOĞULU YOKTUR (nur Singular). Diğer dişil meyve/sebzelerin (die Banane, die Tomate, die Gurke, die Kartoffel, die Zwiebel, die Karotte, die Kirsche, die Orange, die Birne) tamamı çoğulda \"-(e)n\" eki alır; \"der Apfel\" ise noktalı harfe dönüşerek \"die Äpfel\" olur!","Öğün sorularında \"zum\" kelimesini ve fiil çekimini kaçırma: \"Was isst du zum Frühstück?\" (Sen kahvaltıda ne yersin? — essen fiili du’da \"isst\" olur) sorusuna \"Ich esse zum Frühstück Käse und Brot\" diye cevap verilir.","\"mögen\" fiilinde \"ich mag\" ve \"er/sie/es mag\" çekimleri aynıdır (asla \"er magt\" veya \"ich möge\" yazma!). \"aber\" (ama) bağlacı ise bir tarafı olumlu (+), diğer tarafı olumsuz (-) olan iki cümleyi bağlar: \"Ich esse gerne Orangen, aber trinke keinen Orangensaft.\""],"simpleExplanation":{"oneSentenceSummary":"Almanca 5. Ünitenin ilk yarısında meyve-sebzelerin isimlerini, kahvaltı/öğle/akşam yemeğinde ne yediğimizi ve \"seviyorum (mag) AMA (aber) şunu yemem (kein)\" demeyi en kolay şifrelerle öğreniyoruz!","dailyLifeAnalogy":"Buzdolabını açıp \"Portakal yemeyi severim (Ich esse gerne Orangen) AMA portakal suyu içmem (aber trinke keinen Orangensaft)\" demek bu konunun tam kalbidir!","stepByStepEasyPoints":[{"title":"1. Meyve ve Sebzelerde Artikeller ve Çoğul Şifresi (Sayfa 56–57)","plainExplanation":"Almancada \"die\" ile başlayan neredeyse tüm meyve ve sebzeler (die Banane, die Tomate, die Gurke, die Kartoffel, die Zwiebel, die Karotte, die Orange, die Kirsche) çoğul olurken sonuna \"-n / -en\" alır. Ama dikkat: \"das Obst\" (meyve) ve \"das Gemüse\" (sebze) kelimelerinin ÇOĞULU YOKTUR!","memoryTrick":"Dişil meyve/sebzeler çoğulda -(e)n alır · das Obst ve das Gemüse hep TEKİL kalır!"},{"title":"2. Öğünlerde \"zum\" Şifresi ve \"mögen\" (Sevmek) Fiili (Sayfa 58–59)","plainExplanation":"Kahvaltıda, öğlen veya akşam yemeğinde derken hep \"zum\" kullanılır (zum Frühstück, zum Mittagessen, zum Abendessen). Bir yiyeceği seviyorum derken kullandığımız \"mögen\" fiilinde ise \"ich\" (ben) ve \"er/sie/es\" (o) ikisi de \"mag\" olur!","memoryTrick":"ich mag = er/sie/es mag (Sonuna -t ekleme!) · du magst · wir/sie mögen · ihr mögt."},{"title":"3. \"aber\" (ama) Bağlacı ve \"kein / keine / keinen\" Kuralı (Sayfa 59 & 102)","plainExplanation":"\"Severim AMA şunu yemem/içmem\" derken ortaya \"aber\" koyarız. Yemediğimiz şeyin artikeli \"der\" ise \"keinen\" (keinen Fisch, keinen Orangensaft), \"das\" ise \"kein\" (kein Fleisch), \"die\" ise \"keine\" (keine Milch, keine Salami) yazarız.","memoryTrick":"der → keinen · das → kein · die / çoğul → keine!"}]},"jargons":[{"term":"das Lebensmittel / das Obst / das Gemüse","everydayMeaning":"Lebensmittel genel \"gıda/yiyecek\", Obst \"meyve\", Gemüse ise \"sebze\" demektir; Obst ve Gemüse kelimelerinin çoğulu yoktur (nur Singular).","realLifeExample":"Marketteki gıda reyonuna \"Lebensmittel\", meyve-sebze reyonuna \"Obst und Gemüse\" denir."},{"term":"zum Frühstück / Mittagessen / Abendessen","everydayMeaning":"Sırasıyla \"kahvaltıda, öğle yemeğinde ve akşam yemeğinde\" demektir; başındaki \"zum\" (-de/-da/için) edatı hiç değişmez.","realLifeExample":"\"Ich esse zum Frühstück Käse\" = Kahvaltıda peynir yerim."},{"term":"Modalverb „mögen“ & „gerne“","everydayMeaning":"\"mögen\" (ich mag, du magst, er mag) bir şeyi sevmek fiilidir; \"gerne\" ise bir fiilin yanına gelerek \"severek/keyifle\" anlamı katar.","realLifeExample":"\"Ich mag Äpfel\" (Elmaları severim) ile \"Ich esse gerne Äpfel\" (Severek elma yerim) aynı kapıya çıkar."},{"term":"Konjunktion „aber“ & „kein / keine / keinen“","everydayMeaning":"\"aber\" iki zıt cümleyi bağlayan \"ama/fakat\" bağlacıdır; \"kein/keine/keinen\" ise isimleri olumsuz yapan \"hiç ... değil / yok\" kelimesidir.","realLifeExample":"\"Ich esse gerne Orangen, aber ich trinke keinen Orangensaft\" (Portakal severim ama portakal suyu içmem)."}],"traps":[{"wrongThinking":"\"er/sie/es\" öznesiyle \"mögen\" fiilini çekerken sonuna -t koyup \"er magt\" veya \"er mögt\" yazmak.","correctThinking":"Modal fiillerde 1. tekil (ich) ve 3. tekil (er/sie/es) her zaman aynıdır: \"ich mag\" ve \"er/sie/es mag\" (asla -t almaz!)."},{"wrongThinking":"\"Ich trinke kein Orangensaft\" veya \"Ich esse keinen Fleisch\" diyerek kein/keinen eklerini karıştırmak.","correctThinking":"Orangensaft ve Fisch \"der\" artikelinde olduğu için Akkusativde \"keinen\" alır; Fleisch ve Gemüse \"das\" olduğu için \"kein\" alır; Milch ve Salami \"die\" olduğu için \"keine\" alır!"},{"wrongThinking":"\"das Obst\" (meyve) ve \"das Gemüse\" (sebze) kelimelerinin sonuna çoğul eki takmaya çalışmak.","correctThinking":"Sayfa 57’de vurgulandığı gibi \"das Obst\" ve \"das Gemüse\" SADECE TEKİL (nur Singular) kullanılır!"}],"flashcards":[{"id":"alm-5-1-fc-step-0","frontQuestion":"Meyve ve Sebzelerde Artikeller ve Çoğul Şifresi (Sayfa 56–57)","backAnswer":"Almancada \"die\" ile başlayan neredeyse tüm meyve ve sebzeler (die Banane, die Tomate, die Gurke, die Kartoffel, die Zwiebel, die Karotte, die Orange, die Kirsche) çoğul olurken sonuna \"-n / -en\" alır. Ama dikkat: \"das Obst\" (meyve) ve \"das Gemüse\" (sebze) kelimelerinin ÇOĞULU YOKTUR! (Şifre: Dişil meyve/sebzeler çoğulda -(e)n alır · das Obst ve das Gemüse hep TEKİL kalır!)","tag":"Hızlı Kavrama"},{"id":"alm-5-1-fc-step-1","frontQuestion":"Öğünlerde \"zum\" Şifresi ve \"mögen\" (Sevmek) Fiili (Sayfa 58–59)","backAnswer":"Kahvaltıda, öğlen veya akşam yemeğinde derken hep \"zum\" kullanılır (zum Frühstück, zum Mittagessen, zum Abendessen). Bir yiyeceği seviyorum derken kullandığımız \"mögen\" fiilinde ise \"ich\" (ben) ve \"er/sie/es\" (o) ikisi de \"mag\" olur! (Şifre: ich mag = er/sie/es mag (Sonuna -t ekleme!) · du magst · wir/sie mögen · ihr mögt.)","tag":"Hızlı Kavrama"},{"id":"alm-5-1-fc-step-2","frontQuestion":"\"aber\" (ama) Bağlacı ve \"kein / keine / keinen\" Kuralı (Sayfa 59 & 102)","backAnswer":"\"Severim AMA şunu yemem/içmem\" derken ortaya \"aber\" koyarız. Yemediğimiz şeyin artikeli \"der\" ise \"keinen\" (keinen Fisch, keinen Orangensaft), \"das\" ise \"kein\" (kein Fleisch), \"die\" ise \"keine\" (keine Milch, keine Salami) yazarız. (Şifre: der → keinen · das → kein · die / çoğul → keine!)","tag":"Hızlı Kavrama"},{"id":"alm-5-1-fc-jg-0","frontQuestion":"\"das Lebensmittel / das Obst / das Gemüse\" günlük dilde ne demektir?","backAnswer":"Lebensmittel genel \"gıda/yiyecek\", Obst \"meyve\", Gemüse ise \"sebze\" demektir; Obst ve Gemüse kelimelerinin çoğulu yoktur (nur Singular). — Örnek: Marketteki gıda reyonuna \"Lebensmittel\", meyve-sebze reyonuna \"Obst und Gemüse\" denir.","tag":"Terim Çevirici"},{"id":"alm-5-1-fc-jg-1","frontQuestion":"\"zum Frühstück / Mittagessen / Abendessen\" günlük dilde ne demektir?","backAnswer":"Sırasıyla \"kahvaltıda, öğle yemeğinde ve akşam yemeğinde\" demektir; başındaki \"zum\" (-de/-da/için) edatı hiç değişmez. — Örnek: \"Ich esse zum Frühstück Käse\" = Kahvaltıda peynir yerim.","tag":"Terim Çevirici"},{"id":"alm-5-1-fc-jg-2","frontQuestion":"\"Modalverb „mögen“ & „gerne“\" günlük dilde ne demektir?","backAnswer":"\"mögen\" (ich mag, du magst, er mag) bir şeyi sevmek fiilidir; \"gerne\" ise bir fiilin yanına gelerek \"severek/keyifle\" anlamı katar. — Örnek: \"Ich mag Äpfel\" (Elmaları severim) ile \"Ich esse gerne Äpfel\" (Severek elma yerim) aynı kapıya çıkar.","tag":"Terim Çevirici"},{"id":"alm-5-1-fc-jg-3","frontQuestion":"\"Konjunktion „aber“ & „kein / keine / keinen“\" günlük dilde ne demektir?","backAnswer":"\"aber\" iki zıt cümleyi bağlayan \"ama/fakat\" bağlacıdır; \"kein/keine/keinen\" ise isimleri olumsuz yapan \"hiç ... değil / yok\" kelimesidir. — Örnek: \"Ich esse gerne Orangen, aber ich trinke keinen Orangensaft\" (Portakal severim ama portakal suyu içmem).","tag":"Terim Çevirici"}]},{"id":"alm-5-2","subjectId":"almanca","unitTitle":"5. Ünite (Themenkreis 5): Essen und Trinken","title":"5C & Fertigkeitstraining: Einkaufen, Mengenangaben, Preise („Wie viel kostet/kosten“) ve Rezept","outcomeCode":"ALM.A1.1.5.CF","outcomeDescription":"Alışveriş diyaloglarında (Einkaufsgespräch) miktar ve ölçü birimlerini (Mengenangaben) kullanabilme, „Wie viel kostet / kosten ...?“ ile fiyat sorup Euro/Cent olarak söyleyebilme ve bir yemek tarifini (Rezept: Pfannkuchen) anlayıp yazabilme","scenarios":"Sadece 5. Ünite Sınav Kapsamı (Sayfa 60–63 & 102)","sourcePages":"Sayfa 60–63 ve Sayfa 102 (Grammatikübersicht)","lecturePoints":[{"heading":"C. Einkaufen: Fiyat Sorma („Wie viel kostet / kosten ...?“) ve Preisangaben (Sayfa 60, 62 & 102)","content":"Alışverişte bir ürünün fiyatını sorarken \"Wie viel\" (Ne kadar / Kaç para?) soru kalıbı kullanılır. Sorulan şey TEKİL ise (die Milch, ein Kilo Äpfel, eine Packung Mehl, ein Stück Butter) fiil \"kostet\" olur: \"Wie viel kostet die Milch? → Sie/Es kostet 0,95 € (fünfundneunzig Cent).\" Sorulan şey ÇOĞUL ise (die Äpfel, zwei Kilo Äpfel, 10 Eier) fiil \"kosten\" olur: \"Wie viel kosten zwei Kilo Äpfel? → Sie kosten zwei Euro und achtundneunzig Cent (2,98 €).\" Sayfa 60’taki broşür fiyatları: Eine Packung Mehl = 0,59 € (neunundfünfzig Cent), Ein Stück Butter = 1,29 € (ein Euro und neunundzwanzig Cent), 1 kg Äpfel = 1,49 € (ein Euro und neunundvierzig Cent), Ein Bund Petersilie = 0,39 € (neununddreißig Cent).","formulaOrRule":"Tekil: Wie viel kostet ...? → Es/Sie kostet ... · Çoğul: Wie viel kosten ...? → Sie kosten ... | 1,10 € = ein Euro und zehn Cent","summaryOfSummary":"Özetin Özeti: Markette fiyat sorarken ürün tekilse \"Wie viel kostet ...?\", çoğulsa \"Wie viel kosten ...?\" kalıbını kullanırız. Fiyatları okurken önce Euro sayısını, araya \"und\" koyup en son Cent sayısını söyleriz (ör. 1,49 € = ein Euro und neunundvierzig Cent)."},{"heading":"Miktar Birimleri (Mengenangaben) ve Alışveriş Diyaloğu (Sayfa 58, 60, 62)","content":"Alışveriş listesinde (Einkaufsliste) kullanılan ölçü birimleri: das Gramm (500 Gramm Käse), das Kilo (ein Kilo Äpfel / Kartoffeln), das Pfund (YARIM KİLO = 500 gram! ör. ein Pfund Kirschen / Erdbeeren), der Liter (ein Liter Milch), der Milliliter (Mililiter Milch), die Packung (eine Packung Mehl / Reis / Nudeln), das Stück (ein Stück Butter / Salat, 10 Stück Eier), der Bund (ein Bund Petersilie — bir demet maydanoz), die Tafel (eine Tafel Schokolade — bir kalıp çikolata), die Scheibe (eine Scheibe Brot — bir dilim ekmek), der Esslöffel (ein Esslöffel Zucker — bir yemek kaşığı şeker), die Prise (eine Prise Salz — bir tutam tuz). Market diyaloğu (Sayfa 60): Satıcı: \"Guten Tag! Was brauchen Sie, bitte?\" → Müşteri: \"Ich brauche ein Kilo Äpfel, 10 Stück Eier, 1 Liter Milch und eine Packung Mehl.\" → Satıcı: \"Sonst noch etwas?\" (Başka bir arzunuz var mı?) → Müşteri: \"Ja, ich möchte ein Pfund Kirschen und ein Bund Petersilie.\"","formulaOrRule":"1 Pfund = 500 Gramm (Yarım kilo) · eine Packung Mehl/Reis · ein Stück Butter · ein Bund Petersilie · eine Tafel Schokolade · eine Prise Salz","summaryOfSummary":"Özetin Özeti: Alışveriş listesinde \"1 Pfund\" yarım kilo (500 gram) demektir; un/pirinç için \"eine Packung\", tereyağı için \"ein Stück\", maydanoz için \"ein Bund\", tuz için \"eine Prise\" kullanılır. Tezgahtarın \"Was brauchen Sie, bitte?\" sorusuna \"Ich brauche ...\" veya \"Ich möchte ...\" diyerek cevap veririz."},{"heading":"Rezept (Pfannkuchen / Krep Tarifi) ve Sayfa 63 „Kochen macht Spaß!“ Diyaloğu (Sayfa 61 & 63)","content":"Bir yemek tarifi (das Rezept) iki bölümden oluşur: 1) die Zutaten (Malzemeler) ve 2) die Zubereitung (Hazırlanışı). Sayfa 61’deki Pfannkuchen (Krep) malzemeleri: Gramm Mehl (un), Milliliter Milch (süt), Eier (yumurta), Esslöffel Zucker (yemek kaşığı şeker), Gramm Butter (tereyağı), eine Prise Salz (bir tutam tuz). Tarif fiilleri: schlagen (yumurtaları çırpmak), dazugeben (üzerine eklemek), unterrühren (karıştırmak), verrühren (hamuru pürüzsüz çırpmak), hineingeben (tavaya dökmek), backen (pişirmek), wenden (krepi ters çevirmek). Sayfa 63’teki \"Kochen macht Spaß!\" metninde Julia, Anja ve Mia cumartesi saat 15.00’te Julia’nın evinde yemek yaparlar (Mia voleybol antrenmanı yüzünden 16.00’da gelir). Anja balık sevmez (mag keinen Fisch), herkes et sever; eti Anja getirir. Julia’da patates ve sebze vardır. Ayrıca kek (Kuchen) pişirirler: Julia’da şeker ve yumurta vardır ama süt ve un yoktur (keine Milch und kein Mehl); süt ve unu Mia getirir.","formulaOrRule":"Rezept = die Zutaten (Malzemeler) + die Zubereitung (Yapılışı) | Mutfak Fiilleri: schlagen · dazugeben · verrühren · hineingeben · backen · wenden","summaryOfSummary":"Özetin Özeti: Yemek tarifinde \"die Zutaten\" malzemeler, \"die Zubereitung\" ise hazırlanış demektir (schlagen: çırpmak, verrühren: karıştırmak, backen: pişirmek, wenden: çevirmek). Sayfa 63’teki diyalogda Anja balık sevmediği için et pişirirler; kek için eksik olan süt ve unu ise Mia getirir."}],"keyConcepts":[{"term":"W-Frage: „Wie viel kostet / Wie viel kosten ...?“","definition":"Fiyat sorma kalıbıdır. Tekil nesnelerle \"Wie viel kostet ...? → Es kostet ...\", çoğul nesnelerle \"Wie viel kosten ...? → Sie kosten ...\" kullanılır.","examTip":"Sayı okunuşlarında önce Euro, sonra \"und\", en son Cent söylenir: 1,49 € = ein Euro und neunundvierzig Cent.","outcomeCode":"ALM.A1.1.5.C"},{"term":"Mengenangaben (Miktar ve Ölçü Birimleri)","definition":"Gıdaların miktarını belirten ifadelerdir: das Gramm, das Kilo, das Pfund (500 g), der Liter, die Packung, das Stück, der Bund, die Tafel, die Scheibe, der Esslöffel, die Prise.","examTip":"Eşleştirme sorularında: Butter → ein Stück, Petersilie → ein Bund, Schokolade → eine Tafel, Salz → eine Prise, Mehl/Reis → eine Packung olarak eşleştir!","outcomeCode":"ALM.A1.1.5.C"},{"term":"das Rezept: die Zutaten & die Zubereitung","definition":"Yemek tarifinde kullanılan malzemeler listesine \"die Zutaten\", yemeğin pişirilme/hazırlanma aşamalarına ise \"die Zubereitung\" denir.","examTip":"Pfannkuchen tarifindeki fiil sırasını tanı: Eier schlagen (çırpmak) → Zucker/Salz dazugeben (eklemek) → Mehl/Milch verrühren (karıştırmak) → in die Pfanne hineingeben (tavaya koymak) → backen (pişirmek) → wenden (çevirmek).","outcomeCode":"ALM.A1.1.5.F"}],"examSummary":["Fiyat sorularında tek bakman gereken şey ürünün tekil mi çoğul mu olduğudur: Tekilse sonu \"-t\" ile biten \"Wie viel kostet ...?\", çoğulsa sonu \"-en\" ile biten \"Wie viel kosten ...?\" kullanılır. Örneğin \"die Milch\" veya \"ein Kilo Äpfel\" (1 kilo tek bir ağırlık birimi olduğu için) \"kostet\" alır; ama \"die Äpfel\" veya \"zwei Kilo Äpfel\" veya \"10 Eier\" \"kosten\" alır!","Ölçü birimlerinde \"1 Pfund\" kelimesinin \"yarım kilo (500 gram)\" demek olduğunu ve hangi gıdanın hangi paketle söylendiğini ezberle: eine Packung Mehl/Reis/Nudeln (paket), ein Stück Butter/Salat (kalıp/adet), ein Bund Petersilie (bir demet maydanoz), eine Tafel Schokolade (bir kalıp çikolata), eine Prise Salz (bir tutam tuz).","Sayfa 60 (Lena’nın annesinin doğum günü alışverişi) ve Sayfa 63 (Julia, Anja ve Mia’nın cumartesi yemek pişirmesi) Doğru/Yanlış (Richtig/Falsch) sorularının birebir kaynağıdır: Lena’nın kendisine değil ANNESİNE (Lenas Mutter) doğum günü partisi yapılır; Sayfa 63’te ise balığı Julia değil ANJA sevmez (Anja mag keinen Fisch)!"],"simpleExplanation":{"oneSentenceSummary":"5. Ünitenin ikinci yarısında markette fiyat sormayı (\"Wie viel kostet/kosten?\"), paket/kilo/gram gibi ölçü birimlerini ve Pfannkuchen (krep) yemek tarifini adım adım öğreniyoruz!","dailyLifeAnalogy":"Markette kasaya gidip tek bir süt için \"Bu ne kadar? (Wie viel kostet die Milch?)\" derken, bir poşet dolusu elma için \"Bunlar ne kadar? (Wie viel kosten die Äpfel?)\" dememiz gibidir.","stepByStepEasyPoints":[{"title":"1. Fiyat Sorarken Ne Zaman \"kostet\", Ne Zaman \"kosten\"? (Sayfa 60 & 102)","plainExplanation":"Fiyatını sorduğun ürün 1 taneyse veya tekilse (die Milch, ein Stück Butter, eine Packung Mehl) sonu \"-t\" ile biten \"Wie viel kostet ...?\" kullanılır. Ürün çoğulsa (die Äpfel, zwei Kilo Äpfel, 10 Eier) sonu \"-en\" ile biten \"Wie viel kosten ...?\" kullanılır.","memoryTrick":"Tekil = kostet (Es kostet ...) · Çoğul = kosten (Sie kosten ...)."},{"title":"2. Alışveriş Listesi Ölçü Birimleri (Mengenangaben — Sayfa 60 & 62)","plainExplanation":"Almanlar 500 grama (yarım kiloya) özel olarak \"1 Pfund\" der! Ayrıca un/pirinç/makarna için \"eine Packung\" (bir paket), tereyağı için \"ein Stück\" (bir kalıp), maydanoz için \"ein Bund\" (bir demet), çikolata için \"eine Tafel\" (bir kalıp), tuz için \"eine Prise\" (bir tutam) kullanılır.","memoryTrick":"1 Pfund = Yarım kilo (500 g) · Stück Butter · Bund Petersilie · Packung Mehl · Prise Salz."},{"title":"3. Krep Tarifi (Pfannkuchen Rezept) ve Sayfa 63 Yemek Diyaloğu","plainExplanation":"Tarifte \"Zutaten\" malzemeler, \"Zubereitung\" ise yapılıştır. Sayfa 63’teki okuma parçasında ise Julia, Anja ve Mia cumartesi yemek yaparlar: Anja balık sevmez (mag keinen Fisch), eti Anja getirir; kek için eksik olan süt ve unu ise Mia getirir!","memoryTrick":"Zutaten = Malzemeler · Zubereitung = Yapılışı · Balık sevmeyen = Anja · Süt ve unu getiren = Mia."}]},"jargons":[{"term":"Wie viel kostet ...? / Wie viel kosten ...?","everydayMeaning":"Bir ürünün fiyatını sorarken kullandığımız \"Kaç para / Ne kadar tutuyor?\" sorusudur (tekilde kostet, çoğulda kosten).","realLifeExample":"\"Wie viel kostet die Milch?\" (Süt ne kadar?) — \"Wie viel kosten die Äpfel?\" (Elmalar ne kadar?)."},{"term":"Mengenangaben (1 Pfund, Packung, Stück, Bund, Prise)","everydayMeaning":"Alışveriş ölçü birimleridir: 1 Pfund = 500 gram (yarım kilo), Packung = paket, Stück = adet/kalıp, Bund = demet, Prise = bir tutam.","realLifeExample":"\"eine Packung Mehl\" (bir paket un), \"ein Stück Butter\" (bir kalıp tereyağı), \"ein Bund Petersilie\" (bir demet maydanoz)."},{"term":"das Rezept: die Zutaten & die Zubereitung","everydayMeaning":"Rezept yemek tarifi demektir; içindeki malzeme listesine \"die Zutaten\", pişirme adımlarına ise \"die Zubereitung\" adı verilir.","realLifeExample":"Pfannkuchen (krep) yaparken un, süt ve yumurta \"Zutaten\"; bunları çırpıp (schlagen/verrühren) tavada pişirmek (backen) \"Zubereitung\"dur."}],"traps":[{"wrongThinking":"Çoğul bir ürünün fiyatını sorarken \"Wie viel kostet die Äpfel / zwei Kilo Äpfel?\" demek.","correctThinking":"Sorulan ürün çoğulsa fiil mutlaka \"-en\" alır: \"Wie viel kosten die Äpfel / zwei Kilo Äpfel? → Sie kosten ...\""},{"wrongThinking":"Sayfa 60’taki metinde Lena’nın kendi doğum günü olduğunu, Sayfa 63’te ise Julia’nın balık sevmediğini sanmak.","correctThinking":"Sayfa 60’ta doğum günü olan Lena’nın ANNESİDİR (Lenas Mutter hat am Samstag Geburtstag); Sayfa 63’te ise balık sevmeyen ANJA’dır (Anja: Ich mag keinen Fisch)!"}],"flashcards":[{"id":"alm-5-2-fc-step-0","frontQuestion":"Fiyat Sorarken Ne Zaman \"kostet\", Ne Zaman \"kosten\"? (Sayfa 60 & 102)","backAnswer":"Fiyatını sorduğun ürün 1 taneyse veya tekilse (die Milch, ein Stück Butter, eine Packung Mehl) sonu \"-t\" ile biten \"Wie viel kostet ...?\" kullanılır. Ürün çoğulsa (die Äpfel, zwei Kilo Äpfel, 10 Eier) sonu \"-en\" ile biten \"Wie viel kosten ...?\" kullanılır. (Şifre: Tekil = kostet (Es kostet ...) · Çoğul = kosten (Sie kosten ...).)","tag":"Hızlı Kavrama"},{"id":"alm-5-2-fc-step-1","frontQuestion":"Alışveriş Listesi Ölçü Birimleri (Mengenangaben — Sayfa 60 & 62)","backAnswer":"Almanlar 500 grama (yarım kiloya) özel olarak \"1 Pfund\" der! Ayrıca un/pirinç/makarna için \"eine Packung\" (bir paket), tereyağı için \"ein Stück\" (bir kalıp), maydanoz için \"ein Bund\" (bir demet), çikolata için \"eine Tafel\" (bir kalıp), tuz için \"eine Prise\" (bir tutam) kullanılır. (Şifre: 1 Pfund = Yarım kilo (500 g) · Stück Butter · Bund Petersilie · Packung Mehl · Prise Salz.)","tag":"Hızlı Kavrama"},{"id":"alm-5-2-fc-step-2","frontQuestion":"Krep Tarifi (Pfannkuchen Rezept) ve Sayfa 63 Yemek Diyaloğu","backAnswer":"Tarifte \"Zutaten\" malzemeler, \"Zubereitung\" ise yapılıştır. Sayfa 63’teki okuma parçasında ise Julia, Anja ve Mia cumartesi yemek yaparlar: Anja balık sevmez (mag keinen Fisch), eti Anja getirir; kek için eksik olan süt ve unu ise Mia getirir! (Şifre: Zutaten = Malzemeler · Zubereitung = Yapılışı · Balık sevmeyen = Anja · Süt ve unu getiren = Mia.)","tag":"Hızlı Kavrama"},{"id":"alm-5-2-fc-jg-0","frontQuestion":"\"Wie viel kostet ...? / Wie viel kosten ...?\" günlük dilde ne demektir?","backAnswer":"Bir ürünün fiyatını sorarken kullandığımız \"Kaç para / Ne kadar tutuyor?\" sorusudur (tekilde kostet, çoğulda kosten). — Örnek: \"Wie viel kostet die Milch?\" (Süt ne kadar?) — \"Wie viel kosten die Äpfel?\" (Elmalar ne kadar?).","tag":"Terim Çevirici"},{"id":"alm-5-2-fc-jg-1","frontQuestion":"\"Mengenangaben (1 Pfund, Packung, Stück, Bund, Prise)\" günlük dilde ne demektir?","backAnswer":"Alışveriş ölçü birimleridir: 1 Pfund = 500 gram (yarım kilo), Packung = paket, Stück = adet/kalıp, Bund = demet, Prise = bir tutam. — Örnek: \"eine Packung Mehl\" (bir paket un), \"ein Stück Butter\" (bir kalıp tereyağı), \"ein Bund Petersilie\" (bir demet maydanoz).","tag":"Terim Çevirici"},{"id":"alm-5-2-fc-jg-2","frontQuestion":"\"das Rezept: die Zutaten & die Zubereitung\" günlük dilde ne demektir?","backAnswer":"Rezept yemek tarifi demektir; içindeki malzeme listesine \"die Zutaten\", pişirme adımlarına ise \"die Zubereitung\" adı verilir. — Örnek: Pfannkuchen (krep) yaparken un, süt ve yumurta \"Zutaten\"; bunları çırpıp (schlagen/verrühren) tavada pişirmek (backen) \"Zubereitung\"dur.","tag":"Terim Çevirici"}]}],"questions":[{"id":"q-mat-1","subjectId":"matematik","topicId":"mat-10-1-1","outcomeCode":"MAT.10.1.1","scenarios":"Senaryo 1, 2, 3, 4, 5","difficulty":1,"type":"multiple_choice","questionText":"Bir ABC dik üçgeninde m(B) = 90° ve dar açı A olmak üzere sin(A) = 3/5 ise, tan(A) + cot(C) toplamının değeri kaçtır?","options":["3/2","6/5","8/5","4/3"],"correctAnswer":"3/2","explanation":"3-4-5 dik üçgeninde sin(A) = 3/5 olduğundan A açısının karşısı 3k, komşusu 4k, hipotenüs 5k’dir. Buradan tan(A) = 3/4 olur. A + C = 90° (tümler açılar) olduğu için cot(C) = tan(A) = 3/4’tür. O hâlde tan(A) + cot(C) = 3/4 + 3/4 = 6/4 = 3/2 bulunur.","weaknessTag":"Dik Üçgende Tümler Açı Oranları (MAT.10.1.1)","studyRecommendation":"Matematik Ders Kitabı Sayfa 22–28’deki dik üçgende tümler açıların (A + C = 90° ⇒ tanA = cotC) oranları tablosunu tekrar edin.","sourceCitation":"MEB 10. Sınıf Matematik Ders Kitabı · Sayfa 24 · Öğrenme Çıktısı 10.1.1","sourcePdfId":"pdf-mat-dk"},{"id":"q-mat-2","subjectId":"matematik","topicId":"mat-10-1-1","outcomeCode":"MAT.10.1.1","scenarios":"Senaryo 1–5","difficulty":2,"type":"fill_blank","questionText":"Dar açılı bir x açısı için sin²(x) + cos²(x) ifadesinin en sade sayısal değeri ________ sayısıdır.","correctAnswer":"1","acceptableAnswers":["1","bir"],"explanation":"Pisagor teoreminden (a² + b² = c²) her iki taraf hipotenüsün karesine bölündüğünde (a/c)² + (b/c)² = 1 yani sin²(x) + cos²(x) = 1 temel trigonometrik özdeşliği elde edilir.","weaknessTag":"Temel Trigonometrik Özdeşlikler (MAT.10.1.1)","studyRecommendation":"Matematik Ders Kitabı Sayfa 31’deki sin²x + cos²x = 1 özdeşliğinin geometrik çıkarımını inceleyin.","sourceCitation":"MEB 10. Sınıf Matematik Ders Kitabı · Sayfa 31 · Öğrenme Çıktısı 10.1.1","sourcePdfId":"pdf-mat-dk"},{"id":"q-mat-3","subjectId":"matematik","topicId":"mat-10-1-2","outcomeCode":"MAT.10.1.4","scenarios":"Senaryo 1–5","difficulty":3,"type":"multiple_choice","questionText":"Bir ABC üçgeninde |AB| = 5 cm, |AC| = 8 cm ve m(BAC) = 60° olduğuna göre |BC| = a kenarının uzunluğu kaç cm’dir?","options":["6","7","9","√89"],"correctAnswer":"7","explanation":"İki kenar ve aradaki açı bilindiğinden Kosinüs Teoremi uygulanır: a² = b² + c² - 2·b·c·cos(60°). Burada cos(60°) = 1/2 olduğundan a² = 8² + 5² - 2·8·5·(1/2) = 64 + 25 - 40 = 49 bulunur. Buradan a = 7 cm elde edilir.","weaknessTag":"Kosinüs Teoremi Uygulaması (MAT.10.1.4)","studyRecommendation":"Matematik Ders Kitabı Sayfa 74–82’deki Kosinüs Teoremi ispatı ve 60°/120° özel açı uygulamalarını çözün.","sourceCitation":"MEB 10. Sınıf Matematik Ders Kitabı · Sayfa 76 · Öğrenme Çıktısı 10.1.4","sourcePdfId":"pdf-mat-dk"},{"id":"q-mat-4","subjectId":"matematik","topicId":"mat-10-2-1","outcomeCode":"MAT.10.2.1","scenarios":"Senaryo 1, 2 ve 3","difficulty":2,"type":"true_false","questionText":"İki kategorik değişkenli bir çapraz tabloda, satır koşullu göreli sıklıkları tüm kategorilerde birbirine eşit çıkıyorsa bu iki değişken arasında güçlü bir ilişki vardır.","correctAnswer":"Yanlış","explanation":"Satır (veya sütun) koşullu göreli sıklıklarının tüm gruplarda birbirine eşit veya çok yakın çıkması, bir değişkenin diğerine göre değişmediğini yani iki kategorik değişkenin birbirinden BAĞIMSIZ (ilişkisiz) olduğunu gösterir.","weaknessTag":"İki Kategorik Değişkende İlişkililik Kararı (MAT.10.2.1)","studyRecommendation":"Matematik Ders Kitabı Sayfa 98–112’deki koşullu göreli sıklık hesaplama ve ilişkililik yorumlama örneklerini tekrar edin.","sourceCitation":"MEB 10. Sınıf Matematik Ders Kitabı · Sayfa 104 · Öğrenme Çıktısı 10.2.1","sourcePdfId":"pdf-mat-dk"},{"id":"q-fiz-1","subjectId":"fizik","topicId":"fiz-10-1-1","outcomeCode":"FİZ.10.1.3","scenarios":"Senaryo 1, 3 ve 4","difficulty":2,"type":"multiple_choice","questionText":"Yatay ve doğrusal bir yolda başlangıçta durgun (v₀ = 0) olan bir araç, 4 m/s² sabit ivme ile 5 saniye boyunca düzgün hızlanıyor. Bu aracın 5 saniye sonunda yaptığı yer değiştirme kaç metredir?","options":["20 m","40 m","50 m","100 m"],"correctAnswer":"50 m","explanation":"İlk hızı sıfır olan aracın 5. saniyedeki hızı v = a·t = 4 · 5 = 20 m/s olur. Hız-zaman (v-t) grafiğinin altındaki üçgen alanı yer değiştirmeyi verir: Δx = (20 · 5) / 2 = 50 metre (veya Δx = 1/2·a·t² = 1/2 · 4 · 25 = 50 m).","weaknessTag":"Sabit İvmeli Hareket Grafik Alanı ve Modeli (FİZ.10.1.3)","studyRecommendation":"Fizik Ders Kitabı Sayfa 54–72 ve Fizik Çalışma Kitabı (CK) içindeki v-t grafiğinden yer değiştirme hesaplama etkinliklerini çözün.","sourceCitation":"MEB 10. Sınıf Fizik Ders Kitabı · Sayfa 62 · Öğrenme Çıktısı FİZ.10.1.3","sourcePdfId":"pdf-fiz-dk"},{"id":"q-fiz-2","subjectId":"fizik","topicId":"fiz-10-1-1","outcomeCode":"FİZ.10.1.2","scenarios":"Senaryo 1–4","difficulty":1,"type":"fill_blank","questionText":"Hız-zaman (v-t) grafiğinin eğimi hareketlinin ________ büyüklüğünü verir.","correctAnswer":"ivme","acceptableAnswers":["ivme","ivmesini"],"explanation":"Hız-zaman grafiğinde dikey eksen hız değişimini (Δv), yatay eksen geçen süreyi (Δt) gösterir. Eğim = Δv / Δt olduğundan doğrudan cismin ivmesini (a) verir.","weaknessTag":"İvme ve Hız Değişimi İlişkisi (FİZ.10.1.2)","studyRecommendation":"Fizik Ders Kitabı Sayfa 42–50’deki ivme tanımı ve v-t grafiği eğim çıkarımlarını gözden geçirin.","sourceCitation":"MEB 10. Sınıf Fizik Ders Kitabı · Sayfa 45 · Öğrenme Çıktısı FİZ.10.1.2","sourcePdfId":"pdf-fiz-dk"},{"id":"q-fiz-3","subjectId":"fizik","topicId":"fiz-10-1-1","outcomeCode":"FİZ.10.1.1","scenarios":"Senaryo 1–4","difficulty":2,"type":"true_false","questionText":"Yatay doğrultuda sabit hızlı hareket yapan bir cismin ivmesi sıfırdır ve eşit zaman aralıklarında yaptığı yer değiştirmeler birbirine eşittir.","correctAnswer":"Doğru","explanation":"Sabit hızlı harekette hız değişimi (Δv = 0) olmadığından ivme sıfırdır (a = 0) ve cisim her birim zamanda eşit miktarda yer değiştirir (Δx = v·Δt).","weaknessTag":"Sabit Hızlı Hareket İlkeleri (FİZ.10.1.1)","studyRecommendation":"Fizik Ders Kitabı Sayfa 20–36’daki sabit hızlı hareket tablolarını inceleyin.","sourceCitation":"MEB 10. Sınıf Fizik Ders Kitabı · Sayfa 26 · Öğrenme Çıktısı FİZ.10.1.1","sourcePdfId":"pdf-fiz-dk"},{"id":"q-kim-1","subjectId":"kimya","topicId":"kim-10-1-1","outcomeCode":"KİM.10.1.3","scenarios":"Tüm Senaryolar (Senaryo 1–6)","difficulty":2,"type":"multiple_choice","questionText":"Pb(NO₃)₂(suda) + 2KI(suda) → PbI₂(k) + 2KNO₃(suda) tepkimesi ile ilgili aşağıdaki ifadelerden hangisi doğrudur?","options":["Sentez tepkimesidir ve tüm iyonlar çöker.","Çözünme-çökelme tepkimesidir; net iyon denklemi Pb²⁺(suda) + 2I⁻(suda) → PbI₂(k) şeklindedir.","Asit-baz nötralleşme tepkimesidir.","Seyirci iyonlar Pb²⁺ ve I⁻ iyonlarıdır."],"correctAnswer":"Çözünme-çökelme tepkimesidir; net iyon denklemi Pb²⁺(suda) + 2I⁻(suda) → PbI₂(k) şeklindedir.","explanation":"İki sulu çözelti karıştırıldığında suda az çözünen sarı renkli PbI₂(k) katısı (çökeleği) oluştuğu için bu bir çözünme-çökelme tepkimesidir. Net iyon denklemi çöken katıyı oluşturan Pb²⁺ ve I⁻ iyonları arasında yazılır; K⁺ ve NO₃⁻ ise seyirci iyonlardır.","weaknessTag":"Çözünme-Çökelme ve Net İyon Denklemi (KİM.10.1.3)","studyRecommendation":"Kimya Ders Kitabı Sayfa 42–55 ve Kimya Çalışma Kitabı (CK) içindeki tepkime türleri ve seyirci iyon belirleme etkinliklerini çalışın.","sourceCitation":"MEB 10. Sınıf Kimya Ders Kitabı · Sayfa 48 · Öğrenme Çıktısı KİM.10.1.3","sourcePdfId":"pdf-kim-dk"},{"id":"q-kim-2","subjectId":"kimya","topicId":"kim-10-1-4","outcomeCode":"KİM.10.1.4","scenarios":"Tüm Senaryolar (Senaryo 1–6)","difficulty":3,"type":"multiple_choice","questionText":"Normal Koşullarda (NŞA) 11,2 litre hacim kaplayan SO₃ gazı kaç gramdır ve toplam kaç mol atom içerir? (S: 32 g/mol, O: 16 g/mol)","options":["40 gram SO₃ ve toplam 2 mol atom","80 gram SO₃ ve toplam 4 mol atom","40 gram SO₃ ve toplam 0,5 mol atom","64 gram SO₃ ve toplam 2 mol atom"],"correctAnswer":"40 gram SO₃ ve toplam 2 mol atom","explanation":"NŞA’da 1 mol gaz 22,4 L hacim kaplar. n = 11,2 / 22,4 = 0,5 mol SO₃ gazı vardır. SO₃’ün mol kütlesi M_A = 32 + 3·16 = 80 g/mol’dür. Kütle m = 0,5 · 80 = 40 gramdır. 1 mol SO₃’te 4 mol atom (1S + 3O) bulunduğundan, 0,5 mol SO₃’te 0,5 · 4 = 2 mol atom bulunur.","weaknessTag":"Mol-Kütle-Hacim-Atom Sayısı Geçişleri (KİM.10.1.4 & 10.1.5)","studyRecommendation":"Kimya Ders Kitabı Sayfa 64–88’deki mol kavramı ve NŞA gaz hacmi bağıntılarını tekrar edin.","sourceCitation":"MEB 10. Sınıf Kimya Ders Kitabı · Sayfa 72 · Öğrenme Çıktısı KİM.10.1.4","sourcePdfId":"pdf-kim-dk"},{"id":"q-kim-3","subjectId":"kimya","topicId":"kim-10-1-1","outcomeCode":"KİM.10.1.2","scenarios":"Senaryo 1, 3, 4, 5, 6","difficulty":1,"type":"true_false","questionText":"Bir kimyasal tepkimede atomların türü ve sayısı her zaman korunurken, toplam molekül sayısı ve toplam gaz hacmi değişebilir.","correctAnswer":"Doğru","explanation":"Kimyasal tepkimelerde atom türü, atom sayısı, toplam kütle ve toplam yük daima korunur; ancak molekül sayısı, mol sayısı ve hacim korunmayabilir (örneğin N₂ + 3H₂ → 2NH₃ tepkimesinde 4 molekülden 2 molekül oluşur).","weaknessTag":"Kimyasal Tepkimelerde Korunan Özellikler (KİM.10.1.2)","studyRecommendation":"Kimya Ders Kitabı Sayfa 28–38’deki tanecik modelleri ve korunan büyüklükler tablosunu inceleyin.","sourceCitation":"MEB 10. Sınıf Kimya Ders Kitabı · Sayfa 33 · Öğrenme Çıktısı KİM.10.1.2","sourcePdfId":"pdf-kim-dk"},{"id":"q-biy-1","subjectId":"biyoloji","topicId":"biy-10-1-1","outcomeCode":"BİY.10.1.3","scenarios":"Senaryo 1–4","difficulty":2,"type":"multiple_choice","questionText":"Özdeş su bitkileri (Elodea) kullanılarak hazırlanan bir fotosentez deney düzeneğinde birim zamanda çıkan oksijen (O₂) kabarcık sayısını artırmak için aşağıdakilerden hangisi yapılmalıdır?","options":["Düzeneğe yeşil renkli ışık kaynağı tutmak","Suyun içine CO₂ tutucu olan KOH (potasyum hidroksit) eklemek","Işık kaynağını bitkiye yaklaştırmak ve ortama maden suyu (karbondioksit kaynağı) eklemek","Ortam sıcaklığını 55 °C’ye çıkarmak"],"correctAnswer":"Işık kaynağını bitkiye yaklaştırmak ve ortama maden suyu (karbondioksit kaynağı) eklemek","explanation":"Işık kaynağını yaklaştırmak ışık şiddetini artırır, maden suyu ise suda çözünmüş CO₂ miktarını artırarak fotosentez hızını ve birim zamanda çıkan O₂ kabarcık sayısını yükseltir. Yeşil ışıkta fotosentez en düşüktür, KOH CO₂’yi bağlayarak fotosentezi durdurur, 55 °C ise enzimleri denatüre eder.","weaknessTag":"Fotosentez Deneyleri ve Çevresel Faktörler (BİY.10.1.3)","studyRecommendation":"Biyoloji Ders Kitabı Sayfa 44–68 ve Biyoloji Çalışma Kitabı (CK) içindeki Elodea fotosentez hızı deney sorularını inceleyin.","sourceCitation":"MEB 10. Sınıf Biyoloji Ders Kitabı · Sayfa 58 · Öğrenme Çıktısı BİY.10.1.3","sourcePdfId":"pdf-biy-dk"},{"id":"q-biy-2","subjectId":"biyoloji","topicId":"biy-10-1-1","outcomeCode":"BİY.10.1.5","scenarios":"Senaryo 1, 2 ve 3","difficulty":2,"type":"true_false","questionText":"Nişastanın sindirim enzimleri yardımıyla glikoza kadar parçalandığı hidroliz (kimyasal sindirim) tepkimeleri sırasında hücre bol miktarda ATP harcar.","correctAnswer":"Yanlış","explanation":"Hidroliz (kimyasal sindirim) tepkimelerinde su ve sindirim enzimleri kullanılır, ancak kesinlikle ATP enerjisi HARCANMAZ ve ATP üretilmez. Bu nedenle sindirim hem hücre içinde hem de hücre dışında (deney tüpünde veya sindirim boşluğunda) gerçekleşebilir.","weaknessTag":"Sindirimde ATP ve Enzim Rolü (BİY.10.1.1 & 10.1.5)","studyRecommendation":"Biyoloji Ders Kitabı Sayfa 22 ve Sayfa 74’teki ATP tüketilmeyen olaylar (hidroliz, difüzyon, ozmoz) ile hücre içi/dışı sindirim karşılaştırmasını tekrar edin.","sourceCitation":"MEB 10. Sınıf Biyoloji Ders Kitabı · Sayfa 76 · Öğrenme Çıktısı BİY.10.1.5","sourcePdfId":"pdf-biy-dk"},{"id":"q-tar-1","subjectId":"tarih","topicId":"tar-10-1-1","outcomeCode":"TAR.10.1.1","scenarios":"Tüm Senaryolar (Senaryo 1–6)","difficulty":2,"type":"multiple_choice","questionText":"1040–1299 yılları arasında Türk tarihinin seyrini değiştiren askerî mücadeleler eşleştirildiğinde, Anadolu’nun kapılarını Türklere açan \"Yurt Açan\" savaş ile Bizans’ın Anadolu’yu geri alma ümidini tamamen bitiren \"Yurt Tutan\" savaş sırasıyla hangileridir?","options":["Pasinler (1048) — Dandanakan (1040)","Malazgirt (1071) — Miryokefalon (1176)","Dandanakan (1040) — Kösedağ (1243)","Miryokefalon (1176) — Yassıçemen (1230)"],"correctAnswer":"Malazgirt (1071) — Miryokefalon (1176)","explanation":"26 Ağustos 1071 Malazgirt Zaferi ile Anadolu’nun kapıları Türklere açılmış (Yurt Açan); 1176 Miryokefalon Savaşı’nda II. Kılıç Arslan’ın Bizans’ı mağlup etmesiyle Anadolu’nun kesin olarak Türk yurdu olduğu tescillenmiştir (Yurt Tutan).","weaknessTag":"1040-1299 Askerî Mücadelelerin Etkileri (TAR.10.1.1)","studyRecommendation":"Tarih Ders Kitabı Sayfa 20–44’teki Dandanakan, Pasinler, Malazgirt, Miryokefalon ve Kösedağ savaşları karşılaştırma tablosunu inceleyin.","sourceCitation":"MEB 10. Sınıf Tarih Ders Kitabı · Sayfa 34 · Öğrenme Çıktısı TAR.10.1.1","sourcePdfId":"pdf-tar-dk"},{"id":"q-tar-2","subjectId":"tarih","topicId":"tar-10-1-1","outcomeCode":"TAR.10.1.2","scenarios":"Tüm Senaryolar (Senaryo 1–6)","difficulty":2,"type":"fill_blank","questionText":"Büyük Selçuklu ve Türkiye Selçuklu devletlerinde devlete ait toprakların vergi gelirlerinin askerî veya sivil görevlilere hizmet karşılığı tahsis edildiği ve karşılığında atlı asker (sipahi) yetiştirilen sisteme ________ sistemi denir.","correctAnswer":"ikta","acceptableAnswers":["ikta","ıkta","ikta sistemi"],"explanation":"İkta sistemi sayesinde devlet hazinesinden nakit para çıkmadan büyük bir eyalet ordusu beslenmiş, tarımsal üretimin sürekliliği ve taşra güvenliği sağlanmıştır.","weaknessTag":"Selçuklu Devlet ve Ordu Teşkilatı (TAR.10.1.2)","studyRecommendation":"Tarih Ders Kitabı Sayfa 48–64’teki İkta ve Gulam sistemlerinin ordu ve devlet teşkilatındaki rolünü tekrar edin.","sourceCitation":"MEB 10. Sınıf Tarih Ders Kitabı · Sayfa 56 · Öğrenme Çıktısı TAR.10.1.2","sourcePdfId":"pdf-tar-dk"},{"id":"q-cog-1","subjectId":"cografya","topicId":"cog-10-1-1","outcomeCode":"COĞ.10.2.2","scenarios":"Senaryo 1–6","difficulty":2,"type":"multiple_choice","questionText":"Coğrafi Bilgi Sistemleri (CBS) kullanılarak bir ilin taşkın risk haritası oluşturulurken; akarsu yatakları, baraj gölleri ve meteoroloji istasyonları altlık haritaya sırasıyla hangi vektörel veri tipleriyle aktarılır?","options":["Çizgi — Alan (Poligon) — Nokta","Nokta — Çizgi — Alan (Poligon)","Alan (Poligon) — Çizgi — Nokta","Çizgi — Nokta — Alan (Poligon)"],"correctAnswer":"Çizgi — Alan (Poligon) — Nokta","explanation":"CBS’de uzunluk özelliği gösteren akarsu, yol ve fay hatları \"Çizgi\"; kapladığı yüzölçümü olan göl, orman ve il sınırları \"Alan (Poligon)\"; tek bir koordinat belirten kuyu, tepe ve istasyonlar ise \"Nokta\" veri katmanıyla haritaya aktarılır.","weaknessTag":"Mekânsal Verilerin Haritaya Aktarılması ve CBS (COĞ.10.2.2)","studyRecommendation":"Coğrafya Ders Kitabı Sayfa 38–54’teki CBS katman yapısı ve nokta-çizgi-alan veri örneklerini inceleyin.","sourceCitation":"MEB 10. Sınıf Coğrafya Ders Kitabı · Sayfa 46 · Öğrenme Çıktısı COĞ.10.2.2","sourcePdfId":"pdf-cog-dk"},{"id":"q-cog-2","subjectId":"cografya","topicId":"cog-10-1-1","outcomeCode":"COĞ.10.3.3","scenarios":"Senaryo 1, 3 ve 6","difficulty":3,"type":"multiple_choice","questionText":"Aşağıdaki yeryüzü şekillerinden hangisinin oluşumunda hem akarsu aşınım hem de akarsu birikim süreçleri birlikte etkili olmuştur?","options":["Dev kazanı ve Kırgıbayır","Menderes ve Seki (Taraça)","Delta ovası ve Birikinti konisi","Çentik vadi ve Peri bacası"],"correctAnswer":"Menderes ve Seki (Taraça)","explanation":"Mendereslerde (büklümlerde) dış bükey kıyıda aşındırma (çarpanak), iç bükey kıyıda biriktirme (yığınak) aynı anda gerçekleşir. Seki (taraça) ise akarsuyun önce biriktirdiği alüvyal tabanı, epirojenezle yükselme sonucu yeniden aşındırmasıyla oluşur.","weaknessTag":"Aşınım ve Birikim Yeryüzü Şekilleri (COĞ.10.3.3)","studyRecommendation":"Coğrafya Ders Kitabı Sayfa 86–108’deki akarsu aşınım, birikim ve karma şekiller tablosunu tekrar edin.","sourceCitation":"MEB 10. Sınıf Coğrafya Ders Kitabı · Sayfa 94 · Öğrenme Çıktısı COĞ.10.3.3","sourcePdfId":"pdf-cog-dk"},{"id":"q-fel-1","subjectId":"felsefe","topicId":"fel-10-1-1","outcomeCode":"FEL.10.2.2","scenarios":"Senaryo 1, 2, 3 ve 4","difficulty":2,"type":"multiple_choice","questionText":"\"Her demokratik toplumda ifade özgürlüğü korunur. Türkiye demokratik bir toplumdur. O hâlde Türkiye’de ifade özgürlüğü korunur.\" argümanı ve mantığın temel kavramları ile ilgili aşağıdakilerden hangisi yanlıştır?","options":["\"O hâlde\" ifadesinden sonraki cümle argümanın sonuç önermesidir.","İlk iki cümle sonucu destekleyen öncül önermelerdir.","Tümdengelimsel ve geçerli bir çıkarım örneğidir.","\"İfade özgürlüğünü koruyunuz!\" cümlesi de bu argümana üçüncü bir önerme olarak eklenebilir."],"correctAnswer":"\"İfade özgürlüğünü koruyunuz!\" cümlesi de bu argümana üçüncü bir önerme olarak eklenebilir.","explanation":"\"İfade özgürlüğünü koruyunuz!\" bir emir cümlesidir. Emir, istek, soru ve ünlem cümleleri doğru ya da yanlış bir yargı bildirmediği (doğruluk değeri taşımadığı) için mantıkta ÖNERME olamaz ve argümanda öncül/sonuç olarak kullanılamaz.","weaknessTag":"Önerme ve Argümantasyon Yapısı (FEL.10.2.2)","studyRecommendation":"Felsefe 2. Ünite özetindeki önerme olan/olmayan cümleler ile öncül-sonuç belirteçlerini tekrar edin.","sourceCitation":"MEB 10. Sınıf Felsefe Müfredatı · 2. Ünite · Öğrenme Çıktısı FEL.10.2.2","sourcePdfId":"pdf-tar-dk"},{"id":"q-fel-2","subjectId":"felsefe","topicId":"fel-10-1-1","outcomeCode":"FEL.10.1.1","scenarios":"Senaryo 1–5","difficulty":1,"type":"fill_blank","questionText":"Felsefi düşüncenin var olan bilgileri hazır kabul etmeyip düşüncenin kendi üzerine yönelmesine ve kendini yeniden sorgulamasına ________ olma özelliği denir.","correctAnswer":"refleksif","acceptableAnswers":["refleksif","refleksiflik","dönüşlü"],"explanation":"Refleksiflik (dönüşlü düşünme), zihnin ürettiği bilgi veya düşünceyi tekrar düşünme konusu yapması, yani \"düşünme üzerine düşünme\" faaliyetidir.","weaknessTag":"Felsefi Düşüncenin Özellikleri (FEL.10.1.1)","studyRecommendation":"Felsefe 1. Ünite kilit kavramlarındaki refleksif, kümülatif ve rasyonel olma tanımlarını gözden geçirin.","sourceCitation":"MEB 10. Sınıf Felsefe Müfredatı · 1. Ünite · Öğrenme Çıktısı FEL.10.1.1","sourcePdfId":"pdf-tar-dk"},{"id":"q-dkab-1","subjectId":"dkab","topicId":"dkab-10-1-1","outcomeCode":"DKAB.10.2.1","scenarios":"Senaryo 1, 2 ve 3","difficulty":2,"type":"multiple_choice","questionText":"Dünya’nın Güneş’e olan uzaklığı, atmosfer katmanlarının kalınlığı ve canlılar arasındaki ekolojik dengenin tesadüfen oluşamayacak kadar hassas bir ölçüye sahip olmasından hareketle Allah’ın (cc) varlığını ve birliğini kanıtlayan delil aşağıdakilerden hangisidir?","options":["Gaye ve Nizam Delili","Hudûs Delili","İmkân Delili","Kabul-i Âmme Delili"],"correctAnswer":"Gaye ve Nizam Delili","explanation":"Evrendeki kusursuz düzen, uyum, ölçü ve amaçlılıktan hareketle üstün bir Yaratıcı’nın varlığını ispatlayan delil \"Gaye ve Nizam Delili\"dir. Hudûs delili sonradan yaratılmışlıktan, İmkân delili ise zorunlu-mümkün varlık ayrımından hareket eder.","weaknessTag":"Allah’ın Varlığının Delilleri (DKAB.10.2.1)","studyRecommendation":"DKAB Ders Kitabı içindeki Gaye ve Nizam, Hudûs ve İmkân delillerinin ayetlerle eşleştirilmesini tekrar edin.","sourceCitation":"MEB Din Kültürü ve Ahlak Bilgisi Ders Kitabı · Sayfa 52 · Öğrenme Çıktısı DKAB.10.2.1","sourcePdfId":"pdf-dkab-dk"},{"id":"q-dkab-2","subjectId":"dkab","topicId":"dkab-10-1-1","outcomeCode":"DKAB.10.1.1","scenarios":"Senaryo 1–4","difficulty":1,"type":"true_false","questionText":"İslam düşüncesinde rüya, ilham ve keşif herkesi bağlayıcı, nesnel ve kesin bilgi kaynakları arasında yer alır.","correctAnswer":"Yanlış","explanation":"İslam’da herkesi bağlayıcı 3 temel bilgi kaynağı Selim Akıl, Sadık Haber (Vahiy ve Mütevatir haber) ve Salim Duyulardır. Rüya, ilham ve sezgi kişiye özel (öznel) olduğu için dini hükümlerde bağlayıcı delil olamaz.","weaknessTag":"İslam’da Bilginin Kaynakları (DKAB.10.1.1)","studyRecommendation":"DKAB Ders Kitabı Sayfa 16–28’deki İslam’da bilgi kaynakları şemasını ve İsra Suresi 36. ayet mesajını inceleyin.","sourceCitation":"MEB Din Kültürü ve Ahlak Bilgisi Ders Kitabı · Sayfa 20 · Öğrenme Çıktısı DKAB.10.1.1","sourcePdfId":"pdf-dkab-dk"},{"id":"q-tde-1","subjectId":"edebiyat","topicId":"tde-10-1-1","outcomeCode":"TDE.10.1-2","scenarios":"Ülke Geneli Ortak Yazılı Sınav","difficulty":2,"type":"multiple_choice","questionText":"İslamiyet öncesi Türk edebiyatında sığır ve şölen törenlerinde kopuz eşliğinde söylenen \"Koşuk\" nazım biçiminin, Halk edebiyatındaki (Âşık tarzı) ve Divan edebiyatındaki konu/işlev bakımından karşılıkları sırasıyla hangisinde doğru verilmiştir?","options":["Koşma — Gazel","Semai — Kaside","Destan — Mesnevi","Türkü — Şarkı"],"correctAnswer":"Koşma — Gazel","explanation":"Doğa, aşk ve yiğitlik konularını işleyen İslamiyet öncesi \"Koşuk\", İslamiyet etkisindeki Âşık edebiyatında \"Koşma\", Divan edebiyatında ise \"Gazel\" nazım biçimine karşılık gelir.","weaknessTag":"Koşuk, Koşma ve Gazel Karşılaştırması (TDE.10.1-2)","studyRecommendation":"1. Tema Sözün Ezgisi ve 2. Tema Kelimelerin Ritmi özet tablosundan nazım birimi, ölçü ve dönem karşılaştırmalarını tekrar edin.","sourceCitation":"MEB 10. Sınıf Türk Dili ve Edebiyatı Ortak Sınav Konuları · 1. ve 2. Tema","sourcePdfId":"pdf-tar-dk"},{"id":"q-tde-2","subjectId":"edebiyat","topicId":"tde-10-1-1","outcomeCode":"TDE.10.2","scenarios":"Ülke Geneli Ortak Yazılı Sınav","difficulty":2,"type":"fill_blank","questionText":"Divan edebiyatı nazım biçimlerinden gazel ve kasidede kendi arasında kafiyeli (aa) olan ilk beyte ________ adı verilir.","correctAnswer":"matla","acceptableAnswers":["matla","matla beyti"],"explanation":"Gazel ve kasidenin ilk beytine \"doğuş yeri\" anlamında Matla (aa), son beytine ise \"kesiliş/bitiş yeri\" anlamında Makta denir.","weaknessTag":"Gazel ve Kaside Yapısal Kavramları (TDE.10.2)","studyRecommendation":"2. Tema Kelimelerin Ritmi içindeki Matla, Makta, Beytül-gazel, Tac beyit ve Mahlas kavramlarını tekrar edin.","sourceCitation":"MEB 10. Sınıf Türk Dili ve Edebiyatı Ortak Sınav Konuları · 2. Tema","sourcePdfId":"pdf-tar-dk"},{"id":"q-alm-1","subjectId":"almanca","topicId":"alm-5-1","outcomeCode":"ALM.A1.1.5.B","scenarios":"5. Ünite: Essen und Trinken (Sayfa 59 & 102)","difficulty":1,"type":"multiple_choice","questionText":"Almanca ders kitabı 5. Ünite (Sayfa 59 ve 102) dil bilgisi kurallarına göre; \"Burak ________ gerne Orangen, ________ er trinkt keinen Orangensaft.\" cümlesindeki boşluklara sırasıyla aşağıdakilerden hangisi gelmelidir?","options":["isst — aber","esse — und","essen — aber","magst — oder"],"correctAnswer":"isst — aber","explanation":"3. tekil şahıs olan \"Burak (er)\" öznesinde \"essen\" fiili düzensiz çekimlenerek \"isst\" olur. İlk cümle olumlu (\"gerne Orangen\" - portakalı severek yer), ikinci cümle olumsuz (\"keinen Orangensaft\" - portakal suyu içmez) olduğu için zıtlık bildiren \"aber\" (ama/fakat) bağlacı kullanılır.","weaknessTag":"Konjunktion „aber“ ve „essen“ Fiil Çekimi (ALM.A1.1.5.B)","studyRecommendation":"Almanca Ders Kitabı Sayfa 59 ve Sayfa 102’deki \"Burak isst gerne Orangen, aber trinkt keinen Orangensaft\" kural kutusunu tekrar edin.","sourceCitation":"MEB Almanca A1.1 Ders Kitabı · 5. Ünite (Themenkreis 5) · Sayfa 59 & 102","sourcePdfId":"pdf-alm-dk"},{"id":"q-alm-2","subjectId":"almanca","topicId":"alm-5-1","outcomeCode":"ALM.A1.1.5.B","scenarios":"5. Ünite: Essen und Trinken (Sayfa 59 & 102)","difficulty":1,"type":"fill_blank","questionText":"Almancada bir yiyeceği sevdiğimizi ifade eden \"mögen\" modal fiilinin \"ich\" (ben) ve \"er/sie/es\" (o) şahıslarına göre çekimlenmiş hâli ________ kelimesidir.","correctAnswer":"mag","acceptableAnswers":["mag"],"explanation":"\"mögen\" modal fiilinin şimdiki zaman (Präsens) çekiminde 1. tekil şahıs (ich) ve 3. tekil şahıs (er/sie/es) aynıdır ve sonuna -t eki almaz: ich mag, du magst, er/sie/es mag, wir mögen, ihr mögt, sie/Sie mögen.","weaknessTag":"Modalverb „mögen“ Çekimi (ALM.A1.1.5.B)","studyRecommendation":"Almanca Ders Kitabı Sayfa 59 ve Sayfa 102’deki \"Modalverb: mögen\" tablosunu inceleyin.","sourceCitation":"MEB Almanca A1.1 Ders Kitabı · 5. Ünite (Themenkreis 5) · Sayfa 59 & 102","sourcePdfId":"pdf-alm-dk"},{"id":"q-alm-3","subjectId":"almanca","topicId":"alm-5-2","outcomeCode":"ALM.A1.1.5.C","scenarios":"5. Ünite: Essen und Trinken (Sayfa 60 & 62)","difficulty":2,"type":"multiple_choice","questionText":"Alışverişte fiyat sorarken kullanılan \"Wie viel ...?\" kalıbı ve ölçü birimleri (Mengenangaben) dikkate alındığında aşağıdaki cümlelerden hangisi dil bilgisi ve anlam bakımından DOĞRUDUR?","options":["Wie viel kosten zwei Kilo Äpfel? — Zwei Kilo Äpfel kosten zwei Euro und achtundneunzig Cent.","Wie viel kostet die Äpfel? — Es kosten ein Euro.","Wie viel kosten die Milch? — Die Milch kosten neunzig Cent.","Ich brauche ein Bund Butter und ein Stück Petersilie."],"correctAnswer":"Wie viel kosten zwei Kilo Äpfel? — Zwei Kilo Äpfel kosten zwei Euro und achtundneunzig Cent.","explanation":"Kitap Sayfa 60’ta yer alan orijinal örnekte olduğu gibi \"zwei Kilo Äpfel\" çoğul olduğu için hem soruda hem cevapta \"kosten\" kullanılır. \"die Milch\" tekil olduğu için \"kostet\" almalıdır; ayrıca tereyağı için \"ein Stück Butter\", maydanoz için \"ein Bund Petersilie\" kullanılır.","weaknessTag":"Fiyat Sorma „Wie viel kostet/kosten“ ve Mengenangaben (ALM.A1.1.5.C)","studyRecommendation":"Almanca Ders Kitabı Sayfa 60’taki \"W-Frage: Wie viel\", \"Mengenangaben\" ve \"Preisangaben\" tablolarını tekrar edin.","sourceCitation":"MEB Almanca A1.1 Ders Kitabı · 5. Ünite (Themenkreis 5) · Sayfa 60","sourcePdfId":"pdf-alm-dk"},{"id":"q-alm-4","subjectId":"almanca","topicId":"alm-5-1","outcomeCode":"ALM.A1.1.5.A","scenarios":"5. Ünite: Essen und Trinken (Sayfa 57)","difficulty":2,"type":"true_false","questionText":"Almanca 5. Ünite (Sayfa 57) kurallarına göre \"das Obst\" (meyve) ve \"das Gemüse
